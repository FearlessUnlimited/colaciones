    manoObraPorPorcion: 0,    // CLP mano de obra por porción (0 = trabajo propio no valorizado)
    repartoPorPedido: 0,      // CLP costo de reparto por pedido (bencina/moto)
    ivaOn: false,             // true = el PVP incluye IVA y el margen se calcula sobre el neto
    ivaPct: 19,
    comisionPct: 0,           // % comisión de pago (transferencia/tarjeta) sobre PVP
    foodCostObjetivo: 35,     // % objetivo de ingredientes sobre precio neto
    foodCostAlerta: 42,       // % sobre el cual el plato se marca en alerta
    redondeo: 100,            // el PVP sugerido se redondea hacia arriba a múltiplos de esto
    modoOferta: 'preferida',  // preferida | barata | promedio
    precioViejoDias: 30,      // días tras los cuales un precio se considera desactualizado
    porcionesSemana: 100,     // volumen semanal supuesto (reparto parejo) para estimar ahorros
    stockMaxSemanas: 8,       // compras de oportunidad: máximo de semanas de consumo que conviene guardar
    costosFijosMes: 0,        // CLP costos fijos mensuales (para punto de equilibrio)
    diasOperacionMes: 22,
    trilogiaPrecio: 2000,     // precio adicional del combo Entrada+Ensalada+Postre
    ivaRecuperable: 'potencial', // no | potencial | si — 'si': lo comprado con factura se costea sin IVA (crédito fiscal)
    hoy: null                 // ISO yyyy-mm-dd; null = fecha actual
  };

  const TIPOS_VENDIBLES = ['plato', 'entrada', 'ensalada', 'postre', 'acompanamiento'];
  const DIETA_NIVEL = { vegano: 0, vegetariano: 1, omni: 2 };
  const LINEA_NIVEL_MAX = { 'Vegano': 0, 'Vegetariano': 1 };

  function params(state, opts) {
    return Object.assign({}, DEFAULT_PARAMS, state.params || {}, (opts && opts.params) || {});
  }

  // fecha local (no UTC: en Chile de noche UTC ya es el día siguiente)
  function hoyISO(p) {
    if (p.hoy) return p.hoy;
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }

  function diasEntre(a, b) {
    return Math.round((Date.parse(b) - Date.parse(a)) / 86400000);
  }

  /* ---------- índice / contexto ---------- */
  function makeCtx(state, opts) {
    opts = opts || {};
    const ctx = {
      state: state, opts: opts, p: params(state, opts),
      insumos: new Map(), ofertas: new Map(), ofertasPorInsumo: new Map(), recetas: new Map(),
      proveedores: new Map(), provPorNombre: indiceProveedores(state.proveedores),
      memoInsumo: new Map(), memoReceta: new Map(), errors: []
    };
    (state.proveedores || []).forEach(function (p) { ctx.proveedores.set(p.id, p); });
    (state.insumos || []).forEach(function (i) { ctx.insumos.set(i.id, i); });
    (state.ofertas || []).forEach(function (o) {
      ctx.ofertas.set(o.id, o);
      if (!ctx.ofertasPorInsumo.has(o.insumoId)) ctx.ofertasPorInsumo.set(o.insumoId, []);
      ctx.ofertasPorInsumo.get(o.insumoId).push(o);
    });
    (state.recetas || []).forEach(function (r) { ctx.recetas.set(r.id, r); });
    return ctx;
  }

  /* ---------- proveedores ---------- */
  const SEMANAS_MES = 4.33;

  function normNombre(s) {
    return String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, ' ').trim();
  }
  // Texto equivalente al ya existente (sin importar mayúsculas, tildes, guiones ni espacios dobles): devuelve el existente.
  // Así "lentejas", "Lentejas" y " lentejas " son una sola familia, categoría o línea.
  function canonico(existentes, texto) {
    const t = String(texto == null ? '' : texto).replace(/\s+/g, ' ').trim();
    const k = normNombre(t);
    if (!k) return t;
    const hit = (existentes || []).find(function (e) { return e && normNombre(e) === k; });
    return hit || t;
  }
  function distancia(a, b) {
    if (a === b) return 0;
    let prev = []; for (let j = 0; j <= b.length; j++) prev.push(j);
    for (let i = 1; i <= a.length; i++) {
      const cur = [i];
      for (let j = 1; j <= b.length; j++) cur.push(Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)));
      prev = cur;
    }
    return prev[b.length];
  }
  // ¿ya existe algo igual o muy parecido a este texto? (para avisar antes de crear un duplicado)
  // parecido = uno contiene al otro, o difieren en 1–2 letras ignorando espacios ("Lentejas 4mm" ≈ "Lenteja 4 mm")
  function parecidos(items, texto) {
    const k = normNombre(texto), kc = k.replace(/ /g, '');
    const r = { igual: null, parecidos: [] };
    if (kc.length < 3) return r;
    const vistos = new Set();
    (items || []).forEach(function (v) {
      const n = normNombre(v), nc = n.replace(/ /g, '');
      if (!nc || vistos.has(n)) return;
      vistos.add(n);
      if (n === k) { r.igual = v; return; }
      // números distintos = productos distintos (4mm ≠ 6mm), aunque el resto se parezca
      if (nc.replace(/\D/g, '') !== kc.replace(/\D/g, '')) return;
      const cerca = distancia(nc, kc) <= (Math.max(nc.length, kc.length) >= 8 ? 2 : 1);
      const contiene = (nc.length >= 4 && kc.length >= 4) && (nc.indexOf(kc) >= 0 || kc.indexOf(nc) >= 0);
      if (cerca || contiene) r.parecidos.push(v);
    });
    r.parecidos = r.parecidos.slice(0, 4);
    return r;
  }

  // Une las variantes ya guardadas de familia, categoría y línea de menú: gana la más usada (a igualdad, la primera).
  function unificarTextos(state) {
    let cambios = 0;
    const unir = function (lista, campo) {
      const grupos = new Map();
      lista.forEach(function (x) {
        const v = x[campo];
        if (typeof v !== 'string' || !normNombre(v)) return;
        const k = normNombre(v);
        if (!grupos.has(k)) grupos.set(k, new Map());
        const g = grupos.get(k); g.set(v, (g.get(v) || 0) + 1);
      });
      const ganador = new Map();
      grupos.forEach(function (g, k) {
        let mejor = null, n = -1;
        g.forEach(function (c, v) { if (c > n) { mejor = v; n = c; } });
        ganador.set(k, mejor);
      });
      lista.forEach(function (x) {
        const v = x[campo];
        if (typeof v !== 'string' || !normNombre(v)) return;
        const w = ganador.get(normNombre(v));
        if (w !== v) { x[campo] = w; cambios++; }
      });
    };
    unir(state.insumos || [], 'familia');
    unir(state.insumos || [], 'categoria');
    unir(state.recetas || [], 'linea');
    return cambios;
  }

  // id determinista: dos usuarios que migran los mismos datos generan el mismo proveedor
  function idProveedor(nombre) { return 'PRV-' + normNombre(nombre).replace(/ /g, '-'); }

  function adivinarProveedor(nombre) {
    const n = normNombre(nombre);
    if (/supermercado|lider|jumbo|unimarc|tottus|santa isabel/.test(n)) return { tipo: 'supermercado', factura: 'si' };
    if (/distribuidora|empaque/.test(n)) return { tipo: 'distribuidora', factura: 'si' };
    if (/mayorista|alvi/.test(n)) return { tipo: 'mayorista', factura: 'si' };
    if (/feria|vega|caleta|mercado|cardonal/.test(n)) return { tipo: 'feria', factura: 'no' };
    if (/carniceria|polleria|pescaderia|tostaduria/.test(n)) return { tipo: 'carniceria', factura: 'a_pedido' };
    return { tipo: 'otro', factura: 'a_pedido' };
  }

  function nuevoProveedor(nombre, extra) {
    const g = adivinarProveedor(nombre);
    return Object.assign({ id: idProveedor(nombre), nombre: String(nombre || '').trim(), alias: [], tipo: g.tipo, factura: g.factura,
      despacho: { ofrece: false, costo: 0, gratisDesde: null, minimoPedido: null }, retiro: true, costoVisita: 0,
      contacto: '', nota: '', activo: true }, extra || {});
  }

  // nombre o alias normalizado → proveedor
  function indiceProveedores(lista) {
    const m = new Map();
    (lista || []).forEach(function (p) {
      m.set(normNombre(p.nombre), p);
      (p.alias || []).forEach(function (a) { const k = normNombre(a); if (k && !m.has(k)) m.set(k, p); });
    });
    return m;
  }

  // Crea los proveedores que faltan para los "lugar" de las ofertas (id determinista). No modifica las ofertas:
  // la relación oferta → proveedor se resuelve por proveedorId o, si no hay, por nombre/alias.
  function asegurarProveedores(state) {
    state.proveedores = state.proveedores || [];
    const idx = indiceProveedores(state.proveedores);
    const ids = new Set(state.proveedores.map(function (p) { return p.id; }));
    let creados = 0;
    (state.ofertas || []).forEach(function (o) {
      if (o.proveedorId && ids.has(o.proveedorId)) return;
      const k = normNombre(o.lugar);
      if (!k || idx.has(k)) return;
      const p = nuevoProveedor(o.lugar);
      if (ids.has(p.id)) return;
      state.proveedores.push(p); idx.set(k, p); ids.add(p.id); creados++;
    });
    return creados;
  }

  function proveedorDe(ctx, o) {
    if (!o) return null;
    return (o.proveedorId && ctx.proveedores.get(o.proveedorId)) || ctx.provPorNombre.get(normNombre(o.lugar)) || null;
  }
  function daFactura(p) { return !!p && p.factura !== 'no'; }   // 'a_pedido' cuenta: basta pedirla
  function factorIva(ctx) { return 1 + (Number(ctx.p.ivaPct) || 0) / 100; }
  function ivaAplica(ctx) { return ctx.p.ivaRecuperable === 'si' || !!ctx.opts.simularIva; }
  function divisorIva(ctx, prov) { return ivaAplica(ctx) && daFactura(prov) ? factorIva(ctx) : 1; }

  /* ---------- insumos y ofertas ---------- */
  function precioOferta(ctx, o) {
    const ov = ctx.opts.precios && ctx.opts.precios[o.id];
    return ov != null ? ov : o.precio;
  }

  // costo por unidad base utilizable de una oferta, tal como se paga (IVA incluido si lo trae)
  function costoBrutoOferta(ctx, o) {
    const ins = ctx.insumos.get(o.insumoId);
    const rend = o.rendimiento != null ? o.rendimiento : (ins && ins.rendimiento != null ? ins.rendimiento : 1);
    const denom = (o.formatoQty || 0) * (rend || 1);
    return denom > 0 ? precioOferta(ctx, o) / denom : 0;
  }

  // costo neto (después de merma y, si el negocio recupera IVA y el proveedor da factura, sin IVA) por unidad base
  function costoNetoOferta(ctx, o) {
    return costoBrutoOferta(ctx, o) / divisorIva(ctx, proveedorDe(ctx, o));
  }

  // ofertas utilizables: disponibles y ya revisadas (una cotización "pendiente" no entra a los costos hasta aprobarla)
  // ofertas temporales: valen hasta temporal.hasta (inclusive); vencidas no entran a los costos (quedan en el historial)
  function ofertaVencida(ctx, o) { return !!(o.temporal && o.temporal.hasta && o.temporal.hasta < hoyISO(ctx.p)); }
  function diasParaVencer(ctx, o) { return o.temporal && o.temporal.hasta ? diasEntre(hoyISO(ctx.p), o.temporal.hasta) : null; }
  // oferta temporal que el administrador decidió usar mientras dure
  function oportunidadActiva(ctx, o) {
    return !!(o.temporal && o.usarMientrasDure && !o.pendiente && o.disponible !== false && !ofertaVencida(ctx, o));
  }

  function ofertasDisponibles(ctx, insumoId) {
    return (ctx.ofertasPorInsumo.get(insumoId) || []).filter(function (o) {
      return o.disponible !== false && !o.pendiente && !ofertaVencida(ctx, o) && !(ctx.opts.sinOportunidades && o.temporal);
    });
  }

  // oferta/costo vigente de un insumo según modo (preferida | barata | promedio) o fijación de escenario
  function costoInsumo(ctx, insumoId) {
    if (ctx.memoInsumo.has(insumoId)) return ctx.memoInsumo.get(insumoId);
    let res = { unit: 0, oferta: null, missing: true, modo: ctx.p.modoOferta };
    const pin = ctx.opts.ofertaElegida && ctx.opts.ofertaElegida[insumoId];
    let lista = ofertasDisponibles(ctx, insumoId);
    if (!lista.length) lista = (ctx.ofertasPorInsumo.get(insumoId) || []).filter(function (o) { return !o.pendiente && !o.temporal; });
    // escenario (simulación) > oferta temporal en uso mientras dure > modo normal
    const oport = ctx.opts.sinOportunidades ? [] : (ctx.ofertasPorInsumo.get(insumoId) || []).filter(function (o) { return oportunidadActiva(ctx, o); })
      .map(function (o) { return { o: o, c: costoNetoOferta(ctx, o) }; }).filter(function (x) { return x.c > 0; });
    if (pin && ctx.ofertas.get(pin)) {
      const o = ctx.ofertas.get(pin);
      res = { unit: costoNetoOferta(ctx, o), oferta: o, missing: false, modo: 'fijada' };
    } else if (oport.length) {
      const b = oport.reduce(function (a, x) { return x.c < a.c ? x : a; });
      res = { unit: b.c, oferta: b.o, missing: false, modo: 'oportunidad' };
    } else if (lista.length) {
      const costos = lista.map(function (o) { return { o: o, c: costoNetoOferta(ctx, o) }; });
      const barata = costos.reduce(function (a, b) { return b.c < a.c ? b : a; });
      if (ctx.p.modoOferta === 'barata') {
        res = { unit: barata.c, oferta: barata.o, missing: false, modo: 'barata' };
      } else if (ctx.p.modoOferta === 'promedio') {
        const avg = costos.reduce(function (s, x) { return s + x.c; }, 0) / costos.length;
        res = { unit: avg, oferta: null, missing: false, modo: 'promedio' };
      } else {
        const pref = costos.find(function (x) { return x.o.preferida; }) || barata;
        res = { unit: pref.c, oferta: pref.o, missing: false, modo: 'preferida' };
      }
      if (res.unit <= 0) res.missing = true; // precio 0 = sin precio
    }
    ctx.memoInsumo.set(insumoId, res);
    return res;
  }

  /* ---------- recetas ---------- */
  function costoReceta(ctx, id, stack) {
    stack = stack || [];
    if (ctx.memoReceta.has(id)) return ctx.memoReceta.get(id);
    const r = ctx.recetas.get(id);
    const vacio = { id: id, lote: 0, porPorcion: 0, min: 0, max: 0, lineas: [], faltantes: [], ciclo: false };
    if (!r) return vacio;
    if (stack.indexOf(id) >= 0) {
      ctx.errors.push('Ciclo de sub-recetas: ' + stack.concat(id).join(' → '));
      return Object.assign({}, vacio, { ciclo: true });
    }
    const porciones = r.porciones > 0 ? r.porciones : 1;
    const sust = (ctx.opts.sust && ctx.opts.sust[id]) || {};
    const out = { id: id, lote: 0, porPorcion: 0, min: 0, max: 0, lineas: [], faltantes: [], ciclo: false };
    const st = stack.concat(id);

    (r.lineas || []).forEach(function (ln, idx) {
      const ref = sust[idx] || ln.ref;
      const fila = costoLinea(ctx, ln.tipo, ref, ln.cantidad, st);
      // alternativas declaradas en la línea → rango min/max
      let mn = fila.subtotal, mx = fila.subtotal;
      if (ln.alternativas && ln.alternativas.length) {
        ln.alternativas.forEach(function (alt) {
          const f2 = costoLinea(ctx, ln.tipo, alt, ln.cantidad, st);
          if (f2.subtotal < mn) mn = f2.subtotal;
          if (f2.subtotal > mx) mx = f2.subtotal;
        });
      }
      fila.idx = idx; fila.nota = ln.nota || ''; fila.refOriginal = ln.ref; fila.sustituido = !!sust[idx];
      fila.min = mn; fila.max = mx; fila.borrador = !!ln.borrador;
      out.lote += fila.subtotal; out.min += mn; out.max += mx;
      if (fila.ciclo) out.ciclo = true;
      if (fila.missing) out.faltantes.push(fila.nombre);
      out.lineas.push(fila);
    });

    if (!(r.lineas && r.lineas.length) && r.costoManual != null) {
      out.lote = r.costoManual * porciones; out.min = out.lote; out.max = out.lote; out.manual = true;
    }
    out.porPorcion = out.lote / porciones;
    out.minPorPorcion = out.min / porciones;
    out.maxPorPorcion = out.max / porciones;
    out.lineas.forEach(function (f) { f.porPorcion = f.subtotal / porciones; });
    ctx.memoReceta.set(id, out);
    return out;
  }

  function costoLinea(ctx, tipo, ref, cantidad, stack) {
    cantidad = Number(cantidad) || 0;
    if (tipo === 'receta') {
      const sub = costoReceta(ctx, ref, stack);
      const rr = ctx.recetas.get(ref);
      return { tipo: 'receta', ref: ref, nombre: rr ? rr.nombre : ('(receta ' + ref + ')'), cantidad: cantidad,
        unidad: 'porc', unitCost: sub.porPorcion, subtotal: cantidad * sub.porPorcion, oferta: null,
        missing: !rr || sub.faltantes.length > 0, ciclo: !!sub.ciclo };
    }
    const ins = ctx.insumos.get(ref);
    const c = costoInsumo(ctx, ref);
    return { tipo: 'insumo', ref: ref, nombre: ins ? ins.nombre : ('(insumo ' + ref + ')'), cantidad: cantidad,
      unidad: ins ? ins.unidad : '', unitCost: c.unit, subtotal: cantidad * c.unit, oferta: c.oferta, missing: c.missing || !ins };
  }

  /* ---------- plato (receta vendible) ---------- */
  function costoPlato(ctx, id, guarnicionId) {
    const r = ctx.recetas.get(id);
    const p = ctx.p;
    const rc = costoReceta(ctx, id);
    const gid = guarnicionId !== undefined ? guarnicionId : (r ? r.guarnicionDefault : null);
    const g = gid ? costoReceta(ctx, gid) : null;
    const guarn = g ? g.porPorcion : 0;

    let envase = 0, envaseFalta = false;
    if (r && r.envaseId) {
      const e = costoInsumo(ctx, r.envaseId);
      envase = e.unit * (r.envaseCant || 1);
      envaseFalta = e.missing;
    } else if (r && r.envaseManual != null) {
      envase = r.envaseManual;
    } else { envaseFalta = true; }

    const base = rc.porPorcion + guarn;
    const imprev = base * p.imprevistosPct / 100;
    const insumosTot = base + imprev;
    const overhead = (p.gasPorPorcion || 0) + (p.manoObraPorPorcion || 0);
    const pvp = r ? Number(r.pvp) || 0 : 0;
    const pvpNeto = p.ivaOn ? pvp / (1 + p.ivaPct / 100) : pvp;
    const comision = pvp * p.comisionPct / 100;
    const costoDirecto = insumosTot + envase;
    const costoTotal = costoDirecto + overhead + comision;
    const margen = pvpNeto - costoTotal;
    const margenPct = pvpNeto > 0 ? margen / pvpNeto * 100 : null;
    const foodCostPct = pvpNeto > 0 ? insumosTot / pvpNeto * 100 : null;

    // PVP sugerido por food cost objetivo (redondeado hacia arriba)
    const netoSug = insumosTot / (p.foodCostObjetivo / 100);
    let sug = p.ivaOn ? netoSug * (1 + p.ivaPct / 100) : netoSug;
    const rnd = p.redondeo > 0 ? p.redondeo : 1;
    const pvpSugerido = insumosTot > 0 ? Math.ceil(sug / rnd) * rnd : 0;
    // PVP mínimo (margen $0)
    const k = (p.ivaOn ? 1 / (1 + p.ivaPct / 100) : 1) - p.comisionPct / 100;
    const pvpMinimo = k > 0 ? (costoDirecto + overhead) / k : 0;

    return {
      id: id, nombre: r ? r.nombre : '', insumos: rc.porPorcion, guarnicion: guarn, guarnicionId: gid || null,
      envase: envase, imprevistos: imprev, overhead: overhead, comision: comision,
      costoDirecto: costoDirecto, costoTotal: costoTotal, pvp: pvp, pvpNeto: pvpNeto,
      margen: margen, margenPct: margenPct, foodCostPct: foodCostPct,
      pvpSugerido: pvpSugerido, pvpMinimo: pvpMinimo,
      rango: { min: (rc.minPorPorcion + guarn) * (1 + p.imprevistosPct / 100) + envase + overhead + comision,
               max: (rc.maxPorPorcion + guarn) * (1 + p.imprevistosPct / 100) + envase + overhead + comision },
      faltantes: rc.faltantes.concat(g ? g.faltantes : []), envaseFalta: envaseFalta, ciclo: rc.ciclo
    };
  }

  function esVendible(r) { return TIPOS_VENDIBLES.indexOf(r.tipo) >= 0; }

  function calcularTodo(state, opts) {
    const ctx = makeCtx(state, opts);
    const out = new Map();
    state.recetas.forEach(function (r) { if (esVendible(r)) out.set(r.id, costoPlato(ctx, r.id)); });
    out.ctx = ctx;
    return out;
  }

  /* ---------- guarniciones ---------- */
  function opcionesGuarnicion(ctx, id) {
    const r = ctx.recetas.get(id);
    if (!r) return [];
    const ids = (r.guarnicionesPermitidas || []).slice();
    return ids.map(function (gid) {
      const c = costoPlato(ctx, id, gid);
      const gr = ctx.recetas.get(gid);
      return { id: gid, nombre: gr ? gr.nombre : gid, costoGuarnicion: c.guarnicion, costoTotal: c.costoTotal,
        margen: c.margen, margenPct: c.margenPct, esDefecto: gid === r.guarnicionDefault };
    });
  }

  /* ---------- explosión de insumos (cantidades utilizables) ---------- */
  function explotar(ctx, id, mult, acc, stack) {
    acc = acc || new Map(); stack = stack || [];
    const r = ctx.recetas.get(id);
    if (!r || stack.indexOf(id) >= 0) return acc;
    const porciones = r.porciones > 0 ? r.porciones : 1;
    const sust = (ctx.opts.sust && ctx.opts.sust[id]) || {};
    (r.lineas || []).forEach(function (ln, idx) {
      const ref = sust[idx] || ln.ref;
      const q = (Number(ln.cantidad) || 0) * mult / porciones;
      if (ln.tipo === 'receta') {
        const sr = ctx.recetas.get(ref); const sp = sr && sr.porciones > 0 ? sr.porciones : 1;
        // ln.cantidad = porciones consumidas de la sub-receta; explotar su lote proporcional
        explotar(ctx, ref, q * sp, acc, stack.concat(id));
      } else {
        acc.set(ref, (acc.get(ref) || 0) + q);
      }
    });
    return acc;
  }

  // insumos por 1 porción vendida (incluye guarnición por defecto y envase)
  function explotarPlato(ctx, id, porciones) {
    porciones = porciones == null ? 1 : porciones;
    const r = ctx.recetas.get(id);
    const acc = explotar(ctx, id, porciones, new Map(), []);
    if (r && r.guarnicionDefault) explotar(ctx, r.guarnicionDefault, porciones, acc, []);
    if (r && r.envaseId) acc.set(r.envaseId, (acc.get(r.envaseId) || 0) + (r.envaseCant || 1) * porciones);
    return acc;
  }

  function usosDeInsumo(ctx, insumoId) {
    const res = [];
    ctx.state.recetas.forEach(function (r) {
      if (!esVendible(r)) return;
      const q = explotarPlato(ctx, r.id, 1).get(insumoId);
      if (q) res.push({ recetaId: r.id, nombre: r.nombre, linea: r.linea, tipo: r.tipo, cantidad: q });
    });
    return res.sort(function (a, b) { return b.cantidad - a.cantidad; });
  }

  /* ---------- impacto de un cambio (precio, oferta fijada, sustitución) ---------- */
  function impacto(state, cambio, opts) {
    const base = calcularTodo(state, opts);
    const merged = Object.assign({}, opts || {});
    ['precios', 'ofertaElegida', 'sust', 'params'].forEach(function (k) {
      if (cambio[k]) merged[k] = Object.assign({}, (opts && opts[k]) || {}, cambio[k]);
    });
    if (cambio.sust) {
      merged.sust = Object.assign({}, (opts && opts.sust) || {});
      Object.keys(cambio.sust).forEach(function (rid) {
        merged.sust[rid] = Object.assign({}, (opts && opts.sust && opts.sust[rid]) || {}, cambio.sust[rid]);
      });
    }
    const nuevo = calcularTodo(state, merged);
    const filas = [];
    base.forEach(function (b, id) {
      const n = nuevo.get(id);
      if (!n) return;
      const d = n.costoTotal - b.costoTotal;
      if (Math.abs(d) > 0.005) {
        filas.push({ id: id, nombre: b.nombre, costoAntes: b.costoTotal, costoDespues: n.costoTotal, delta: d,
          margenAntes: b.margen, margenDespues: n.margen, margenPctAntes: b.margenPct, margenPctDespues: n.margenPct });
      }
    });
    filas.sort(function (a, b) { return Math.abs(b.delta) - Math.abs(a.delta); });
    return { filas: filas, afectados: filas.length, deltaMedio: filas.length ? filas.reduce(function (s, f) { return s + f.delta; }, 0) / filas.length : 0 };
  }

  /* ---------- dieta ---------- */
  function nivelDieta(ins) { return DIETA_NIVEL[ins && ins.dieta] != null ? DIETA_NIVEL[ins.dieta] : 0; }

  // insumos (directos o vía sub-recetas) que violan la línea dietaria de la receta
  function violacionesDieta(ctx, id) {
    const r = ctx.recetas.get(id);
    if (!r || LINEA_NIVEL_MAX[r.linea] == null) return [];
    const maxNivel = LINEA_NIVEL_MAX[r.linea];
    const acc = explotarPlato(ctx, id, 1);
    const out = [];
    acc.forEach(function (q, insId) {
      const ins = ctx.insumos.get(insId);
      if (ins && ins.categoria !== 'Envases' && nivelDieta(ins) > maxNivel) out.push(ins.nombre);
    });
    return out;
  }

  function dietaCompatible(ctx, receta, insumo) {
    if (!receta || LINEA_NIVEL_MAX[receta.linea] == null) return true;
    return nivelDieta(insumo) <= LINEA_NIVEL_MAX[receta.linea];
  }

  /* ---------- alternativas de producto ---------- */
  // Para cada línea de insumo de una receta: otras ofertas del mismo insumo + sustitutos de la misma familia
  function alternativasReceta(ctx, id) {
    const r = ctx.recetas.get(id);
    if (!r) return [];
    const porciones = r.porciones > 0 ? r.porciones : 1;
    const res = [];
    (r.lineas || []).forEach(function (ln, idx) {
      if (ln.tipo !== 'insumo') return;
      const ins = ctx.insumos.get(ln.ref);
      if (!ins) return;
      const actual = costoInsumo(ctx, ln.ref);
      const q = (Number(ln.cantidad) || 0) / porciones;
      const opciones = [];
      (ctx.ofertasPorInsumo.get(ln.ref) || []).forEach(function (o) {
        if (o.disponible === false || o.pendiente) return;
        if (actual.oferta && o.id === actual.oferta.id) return;
        const c = costoNetoOferta(ctx, o);
        opciones.push({ tipo: 'oferta', insumoId: ln.ref, ofertaId: o.id, nombre: ins.nombre, lugar: o.lugar, marca: o.marca,
          unit: c, deltaPorPorcion: (c - actual.unit) * q });
      });
      if (ins.familia) {
        ctx.state.insumos.forEach(function (s) {
          if (s.id === ins.id || normNombre(s.familia) !== normNombre(ins.familia) || s.unidad !== ins.unidad) return;
          if (!dietaCompatible(ctx, r, s)) return;
          const c = costoInsumo(ctx, s.id);
          if (c.missing) return;
          opciones.push({ tipo: 'sustituto', insumoId: s.id, ofertaId: c.oferta ? c.oferta.id : null, nombre: s.nombre,
            lugar: c.oferta ? c.oferta.lugar : '', marca: c.oferta ? c.oferta.marca : '', unit: c.unit,
            deltaPorPorcion: (c.unit - actual.unit) * q });
        });
      }
      opciones.sort(function (a, b) { return a.deltaPorPorcion - b.deltaPorPorcion; });
      res.push({ idx: idx, ref: ln.ref, nombre: ins.nombre, cantidad: ln.cantidad, unidad: ins.unidad, actual: actual,
        costoLinea: (Number(ln.cantidad) || 0) * actual.unit / porciones, opciones: opciones });
    });
    return res;
  }

  // porciones semanales por plato: plan semanal si existe, si no reparto parejo de porcionesSemana
  function volumenSemanal(ctx) {
    const vol = new Map();
    const plan = ctx.state.plan;
    let usoPlan = false;
    if (plan) {
      Object.keys(plan).forEach(function (dia) {
        (plan[dia] || []).forEach(function (it) {
          if (!ctx.recetas.get(it.recetaId)) return;
          vol.set(it.recetaId, (vol.get(it.recetaId) || 0) + (Number(it.porciones) || 0)); usoPlan = true;
        });
      });
    }
    if (!usoPlan) {
      const activos = ctx.state.recetas.filter(function (r) { return r.tipo === 'plato' && r.activo !== false; });
      activos.forEach(function (r) { vol.set(r.id, ctx.p.porcionesSemana / (activos.length || 1)); });
    }
    return { vol: vol, usoPlan: usoPlan };
  }

  function usoSemanalInsumos(ctx) {
    const v = volumenSemanal(ctx);
    const total = new Map();
    v.vol.forEach(function (porc, rid) {
      explotarPlato(ctx, rid, porc).forEach(function (q, ins) { total.set(ins, (total.get(ins) || 0) + q); });
    });
    return { uso: total, usoPlan: v.usoPlan };
  }

  // ahorro posible por comprar cada insumo en su oferta más barata
  function ahorrosPosibles(ctx) {
    const u = usoSemanalInsumos(ctx);
    const res = [];
    ctx.state.insumos.forEach(function (ins) {
      const ofs = ofertasDisponibles(ctx, ins.id);
      if (ofs.length < 2) return;
      const actual = costoInsumo(ctx, ins.id);
      if (actual.missing) return;
      const costos = ofs.map(function (o) { return { o: o, c: costoNetoOferta(ctx, o) }; }).filter(function (x) { return x.c > 0; });
      if (!costos.length) return;
      const mejor = costos.reduce(function (a, b) { return b.c < a.c ? b : a; });
      const dif = actual.unit - mejor.c;
      const semanal = u.uso.get(ins.id) || 0;
      if (dif > 0.0001 && (!actual.oferta || mejor.o.id !== actual.oferta.id)) {
        res.push({ insumoId: ins.id, nombre: ins.nombre, actual: actual, mejor: mejor.o, mejorUnit: mejor.c,
          ahorroUnit: dif, ahorroPct: actual.unit > 0 ? dif / actual.unit * 100 : 0,
          usoSemanal: semanal, ahorroMes: dif * semanal * 4.33 });
      }
    });
    res.sort(function (a, b) { return b.ahorroMes - a.ahorroMes; });
    return { filas: res, usoPlan: u.usoPlan };
  }

  // peso de cada insumo en el costo total de la carta (por volumen semanal)
  function pesoEnCosto(ctx) {
    const u = usoSemanalInsumos(ctx);
    const filas = [];
    let total = 0;
    u.uso.forEach(function (q, id) {
      const ins = ctx.insumos.get(id); if (!ins) return;
      const c = costoInsumo(ctx, id);
      const costo = q * c.unit; total += costo;
      filas.push({ insumoId: id, nombre: ins.nombre, categoria: ins.categoria, costoSemana: costo });
    });
    filas.forEach(function (f) { f.pct = total > 0 ? f.costoSemana / total * 100 : 0; });
    filas.sort(function (a, b) { return b.costoSemana - a.costoSemana; });
    return { filas: filas, total: total };
  }

  /* ---------- lista de compras ---------- */
  function listaCompras(ctx, items) {
    // items: [{recetaId, porciones}]
    const acc = new Map();
    items.forEach(function (it) {
      if (!ctx.recetas.get(it.recetaId)) return;
      explotarPlato(ctx, it.recetaId, Number(it.porciones) || 0).forEach(function (q, ins) {
        acc.set(ins, (acc.get(ins) || 0) + q);
      });
    });
    const filas = [], stock = sobrestockVigente(ctx);
    acc.forEach(function (necesario, insId) {
      const ins = ctx.insumos.get(insId); if (!ins) return;
      const st = stock.get(insId);
      const cubierto = st ? Math.min(necesario, st.restante) : 0;
      const usable = necesario - cubierto;
      const c = costoInsumo(ctx, insId);
      const o = c.oferta;
      const rend = o ? (o.rendimiento != null ? o.rendimiento : (ins.rendimiento != null ? ins.rendimiento : 1)) : 1;
      const comprarBase = rend > 0 ? usable / rend : usable;
      const formato = o && o.formatoQty > 0 ? o.formatoQty : 0;
      const packs = formato > 0 && comprarBase > 0 ? Math.ceil(comprarBase / formato - 1e-9) : 0;
      const prov = proveedorDe(ctx, o);
      filas.push({ insumoId: insId, nombre: ins.nombre, categoria: ins.categoria, unidad: ins.unidad, ofertaId: o ? o.id : null, proveedorId: prov ? prov.id : null,
        usable: usable, comprarBase: comprarBase, lugar: prov ? prov.nombre : o ? (o.lugar || '(sin lugar)') : '(sin oferta)', formatoLabel: o ? o.formatoLabel : '',
        formatoQty: formato, packs: packs, precioPack: o ? precioOferta(ctx, o) : 0,
        costo: formato > 0 ? packs * precioOferta(ctx, o) : usable * c.unit, costoTeorico: usable * c.unit, missing: c.missing,
        necesario: necesario, cubiertoStock: cubierto, oportunidad: c.modo === 'oportunidad' ? o.temporal.hasta : null });
    });
    filas.sort(function (a, b) { return a.lugar === b.lugar ? a.nombre.localeCompare(b.nombre) : a.lugar.localeCompare(b.lugar); });
    return filas;
  }

  /* ---------- compras de oportunidad y sobrestock temporal ---------- */
  // Sobrestock = lo comprado de más en una oferta. No es un inventario: se descuenta solo con el consumo semanal
  // estimado (plan semanal o volumen supuesto) y desaparece al agotarse.
  function sobrestockVigente(ctx) {
    const res = new Map(), lista = ctx.state.sobrestock || [];
    if (!lista.length) return res;
    const uso = usoSemanalInsumos(ctx).uso, hoy = hoyISO(ctx.p);
    lista.forEach(function (e) {
      if (!ctx.insumos.get(e.insumoId) || !(e.cantidad > 0)) return;
      const porDia = (uso.get(e.insumoId) || 0) / 7;
      const dias = Math.max(0, diasEntre(e.desde, hoy));
      const restante = e.cantidad - porDia * dias;
      if (restante <= 0.0001) return;
      const r = res.get(e.insumoId) || { insumoId: e.insumoId, restante: 0, entradas: [], porDia: porDia };
      r.restante += restante; r.entradas.push(Object.assign({ restante: restante }, e));
      res.set(e.insumoId, r);
    });
    res.forEach(function (r) {
      r.diasQueQuedan = r.porDia > 0 ? Math.floor(r.restante / r.porDia + 1e-9) : null;
      r.alcanzaHasta = r.diasQueQuedan != null ? fechaMenos(hoy, -r.diasQueQuedan) : null;
    });
    return res;
  }

  // Cuánto conviene comprar de una oferta: semanas de consumo limitadas por lo que dura guardado y por stockMaxSemanas.
  function sugerenciaOportunidad(ctx, ofertaId) {
    const o = ctx.ofertas.get(ofertaId);
    if (!o || !(o.formatoQty > 0) || !(precioOferta(ctx, o) > 0)) return null;
    const ins = ctx.insumos.get(o.insumoId);
    if (!ins) return null;
    const usoSemana = usoSemanalInsumos(ctx).uso.get(o.insumoId) || 0;
    const normal = costoInsumo(makeCtx(ctx.state, Object.assign({}, ctx.opts, { sinOportunidades: true })), o.insumoId);
    const brutoOferta = costoBrutoOferta(ctx, o);
    const brutoNormal = normal.oferta ? costoBrutoOferta(ctx, normal.oferta) : null;
    const maxSem = Math.max(1, Number(ctx.p.stockMaxSemanas) || 8);
    const dura = Number(ins.duracionDias) > 0 ? Number(ins.duracionDias) : null;
    const semanas = dura ? Math.max(1, Math.min(maxSem, Math.floor(dura / 7))) : 1;
    const rend = o.rendimiento != null ? o.rendimiento : (ins.rendimiento != null ? ins.rendimiento : 1);
    const st = sobrestockVigente(ctx).get(o.insumoId);
    const usable = Math.max(0, usoSemana * semanas - (st ? st.restante : 0));
    const base = rend > 0 ? usable / rend : usable;
    const packs = base > 0 ? Math.ceil(base / o.formatoQty - 1e-9) : 0;
    const usableComprado = packs * o.formatoQty * (rend || 1);
    return {
      oferta: o, insumo: ins, usoSemana: usoSemana, semanas: semanas, duracionDias: dura, limitadoPor: !dura ? 'sin-duracion' : (Math.floor(dura / 7) < maxSem ? 'duracion' : 'tope'),
      packs: packs, desembolso: packs * precioOferta(ctx, o), usableComprado: usableComprado,
      semanasCubiertas: usoSemana > 0 ? usableComprado / usoSemana : null,
      descuentoPct: brutoNormal ? (1 - brutoOferta / brutoNormal) * 100 : null,
      ahorro: brutoNormal ? (brutoNormal - brutoOferta) * usableComprado : null,
      ofertaNormal: normal.oferta, sobrestockActual: st ? st.restante : 0, diasParaVencer: diasParaVencer(ctx, o)
    };
  }

  // ofertas temporales vigentes (por revisar, en uso o como alternativa), ordenadas por vencimiento
  function ofertasTemporales(ctx) {
    return (ctx.state.ofertas || []).filter(function (o) { return o.temporal && !ofertaVencida(ctx, o); })
      .sort(function (a, b) { return (a.temporal.hasta || '').localeCompare(b.temporal.hasta || ''); });
  }

  /* ---------- evolución de precios ---------- */
  function fechaMenos(iso, dias) { return new Date(Date.parse(iso) - dias * 86400000).toISOString().slice(0, 10); }

  // puntos de precio de una oferta (precio de compra por unidad base, antes de merma).
  // Las compras registradas se leen desde `compras`, así que aquí se omiten los precios con fuente 'compra'.
  function puntosOferta(o) {
    const q = o.formatoQty > 0 ? o.formatoQty : 0, pts = [];
    if (!q) return pts;
    const tipo = function (f) { return f === 'comprado' ? 'compra' : 'cotizacion'; };
    (o.historial || []).forEach(function (x) {
      if (x.fecha && x.precio > 0 && x.fuente !== 'compra') pts.push({ fecha: x.fecha, unit: x.precio / q, precio: x.precio, tipo: tipo(x.fuente), ofertaId: o.id });
    });
    if (o.fecha && o.precio > 0 && o.fuente !== 'compra') pts.push({ fecha: o.fecha, unit: o.precio / q, precio: o.precio, tipo: tipo(o.fuente), ofertaId: o.id, actual: true });
    return pts;
  }
  function puntosCompras(ctx, filtro) {
    const pts = [];
    (ctx.state.compras || []).forEach(function (c) {
      (c.lineas || []).forEach(function (l) {
        const q = (Number(l.cantidad) || 0) * (Number(l.formatoQty) || 0);
        if (!(q > 0) || !(l.total > 0) || !filtro(l, c)) return;
        pts.push({ fecha: c.fecha, unit: l.total / q, precio: l.total / l.cantidad, tipo: 'compra', ofertaId: l.ofertaId, compraId: c.id, proveedorId: c.proveedorId, conFactura: !!c.conFactura });
      });
    });
    return pts;
  }
  const porFecha = function (a, b) { return a.fecha < b.fecha ? -1 : a.fecha > b.fecha ? 1 : 0; };

  // series de precio de un insumo, una por proveedor
  function historialPrecios(ctx, insumoId) {
    const series = new Map();
    const add = function (key, nombre, pt) {
      if (!series.has(key)) series.set(key, { key: key, nombre: nombre, puntos: [] });
      series.get(key).puntos.push(pt);
    };
    (ctx.ofertasPorInsumo.get(insumoId) || []).forEach(function (o) {
      const p = proveedorDe(ctx, o);
      puntosOferta(o).forEach(function (pt) { add(p ? p.id : 'L:' + (o.lugar || ''), p ? p.nombre : (o.lugar || 'Sin lugar'), pt); });
    });
    puntosCompras(ctx, function (l) { return l.insumoId === insumoId; }).forEach(function (pt) {
      const p = ctx.proveedores.get(pt.proveedorId);
      add(p ? p.id : 'C:' + pt.proveedorId, p ? p.nombre : 'Proveedor eliminado', pt);
    });
    const out = Array.from(series.values());
    out.forEach(function (s) { s.puntos.sort(porFecha); });
    out.sort(function (a, b) { return a.nombre.localeCompare(b.nombre); });
    return out;
  }

  // variación del precio de compra de la oferta en uso entre hace `dias` y hoy
  function variacionInsumo(ctx, insumoId, dias) {
    const c = costoInsumo(ctx, insumoId), o = c.oferta;
    if (!o) return null;
    const pts = puntosOferta(o).concat(puntosCompras(ctx, function (l) { return l.ofertaId === o.id; })).sort(porFecha);
    if (!pts.length) return null;
    const limite = fechaMenos(hoyISO(ctx.p), dias);
    let antes = null;
    pts.forEach(function (pt) { if (pt.fecha <= limite) antes = pt; });
    const ahora = pts[pts.length - 1];
    if (!antes || !(antes.unit > 0)) return null;
    return { antes: antes, ahora: ahora, pct: (ahora.unit / antes.unit - 1) * 100 };
  }

  // alza de la canasta (ponderada por uso semanal) en los últimos `dias`
  function inflacionCanasta(ctx, dias) {
    const u = usoSemanalInsumos(ctx);
    let wA = 0, wB = 0, total = 0;
    const filas = [];
    u.uso.forEach(function (q, id) {
      if (!(q > 0)) return;
      total++;
      const v = variacionInsumo(ctx, id, dias);
      if (!v) return;
      wA += q * v.antes.unit; wB += q * v.ahora.unit;
      const ins = ctx.insumos.get(id);
      filas.push({ insumoId: id, nombre: ins ? ins.nombre : id, antes: v.antes, ahora: v.ahora, pct: v.pct });
    });
    filas.sort(function (a, b) { return Math.abs(b.pct) - Math.abs(a.pct); });
    return { pct: wA > 0 ? (wB / wA - 1) * 100 : null, cubiertos: filas.length, total: total, filas: filas };
  }

  /* ---------- datos tributarios (Chile) ---------- */
  const TIPOS_DOC = { '33': 'Factura electrónica', '34': 'Factura exenta electrónica', '39': 'Boleta electrónica', 'sd': 'Sin documento' };

  function limpiarRut(r) { return String(r || '').toUpperCase().replace(/[^0-9K]/g, ''); }
  function dvRut(cuerpo) {
    let s = 0, m = 2;
    for (let i = cuerpo.length - 1; i >= 0; i--) { s += Number(cuerpo[i]) * m; m = m === 7 ? 2 : m + 1; }
    const r = 11 - (s % 11);
    return r === 11 ? '0' : r === 10 ? 'K' : String(r);
  }
  // RUT válido según dígito verificador (módulo 11)
  function validarRut(r) {
    const c = limpiarRut(r);
    if (c.length < 2) return false;
    const cuerpo = c.slice(0, -1);
    return /^\d+$/.test(cuerpo) && dvRut(cuerpo) === c.slice(-1);
  }
  function formatearRut(r) {
    const c = limpiarRut(r);
    if (c.length < 2) return String(r || '');
    return c.slice(0, -1).replace(/^0+/, '').replace(/\B(?=(\d{3})+(?!\d))/g, '.') + '-' + c.slice(-1);
  }

  // compras antiguas solo tenían conFactura
  function tipoDocCompra(c) { return c.tipoDoc || (c.conFactura ? '33' : 'sd'); }
  function esFactura(doc) { return doc === '33' || doc === '34'; }

  // montos del documento: los de la factura si se ingresaron; si no, calculados desde el total pagado (con despacho)
  function montosCompra(ctx, c) {
    const f = factorIva(ctx), doc = tipoDocCompra(c);
    const total = (Number(c.total) || 0) + (Number(c.despachoPagado) || 0);
    let neto, iva, exento;
    if (c.neto != null && c.iva != null) { neto = Number(c.neto) || 0; iva = Number(c.iva) || 0; exento = Number(c.exento) || 0; }
    else if (doc === '34') { neto = 0; iva = 0; exento = total; }
    else { exento = Number(c.exento) || 0; neto = Math.round((total - exento) / f); iva = total - exento - neto; }
    return { doc: doc, total: total, neto: neto, iva: iva, exento: exento,
      credito: doc === '33' ? iva : 0, perdido: esFactura(doc) ? 0 : iva };
  }

  // libro de compras: una fila por documento, con avisos de datos que faltan para contabilidad
  function libroCompras(ctx, desde, hasta, soloFacturas) {
    const filas = [];
    (ctx.state.compras || []).forEach(function (c) {
      if ((desde && c.fecha < desde) || (hasta && c.fecha > hasta)) return;
      const m = montosCompra(ctx, c);
      if (soloFacturas && !esFactura(m.doc)) return;
      const p = ctx.proveedores.get(c.proveedorId) || {};
      const avisos = [];
      if (esFactura(m.doc)) {
        if (!p.rut) avisos.push('proveedor sin RUT');

  const norm = function (s) {
    return String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[▲▼↑↓]/g, '').replace(/\s+/g, ' ').replace(/[:*]+$/, '').trim();

  function fijarAyudas(on) {

      if (el.dataset.ayuda) return;

    });
    // 3. encabezados, indicadores y etiquetas por su texto
    root.querySelectorAll('th, label').forEach(function (el) {
      if (el.dataset.ayuda) return;

    });
    root.querySelectorAll('.kpi').forEach(function (el) {
      if (el.dataset.ayuda) return;
      const l = el.querySelector('.kpi-l');
      const t = l && TEXTOS[norm(l.textContent)];
      if (t) el.dataset.ayuda = t;

  /* ---------- burbuja ---------- */
  let tip = null, ancla = null, espera = null, cierre = null, tecleo = 0;
  function ocultar() {
    clearTimeout(espera); clearTimeout(cierre); espera = cierre = null;
    if (tip) { tip.remove(); tip = null; }
    ancla = null;
  }
  function mostrar(el) {
    if (!App.ayudasOn() || !el || !el.isConnected) return;
    const txt = el.dataset.ayuda;
    if (!txt) return;
    if (ancla === el && tip) return;
    ocultar();

    document.body.appendChild(tip);
    const r = el.getBoundingClientRect(), w = tip.offsetWidth, hh = tip.offsetHeight, m = 8;
    let x = Math.min(Math.max(m, r.left), window.innerWidth - w - m);
    let y = r.bottom + 6;
    if (y + hh > window.innerHeight - m) y = Math.max(m, r.top - hh - 6);
    tip.style.left = x + 'px'; tip.style.top = y + 'px';
  }
  const objetivo = function (ev) { return ev.target && ev.target.closest ? ev.target.closest('[data-ayuda]') : null; };

  document.addEventListener('mouseover', function (ev) {
    const el = objetivo(ev);
    if (!el || el === ancla || Date.now() - tecleo < 800) return;
    clearTimeout(espera);
    espera = setTimeout(function () { mostrar(el); }, 300);
  });
  document.addEventListener('mouseout', function (ev) {
    const el = objetivo(ev);
    if (!el || (ev.relatedTarget && el.contains(ev.relatedTarget))) return;
    if (document.activeElement === el) return;   // campo con el cursor dentro: la ayuda sigue mientras escribe
    ocultar();

  document.addEventListener('focusin', function (ev) {
    const el = objetivo(ev);
    if (!el || Date.now() - tecleo < 800) return;

    cierre = setTimeout(ocultar, 7000);
  });
  document.addEventListener('focusout', ocultar);
  document.addEventListener('keydown', function () { tecleo = Date.now(); if (tip) ocultar(); }, true);
  document.addEventListener('touchstart', function (ev) {
    const el = objetivo(ev);

  App.pieAyudas = function () {
    return h('footer', { class: 'pie noprint' },
      h('label', { class: 'chk' }, h('input', { type: 'checkbox', checked: App.ayudasOn(), onchange: function (ev) { fijarAyudas(ev.target.checked); } }),
        ' Mostrar ayudas al pasar el mouse sobre los campos'));
  };
})();

/* src/ui/autocompletar.js */
/* Autocompletado de nombres (insumos, lugares, proveedores…), al estilo Excel:
 *  - lista propia bajo el campo con lo que contiene lo escrito (sin importar mayúsculas ni tildes),
 *  - texto gris dentro del campo cuando una opción empieza igual (Tab, → o Enter lo aceptan),
 *  - flechas para recorrer la lista, Enter elige, Esc cierra.
 * Se activa solo en todo <input list="…"> (reemplaza la lista nativa del navegador) y en los cuadros de nombre
 * que lo pidan con App.autoInput / App.prompt(..., { sugerencias }). */
(function () {
  'use strict';
  const App = window.App, h = App.h, E = window.Engine;
  const MAX = 12;
  const norm = E.normNombre;
  let ac = null, pop = null, ghost = null, eligiendo = false;

  /* ---------- opciones y coincidencias ---------- */
  function opcionesDe(el) {
    if (el._acItems) return typeof el._acItems === 'function' ? el._acItems() : el._acItems;
    const dl = el.dataset.acList && document.getElementById(el.dataset.acList);
    return dl ? Array.from(dl.options).map(function (o) { return o.value; }) : [];
  }
  // primero las que empiezan igual, luego las que tienen una palabra que empieza igual, al final las que lo contienen
  function coincidencias(items, q, todas) {
    const k = norm(q);
    if (!k) return todas ? items.slice(0, MAX) : [];
    const pre = [], pal = [], con = [], vistos = new Set();
    items.forEach(function (v) {
      const n = norm(v);
      if (!n || vistos.has(n)) return;
      vistos.add(n);
      if (n === k) return;
      if (n.indexOf(k) === 0) pre.push(v);
      else if (n.split(' ').some(function (w) { return w.indexOf(k) === 0; })) pal.push(v);
      else if (n.indexOf(k) >= 0) con.push(v);
    });
    return pre.concat(pal, con).slice(0, MAX);
  }
  App.autoInput = function (input, items) { input._acItems = items; input.setAttribute('autocomplete', 'off'); return input; };
  const esAC = function (el) { return !!el && el.nodeType === 1 && el.tagName === 'INPUT' && (el.dataset.ac === '1' || !!el._acItems); };

  // convierte los <input list> de la vista en campos con autocompletado propio (la lista nativa se desactiva)
  App.aplicarAC = function (root) {
    root.querySelectorAll('input[list]').forEach(function (el) {
      el.dataset.acList = el.getAttribute('list'); el.dataset.ac = '1';
      el.removeAttribute('list'); el.setAttribute('autocomplete', 'off');
    });
  };

  /* ---------- dibujo ---------- */
  function cerrarLista() { if (pop) { pop.remove(); pop = null; } }
  function cerrarGhost() { if (ghost) { ghost.remove(); ghost = null; } }
  function cerrar() { cerrarLista(); cerrarGhost(); ac = null; }

  function resaltar(txt, q) {
    const i = txt.toLowerCase().indexOf(q.trim().toLowerCase());
    if (!q.trim() || i < 0) return [txt];
    return [txt.slice(0, i), h('b', null, txt.slice(i, i + q.trim().length)), txt.slice(i + q.trim().length)];
  }
  function posicionar() {
    if (!ac || !ac.el.isConnected) return;
    const r = ac.el.getBoundingClientRect();
    if (pop) {
      pop.style.minWidth = Math.max(r.width, 220) + 'px';
      const hh = pop.offsetHeight;
      let y = r.bottom + 2;
      if (y + hh > window.innerHeight - 8) y = Math.max(8, r.top - hh - 2);
      pop.style.left = Math.min(Math.max(8, r.left), window.innerWidth - pop.offsetWidth - 8) + 'px';
      pop.style.top = y + 'px';
    }
    if (ghost) { ghost.style.left = r.left + 'px'; ghost.style.top = r.top + 'px'; ghost.style.width = r.width + 'px'; ghost.style.height = r.height + 'px'; }
  }
  function dibujarGhost() {
    cerrarGhost();
    const el = ac.el, v = el.value;
    if (!v || ac.sel >= 0 || el.selectionStart !== v.length) return;
    const c = ac.res.find(function (x) { return x.length > v.length && x.toLowerCase().indexOf(v.toLowerCase()) === 0; });
    if (!c) return;
    ac.ghost = c;
    const cs = getComputedStyle(el);
    ghost = h('div', { class: 'ac-ghost', 'aria-hidden': 'true', style: { font: cs.font, letterSpacing: cs.letterSpacing,
      paddingLeft: (parseFloat(cs.paddingLeft) + parseFloat(cs.borderLeftWidth)) + 'px' } },
      h('span', { style: { visibility: 'hidden' } }, v), c.slice(v.length));
    document.body.appendChild(ghost);
  }
  function dibujar() {
    cerrarLista();
    ac.ghost = null;
    if (!ac.res.length) { cerrarGhost(); return; }
    pop = h('div', { class: 'ac-lista', role: 'listbox' }, ac.res.map(function (v, i) {
      return h('div', { class: 'ac-item' + (i === ac.sel ? ' on' : ''), role: 'option', 'aria-selected': i === ac.sel ? 'true' : 'false',
        onpointerdown: function (ev) { ev.preventDefault(); elegir(v); } }, resaltar(v, ac.el.value));
    }));
    document.body.appendChild(pop);
    dibujarGhost();
    posicionar();
  }
  function actualizar(todas) {
    if (!ac) return;
    ac.res = coincidencias(opcionesDe(ac.el), ac.el.value, todas);
    ac.sel = -1;
    dibujar();
  }

  function elegir(valor) {
    if (!ac) return;
    const el = ac.el;
    eligiendo = true;
    el.value = valor;
    el.dispatchEvent(new Event('input', { bubbles: true }));
    el.dispatchEvent(new Event('change', { bubbles: true }));
    eligiendo = false;
    cerrar();
  }

  // tras cada render la página reconstruye el campo: se vuelve a anclar la lista al nuevo
  App.reanclarAC = function () {
    if (!ac) return;
    const el = ac.fk ? document.querySelector('[data-fk="' + String(ac.fk).replace(/"/g, '\\"') + '"]') : ac.el;
    if (!el || document.activeElement !== el) { cerrar(); return; }
    ac.el = el;
    actualizar(false);
  };

  /* ---------- eventos (delegados, en captura: corren antes que los del propio campo) ---------- */
  document.addEventListener('input', function (ev) {
    const el = ev.target;
    if (eligiendo || !esAC(el)) return;
    ac = { el: el, fk: el.dataset.fk || null, sel: -1, res: [] };
    actualizar(false);
  }, true);
  document.addEventListener('keydown', function (ev) {
    const el = ev.target;
    if (!esAC(el)) return;
    if (ev.key === 'ArrowDown' && (!ac || ac.el !== el)) { ac = { el: el, fk: el.dataset.fk || null, sel: -1, res: [] }; actualizar(true); ev.preventDefault(); return; }
    if (!ac || ac.el !== el) return;
    const n = ac.res.length;
    if (ev.key === 'ArrowDown' && n) { ac.sel = Math.min(ac.sel + 1, n - 1); dibujar(); ev.preventDefault(); }
    else if (ev.key === 'ArrowUp' && n) { ac.sel = Math.max(ac.sel - 1, -1); dibujar(); ev.preventDefault(); }
    else if ((ev.key === 'Enter' || ev.key === 'Tab') && (ac.sel >= 0 || ac.ghost)) {
      const v = ac.sel >= 0 ? ac.res[ac.sel] : ac.ghost;
      ev.preventDefault(); ev.stopPropagation(); elegir(v);
    }
    else if (ev.key === 'ArrowRight' && ac.ghost && el.selectionStart === el.value.length) { ev.preventDefault(); elegir(ac.ghost); }
    else if (ev.key === 'Escape' && (pop || ghost)) { ev.stopPropagation(); cerrar(); }
  }, true);
  // al reconstruir la página el campo pierde y recupera el foco en el mismo instante: se cierra solo si el foco no vuelve
  document.addEventListener('focusout', function (ev) {
    if (!ac || ev.target !== ac.el) return;
    setTimeout(function () {
      if (!ac) return;
      const el = ac.fk ? document.querySelector('[data-fk="' + String(ac.fk).replace(/"/g, '\\"') + '"]') : ac.el;
      if (!el || document.activeElement !== el) cerrar();
    }, 0);
  }, true);
  window.addEventListener('scroll', function () { posicionar(); }, true);
  window.addEventListener('resize', function () { posicionar(); });

  /* ---------- aviso de nombres parecidos (cuadros "Nuevo …") ---------- */
  App.avisoParecidos = function (input, items, usar) {
    const caja = h('div', { class: 'ac-aviso' });
    const pintar = function () {
      const r = E.parecidos(items, input.value);
      caja.replaceChildren();
      if (!r.igual && !r.parecidos.length) return;
      caja.appendChild(h('div', { class: r.igual ? 'bad-t' : 'warn-t' }, r.igual ? 'Ya existe: ' : '¿Quisiste decir…? '));
      (r.igual ? [r.igual] : r.parecidos).forEach(function (v) {
        caja.appendChild(App.btn(r.igual ? 'Usar “' + v + '”' : v, function () { usar(v); }, 'small'));
      });
    };
    input.addEventListener('input', pintar);
    return caja;
  };
})();

(function () {

  function vacio() { return { meta: { version: 1 }, params: {}, insumos: [], ofertas: [], recetas: [], plan: { lun: [], mar: [], mie: [], jue: [], vie: [] }, escenarios: [], escenarioActivo: null }; }

  function yo() {
    const N = App.nube;

    if (!o || !o.temporal) return null;

    let x0 = Math.min.apply(null, ts), x1 = Math.max.apply(null, ts), y0 = Math.min.apply(null, vs), y1 = Math.max.apply(null, vs);
    if (x1 - x0 < 14 * DIA) { x0 -= 7 * DIA; x1 += 7 * DIA; }
    const pad = (y1 - y0) * 0.15 || y1 * 0.1 || 1;
    y0 = Math.max(0, y0 - pad); y1 += pad;
    const X = function (t) { return L + (t - x0) / (x1 - x0) * (W - L - R); };
    const Y = function (v) { return T + (1 - (v - y0) / (y1 - y0)) * (H - T - B); };

      });
    });
    return h('div', { class: 'chart-wrap', html: svg + '</svg>' });
