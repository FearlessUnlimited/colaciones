<style>
:root {
  --bg: #f6f5f1; --surface: #ffffff; --surface2: #f0eee8; --ink: #1f2421; --mut: #6b726d; --line: #e2dfd6;

  --sim: #7c3aed; --sim-soft: #ece4fd; --shadow: 0 1px 2px rgba(0,0,0,.06), 0 4px 14px rgba(0,0,0,.05);
  --seg0: #0f766e; --seg1: #2563a8; --seg2: #b45309; --seg3: #7c3aed; --seg4: #be185d; --seg5: #4d7c0f; --seg6: #0e7490; --seg7: #9ca3af;
  --radius: 10px; --font: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #14181a; --surface: #1d2326; --surface2: #262d30; --ink: #e8ece9; --mut: #96a09a; --line: #333c40;
    --accent: #2dd4bf; --accent-ink: #062a26; --accent-soft: #123a36;
    --good: #5fd08a; --good-soft: #17341f; --warn: #f0b05a; --warn-soft: #3b2c10; --bad: #ff8a7d; --bad-soft: #3d1b18; --info: #7db7f0; --info-soft: #17283a;
    --sim: #b69cff; --sim-soft: #2a2145; --shadow: 0 1px 2px rgba(0,0,0,.4);
    --seg0: #2dd4bf; --seg1: #6aa8f0; --seg2: #f0b05a; --seg3: #b69cff; --seg4: #f472b6; --seg5: #a3d65c; --seg6: #5ad1e6; --seg7: #7b848a;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; font: 14px/1.45 var(--font); color: var(--ink); background: var(--bg); }
h1, h2, h3, h4 { margin: 0; line-height: 1.25; }

small { font-size: 12px; color: var(--mut); }
button, input, select, textarea { font: inherit; color: inherit; }
input[type=text], input[type=email], input[type=password], input:not([type]), select, textarea {
  background: var(--surface); border: 1px solid var(--line); border-radius: 7px; padding: 6px 8px; min-width: 0; max-width: 100%;
}

textarea { width: 100%; resize: vertical; }
input.num { text-align: right; }
input.sim { border-color: var(--sim); background: var(--sim-soft); }
input[type=range] { width: 100%; accent-color: var(--accent); }
.w60 { width: 60px; } .w70 { width: 74px; } .w80 { width: 88px; } .w90 { width: 96px; } .w200 { width: 160px; }
input.wide { width: 100%; } input.ing { width: 100%; min-width: 180px; } input.alt { width: 120px; }

/* header */
.top { position: sticky; top: 0; z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 8px 16px; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 190px; }
.brand b { display: block; font-size: 15px; } .brand small { display: block; line-height: 1.1; }
.logo { font-size: 24px; }
.tabs { display: flex; gap: 2px; overflow-x: auto; flex: 1 1 auto; scrollbar-width: thin; }
.tab { padding: 7px 12px; border-radius: 8px; color: var(--ink); text-decoration: none; white-space: nowrap; font-weight: 500; }
.tab:hover { background: var(--surface2); }
.tab.on { background: var(--accent); color: var(--accent-ink); }
.tab .count { display: inline-block; margin-left: 6px; min-width: 18px; padding: 0 5px; border-radius: 9px; background: var(--warn); color: #fff; font-size: 11px; text-align: center; }
.tools { display: flex; align-items: center; gap: 8px; }
.saved { white-space: nowrap; } .saved.bad { color: var(--bad); }
.esc-banner { flex-basis: 100%; background: var(--sim-soft); color: var(--ink); border: 1px solid var(--sim); border-radius: 8px; padding: 6px 10px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.main { max-width: 1500px; margin: 0 auto; padding: 16px; }

/* controles */
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 7px 12px; cursor: pointer; font-weight: 500; }
.btn:hover:not(:disabled) { background: var(--surface2); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover:not(:disabled) { filter: brightness(1.08); background: var(--accent); }
.btn.danger { color: var(--bad); border-color: var(--bad); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.small { padding: 3px 8px; font-size: 12px; border-radius: 7px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 11px; cursor: pointer; font-size: 13px; }
.chip.on { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); font-weight: 600; }
.chip.small { padding: 1px 8px; font-size: 12px; }
.chips.big .chip { padding: 7px 16px; font-size: 14px; }
.badge { display: inline-block; font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 999px; background: var(--surface2); color: var(--mut); }
.badge.bad { background: var(--bad-soft); color: var(--bad); } .badge.warn { background: var(--warn-soft); color: var(--warn); }
.badge.good { background: var(--good-soft); color: var(--good); } .badge.info { background: var(--info-soft); color: var(--info); }
.bar { display: inline-block; width: 70px; height: 7px; background: var(--surface2); border-radius: 4px; overflow: hidden; vertical-align: middle; }
.bar .fill { display: block; height: 100%; background: var(--accent); } .bar .fill.good { background: var(--good); } .bar .fill.warn { background: var(--warn); } .bar .fill.bad { background: var(--bad); }
.cellbar { display: flex; align-items: center; justify-content: flex-end; gap: 6px; }
.empty { color: var(--mut); padding: 18px; text-align: center; }
.mut { color: var(--mut); } .strong { font-weight: 700; } .small { font-size: 12px; }
.good-t { color: var(--good); } .bad-t { color: var(--bad); } .warn-t { color: var(--warn); } .sim-t { color: var(--sim); }
.nowrap { white-space: nowrap; } .r { text-align: right; } .c { text-align: center; } .spacer { flex: 1; }
.row { display: flex; align-items: center; } .gap { gap: 10px; } .wrap { flex-wrap: wrap; } .mt { margin-top: 10px; }
.stack { display: flex; flex-direction: column; gap: 14px; }
.help { color: var(--mut); font-size: 12.5px; } ul.help, ol.help { padding-left: 18px; margin: 6px 0; }
label { display: flex; flex-direction: column; gap: 3px; font-size: 12.5px; color: var(--mut); }
label.chk { flex-direction: row; align-items: center; gap: 6px; color: var(--ink); } label.block { width: 100%; }

/* tarjetas */
.card { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; box-shadow: var(--shadow); min-width: 0; }
.card-h { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; box-shadow: var(--shadow); border-left: 4px solid var(--line); }
.kpi.good { border-left-color: var(--good); } .kpi.warn { border-left-color: var(--warn); } .kpi.bad { border-left-color: var(--bad); }
.kpi-l { font-size: 12px; color: var(--mut); } .kpi-v { font-size: 24px; font-weight: 700; line-height: 1.2; margin: 2px 0; } .kpi-s { font-size: 12px; color: var(--mut); }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); gap: 14px; }
.form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 10px 14px; }
.cost-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; }
.cost-grid > div { display: flex; flex-direction: column; } .cost-grid b { font-size: 16px; } .cost-grid .tot b { font-size: 19px; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; } .tag { background: var(--surface2); border-radius: 6px; padding: 2px 8px; font-size: 12px; text-decoration: none; color: var(--ink); } .tag:hover { background: var(--accent-soft); }
.checks { display: flex; flex-direction: column; gap: 4px; } .checks > div { padding: 6px 10px; border-radius: 8px; font-size: 13px; }
.chk-error { background: var(--bad-soft); } .chk-warn { background: var(--warn-soft); } .chk-info { background: var(--info-soft); }
.alerts { display: flex; flex-direction: column; gap: 6px; }
.alert { display: flex; gap: 8px; padding: 7px 10px; border-radius: 8px; background: var(--surface2); }
.alert.bad { background: var(--bad-soft); } .alert.warn { background: var(--warn-soft); } .alert.info { background: var(--info-soft); } .alert.good { background: var(--good-soft); }
.alert.link { cursor: pointer; } .alert.link:hover { filter: brightness(.97); }

/* layout dividido */
.split { display: grid; grid-template-columns: minmax(300px, 400px) 1fr; gap: 14px; align-items: start; }
.split.wide { grid-template-columns: 1fr; } .split.wide:has(.drawer) { grid-template-columns: minmax(0, 1fr) 380px; }
.pane-list { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px; display: flex; flex-direction: column; gap: 8px; position: sticky; top: 74px; max-height: calc(100vh - 90px); }
.pane-detail, .pane-wide { min-width: 0; display: flex; flex-direction: column; gap: 14px; }
.scroll { overflow: auto; flex: 1; min-height: 120px; } .scroll-x { overflow-x: auto; }
.filters { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; } .filters select { min-width: 0; flex: 1 1 140px; } .filters .search { flex: 1; min-width: 140px; }
.drawer { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 8px; position: sticky; top: 74px; max-height: calc(100vh - 90px); overflow: auto; }
.x { border: 0; background: transparent; font-size: 22px; line-height: 1; cursor: pointer; color: var(--mut); }
.alt-row { display: grid; grid-template-columns: 1fr auto auto; gap: 8px; align-items: center; padding: 5px 0; border-bottom: 1px solid var(--line); font-size: 13px; }

/* tablas */
.tbl { width: 100%; border-collapse: collapse; }
.tbl th { text-align: left; font-size: 12px; color: var(--mut); font-weight: 600; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; position: sticky; top: 0; background: var(--surface); z-index: 1; }
.tbl th.r { text-align: right; } .tbl th.c { text-align: center; }
.tbl td { padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.tbl.compact td { padding: 4px 6px; } .tbl.compact th { padding: 4px 6px; }
.tbl tfoot td { font-weight: 600; border-top: 2px solid var(--line); }
.tbl.sel tbody tr { cursor: pointer; } .tbl.sel tbody tr:hover, .tbl tr.link:hover { background: var(--surface2); }
.tbl tr.link { cursor: pointer; } .tbl td.link { cursor: pointer; }
.tbl tr.on { background: var(--accent-soft); } .tbl tr.off { opacity: .55; } .tbl tr.warnrow td { background: var(--warn-soft); } .tbl tr.usada td:first-child { border-left: 3px solid var(--accent); }
.tbl th.sortable { cursor: pointer; user-select: none; } .tbl th.on { color: var(--ink); }
.nm { font-weight: 600; }
.tbl.platos td input.num { padding: 3px 6px; }

/* composición */
.comp { display: flex; flex-direction: column; gap: 6px; }
.stackbar { display: flex; height: 14px; border-radius: 7px; overflow: hidden; background: var(--surface2); }
.seg { display: block; height: 100%; min-width: 2px; }
.seg0, .dot.seg0 { background: var(--seg0); } .seg1, .dot.seg1 { background: var(--seg1); } .seg2, .dot.seg2 { background: var(--seg2); } .seg3, .dot.seg3 { background: var(--seg3); }
.seg4, .dot.seg4 { background: var(--seg4); } .seg5, .dot.seg5 { background: var(--seg5); } .seg6, .dot.seg6 { background: var(--seg6); } .seg7, .dot.seg7 { background: var(--seg7); }
.wf-ing, .dot.wf-ing { background: var(--seg1); } .wf-env, .dot.wf-env { background: var(--seg2); } .wf-oh, .dot.wf-oh { background: var(--seg3); } .wf-com, .dot.wf-com { background: var(--seg4); }
.wf-iva, .dot.wf-iva { background: var(--seg7); } .wf-mg, .dot.wf-mg { background: var(--good); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--mut); }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 4px; }

/* plan y compras */
.plan-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 10px; }
.dia { background: var(--surface2); border-radius: 10px; padding: 8px; display: flex; flex-direction: column; gap: 6px; }
.dia-h { display: flex; justify-content: space-between; align-items: baseline; }
.plan-it { display: flex; align-items: center; gap: 6px; background: var(--surface); border-radius: 7px; padding: 3px 6px; } .plan-it .nm { flex: 1; font-weight: 500; font-size: 13px; }
.total-bar { text-align: right; font-size: 17px; padding: 6px 4px; }

/* parámetros */
.params { display: flex; flex-direction: column; } .param { display: flex; justify-content: space-between; align-items: center; gap: 14px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.param:last-child { border-bottom: 0; }

/* cocina */
.lista { list-style: none; margin: 0; padding: 0; } .lista li { padding: 6px 8px; border-radius: 6px; cursor: pointer; } .lista li:hover { background: var(--surface2); } .lista li.on { background: var(--accent-soft); font-weight: 600; }
.grp { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--mut); margin: 10px 8px 2px; }
.ficha { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 22px 26px; font-size: 16px; }
.ficha-h { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; } .ficha h2 { font-size: 26px; }
.ficha .desc { color: var(--mut); } .ficha-t td, .ficha-t th { font-size: 16px; } .ficha .pasos { white-space: pre-wrap; line-height: 1.6; }
tr.subhead td { font-weight: 700; background: var(--surface2); } tr.hijo td { color: var(--mut); padding-left: 22px; }

/* acceso (modo nube) */
.acceso { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; }
.acceso-box { width: 100%; max-width: 380px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 24px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 14px; }
.acceso-box h2 { font-size: 20px; } .acceso-box .btn.primary { padding: 10px; }
.acc-msg { font-size: 13px; min-height: 18px; } .acc-msg.bad { color: var(--bad); } .acc-msg.good { color: var(--good); }
.user { display: flex; align-items: center; gap: 6px; font-size: 13px; white-space: nowrap; }

/* overlays */
.overlay { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: flex; align-items: center; justify-content: center; z-index: 100; padding: 16px; }
.modal { background: var(--surface); border-radius: 12px; max-width: 520px; width: 100%; max-height: 90vh; overflow: auto; box-shadow: 0 10px 40px rgba(0,0,0,.35); }
.modal-h { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px 0; } .modal-b { padding: 12px 16px; } .modal-f { padding: 0 16px 14px; display: flex; justify-content: flex-end; gap: 8px; }
.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: 9px; z-index: 200; box-shadow: var(--shadow); transition: opacity .4s; } .toast.out { opacity: 0; }
details summary { cursor: pointer; color: var(--accent); margin: 6px 0; }

@media (max-width: 980px) {
  .split, .split.wide, .split.wide:has(.drawer) { grid-template-columns: minmax(0, 1fr); }
  .pane-list, .drawer { position: static; max-height: none; } .pane-list .scroll { max-height: 320px; }
  .grid2 { grid-template-columns: minmax(0, 1fr); }
  .top { position: static; } .tabs { flex-wrap: wrap; overflow: visible; } .main { padding: 10px; } .top { padding: 8px 10px; } .brand small { display: none; } .brand { min-width: 0; }
  .ficha { padding: 14px; } .param { flex-direction: column; align-items: flex-start; }
}
@media print {
  body { background: #fff; color: #000; } .top, .noprint, .pane-list, .btn, .toast, .esc-banner { display: none !important; }
  .main { padding: 0; max-width: none; } .split, .split.cocina { display: block; } .card, .ficha { box-shadow: none; border: 0; break-inside: avoid; }
  .ficha { page-break-after: always; padding: 0; } .tbl td, .tbl th { color: #000; }
}

</style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
/* sin datos incrustados: vienen de la nube */
window.SEED = null; window.INFORME = null;
/* src/config.cloud.js */
/* Conexión a Supabase. La clave "publishable" es pública por diseño: la seguridad la dan el login y las reglas RLS. */
window.CLOUD = {
  url: 'https://mnwqlfqskmgnenvttixs.supabase.co',
  key: 'sb_publishable_eJ7034OktygacSH63kj50A_53jlNzMP'
};

/* src/engine.js */
/* Motor de costeo — funciones puras, sin DOM. Funciona en navegador (global Engine) y en Node (require).
 *
 * Convención de costeo (corrige los errores del Sheet original):
 *  - La cantidad de cada línea de receta es peso/volumen UTILIZABLE tal como se compra (lentejas SECAS,
 *    arroz CRUDO, carne cruda sin hueso). Todas las cantidades están en la unidad base del insumo (g, ml, un).
 *  - El rendimiento (<=100%) es solo merma de limpieza/pelado; la merma de cocción NO se aplica al costo.
 *  - Costo neto por unidad base = precio del formato / (cantidad del formato * rendimiento).
 */
(function (root) {
  'use strict';

  const DEFAULT_PARAMS = {
    imprevistosPct: 5,        // % sobre ingredientes (condimentos menores, mermas operativas)
    gasPorPorcion: 150,       // CLP gas/energía por porción
    manoObraPorPorcion: 0,    // CLP mano de obra por porción (0 = trabajo propio no valorizado)
    repartoPorPedido: 0,      // CLP costo de reparto por pedido (bencina/moto)
    ivaOn: false,             // true = el PVP incluye IVA y el margen se calcula sobre el neto
    ivaPct: 19,
    comisionPct: 0,           // % comisión de pago (transferencia/tarjeta) sobre PVP
    foodCostObjetivo: 35,     // % objetivo de ingredientes sobre precio neto
    foodCostAlerta: 42,       // % sobre el cual el plato se marca en alerta
    redondeo: 100,            // el PVP sugerido se redondea hacia arriba a múltiplos de esto
    modoOferta: 'preferida',  // preferida | barata | promedio
    precioViejoDias: 30,      // días tras los cuales un precio se considera desactualizado
    porcionesSemana: 100,     // volumen semanal supuesto (reparto parejo) para estimar ahorros
    costosFijosMes: 0,        // CLP costos fijos mensuales (para punto de equilibrio)
    diasOperacionMes: 22,
    trilogiaPrecio: 2000,     // precio adicional del combo Entrada+Ensalada+Postre
    hoy: null                 // ISO yyyy-mm-dd; null = fecha actual
  };

  const TIPOS_VENDIBLES = ['plato', 'entrada', 'ensalada', 'postre', 'acompanamiento'];
  const DIETA_NIVEL = { vegano: 0, vegetariano: 1, omni: 2 };
  const LINEA_NIVEL_MAX = { 'Vegano': 0, 'Vegetariano': 1 };

  function params(state, opts) {
    return Object.assign({}, DEFAULT_PARAMS, state.params || {}, (opts && opts.params) || {});
  }

  // fecha local (no UTC: en Chile de noche UTC ya es el día siguiente)
  function hoyISO(p) {
    if (p.hoy) return p.hoy;
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }

  function diasEntre(a, b) {
    return Math.round((Date.parse(b) - Date.parse(a)) / 86400000);
  }

  /* ---------- índice / contexto ---------- */
  function makeCtx(state, opts) {
    opts = opts || {};
    const ctx = {
      state: state, opts: opts, p: params(state, opts),
      insumos: new Map(), ofertas: new Map(), ofertasPorInsumo: new Map(), recetas: new Map(),
      memoInsumo: new Map(), memoReceta: new Map(), errors: []
    };
    (state.insumos || []).forEach(function (i) { ctx.insumos.set(i.id, i); });
    (state.ofertas || []).forEach(function (o) {
      ctx.ofertas.set(o.id, o);
      if (!ctx.ofertasPorInsumo.has(o.insumoId)) ctx.ofertasPorInsumo.set(o.insumoId, []);
      ctx.ofertasPorInsumo.get(o.insumoId).push(o);
    });
    (state.recetas || []).forEach(function (r) { ctx.recetas.set(r.id, r); });
    return ctx;
  }

  /* ---------- insumos y ofertas ---------- */
  function precioOferta(ctx, o) {
    const ov = ctx.opts.precios && ctx.opts.precios[o.id];
    return ov != null ? ov : o.precio;
  }

  // costo neto por unidad base de una oferta
  function costoNetoOferta(ctx, o) {
    const ins = ctx.insumos.get(o.insumoId);
    const rend = o.rendimiento != null ? o.rendimiento : (ins && ins.rendimiento != null ? ins.rendimiento : 1);
    const denom = (o.formatoQty || 0) * (rend || 1);
    return denom > 0 ? precioOferta(ctx, o) / denom : 0;
  }

  // ofertas utilizables: disponibles y ya revisadas (una cotización "pendiente" no entra a los costos hasta aprobarla)
  function ofertasDisponibles(ctx, insumoId) {
    return (ctx.ofertasPorInsumo.get(insumoId) || []).filter(function (o) { return o.disponible !== false && !o.pendiente; });
  }

  // oferta/costo vigente de un insumo según modo (preferida | barata | promedio) o fijación de escenario
  function costoInsumo(ctx, insumoId) {
    if (ctx.memoInsumo.has(insumoId)) return ctx.memoInsumo.get(insumoId);
    let res = { unit: 0, oferta: null, missing: true, modo: ctx.p.modoOferta };
    const pin = ctx.opts.ofertaElegida && ctx.opts.ofertaElegida[insumoId];
    let lista = ofertasDisponibles(ctx, insumoId);
    if (!lista.length) lista = (ctx.ofertasPorInsumo.get(insumoId) || []).filter(function (o) { return !o.pendiente; });
    if (pin && ctx.ofertas.get(pin)) {
      const o = ctx.ofertas.get(pin);
      res = { unit: costoNetoOferta(ctx, o), oferta: o, missing: false, modo: 'fijada' };
    } else if (lista.length) {
      const costos = lista.map(function (o) { return { o: o, c: costoNetoOferta(ctx, o) }; });
      const barata = costos.reduce(function (a, b) { return b.c < a.c ? b : a; });
      if (ctx.p.modoOferta === 'barata') {
        res = { unit: barata.c, oferta: barata.o, missing: false, modo: 'barata' };
      } else if (ctx.p.modoOferta === 'promedio') {
        const avg = costos.reduce(function (s, x) { return s + x.c; }, 0) / costos.length;
        res = { unit: avg, oferta: null, missing: false, modo: 'promedio' };
      } else {
        const pref = costos.find(function (x) { return x.o.preferida; }) || barata;
        res = { unit: pref.c, oferta: pref.o, missing: false, modo: 'preferida' };
      }
      if (res.unit <= 0) res.missing = true; // precio 0 = sin precio
    }
    ctx.memoInsumo.set(insumoId, res);
    return res;
  }

  /* ---------- recetas ---------- */
  function costoReceta(ctx, id, stack) {
    stack = stack || [];
    if (ctx.memoReceta.has(id)) return ctx.memoReceta.get(id);
    const r = ctx.recetas.get(id);
    const vacio = { id: id, lote: 0, porPorcion: 0, min: 0, max: 0, lineas: [], faltantes: [], ciclo: false };
    if (!r) return vacio;
    if (stack.indexOf(id) >= 0) {
      ctx.errors.push('Ciclo de sub-recetas: ' + stack.concat(id).join(' → '));
      return Object.assign({}, vacio, { ciclo: true });
    }
    const porciones = r.porciones > 0 ? r.porciones : 1;
    const sust = (ctx.opts.sust && ctx.opts.sust[id]) || {};
    const out = { id: id, lote: 0, porPorcion: 0, min: 0, max: 0, lineas: [], faltantes: [], ciclo: false };
    const st = stack.concat(id);

    (r.lineas || []).forEach(function (ln, idx) {
      const ref = sust[idx] || ln.ref;
      const fila = costoLinea(ctx, ln.tipo, ref, ln.cantidad, st);
      // alternativas declaradas en la línea → rango min/max
      let mn = fila.subtotal, mx = fila.subtotal;
      if (ln.alternativas && ln.alternativas.length) {
        ln.alternativas.forEach(function (alt) {
          const f2 = costoLinea(ctx, ln.tipo, alt, ln.cantidad, st);
          if (f2.subtotal < mn) mn = f2.subtotal;
          if (f2.subtotal > mx) mx = f2.subtotal;
        });
      }
      fila.idx = idx; fila.nota = ln.nota || ''; fila.refOriginal = ln.ref; fila.sustituido = !!sust[idx];
      fila.min = mn; fila.max = mx; fila.borrador = !!ln.borrador;
      out.lote += fila.subtotal; out.min += mn; out.max += mx;
      if (fila.ciclo) out.ciclo = true;
      if (fila.missing) out.faltantes.push(fila.nombre);
      out.lineas.push(fila);
    });

    if (!(r.lineas && r.lineas.length) && r.costoManual != null) {
      out.lote = r.costoManual * porciones; out.min = out.lote; out.max = out.lote; out.manual = true;
    }
    out.porPorcion = out.lote / porciones;
    out.minPorPorcion = out.min / porciones;
    out.maxPorPorcion = out.max / porciones;
    out.lineas.forEach(function (f) { f.porPorcion = f.subtotal / porciones; });
    ctx.memoReceta.set(id, out);
    return out;
  }

  function costoLinea(ctx, tipo, ref, cantidad, stack) {
    cantidad = Number(cantidad) || 0;
    if (tipo === 'receta') {
      const sub = costoReceta(ctx, ref, stack);
      const rr = ctx.recetas.get(ref);
      return { tipo: 'receta', ref: ref, nombre: rr ? rr.nombre : ('(receta ' + ref + ')'), cantidad: cantidad,
        unidad: 'porc', unitCost: sub.porPorcion, subtotal: cantidad * sub.porPorcion, oferta: null,
        missing: !rr || sub.faltantes.length > 0, ciclo: !!sub.ciclo };
    }
    const ins = ctx.insumos.get(ref);
    const c = costoInsumo(ctx, ref);
    return { tipo: 'insumo', ref: ref, nombre: ins ? ins.nombre : ('(insumo ' + ref + ')'), cantidad: cantidad,
      unidad: ins ? ins.unidad : '', unitCost: c.unit, subtotal: cantidad * c.unit, oferta: c.oferta, missing: c.missing || !ins };
  }

  /* ---------- plato (receta vendible) ---------- */
  function costoPlato(ctx, id, guarnicionId) {
    const r = ctx.recetas.get(id);
    const p = ctx.p;
    const rc = costoReceta(ctx, id);
    const gid = guarnicionId !== undefined ? guarnicionId : (r ? r.guarnicionDefault : null);
    const g = gid ? costoReceta(ctx, gid) : null;
    const guarn = g ? g.porPorcion : 0;

    let envase = 0, envaseFalta = false;
    if (r && r.envaseId) {
      const e = costoInsumo(ctx, r.envaseId);
      envase = e.unit * (r.envaseCant || 1);
      envaseFalta = e.missing;
    } else if (r && r.envaseManual != null) {
      envase = r.envaseManual;
    } else { envaseFalta = true; }

    const base = rc.porPorcion + guarn;
    const imprev = base * p.imprevistosPct / 100;
    const insumosTot = base + imprev;
    const overhead = (p.gasPorPorcion || 0) + (p.manoObraPorPorcion || 0);
    const pvp = r ? Number(r.pvp) || 0 : 0;
    const pvpNeto = p.ivaOn ? pvp / (1 + p.ivaPct / 100) : pvp;
    const comision = pvp * p.comisionPct / 100;
    const costoDirecto = insumosTot + envase;
    const costoTotal = costoDirecto + overhead + comision;
    const margen = pvpNeto - costoTotal;
    const margenPct = pvpNeto > 0 ? margen / pvpNeto * 100 : null;
    const foodCostPct = pvpNeto > 0 ? insumosTot / pvpNeto * 100 : null;

    // PVP sugerido por food cost objetivo (redondeado hacia arriba)
    const netoSug = insumosTot / (p.foodCostObjetivo / 100);
    let sug = p.ivaOn ? netoSug * (1 + p.ivaPct / 100) : netoSug;
    const rnd = p.redondeo > 0 ? p.redondeo : 1;
    const pvpSugerido = insumosTot > 0 ? Math.ceil(sug / rnd) * rnd : 0;
    // PVP mínimo (margen $0)
    const k = (p.ivaOn ? 1 / (1 + p.ivaPct / 100) : 1) - p.comisionPct / 100;
    const pvpMinimo = k > 0 ? (costoDirecto + overhead) / k : 0;

    return {
      id: id, nombre: r ? r.nombre : '', insumos: rc.porPorcion, guarnicion: guarn, guarnicionId: gid || null,
      envase: envase, imprevistos: imprev, overhead: overhead, comision: comision,
      costoDirecto: costoDirecto, costoTotal: costoTotal, pvp: pvp, pvpNeto: pvpNeto,
      margen: margen, margenPct: margenPct, foodCostPct: foodCostPct,
      pvpSugerido: pvpSugerido, pvpMinimo: pvpMinimo,
      rango: { min: (rc.minPorPorcion + guarn) * (1 + p.imprevistosPct / 100) + envase + overhead + comision,
               max: (rc.maxPorPorcion + guarn) * (1 + p.imprevistosPct / 100) + envase + overhead + comision },
      faltantes: rc.faltantes.concat(g ? g.faltantes : []), envaseFalta: envaseFalta, ciclo: rc.ciclo
    };
  }

  function esVendible(r) { return TIPOS_VENDIBLES.indexOf(r.tipo) >= 0; }

  function calcularTodo(state, opts) {
    const ctx = makeCtx(state, opts);
    const out = new Map();
    state.recetas.forEach(function (r) { if (esVendible(r)) out.set(r.id, costoPlato(ctx, r.id)); });
    out.ctx = ctx;
    return out;
  }

  /* ---------- guarniciones ---------- */
  function opcionesGuarnicion(ctx, id) {
    const r = ctx.recetas.get(id);
    if (!r) return [];
    const ids = (r.guarnicionesPermitidas || []).slice();
    return ids.map(function (gid) {
      const c = costoPlato(ctx, id, gid);
      const gr = ctx.recetas.get(gid);
      return { id: gid, nombre: gr ? gr.nombre : gid, costoGuarnicion: c.guarnicion, costoTotal: c.costoTotal,
        margen: c.margen, margenPct: c.margenPct, esDefecto: gid === r.guarnicionDefault };
    });
  }

  /* ---------- explosión de insumos (cantidades utilizables) ---------- */
  function explotar(ctx, id, mult, acc, stack) {
    acc = acc || new Map(); stack = stack || [];
    const r = ctx.recetas.get(id);
    if (!r || stack.indexOf(id) >= 0) return acc;
    const porciones = r.porciones > 0 ? r.porciones : 1;
    const sust = (ctx.opts.sust && ctx.opts.sust[id]) || {};
    (r.lineas || []).forEach(function (ln, idx) {
      const ref = sust[idx] || ln.ref;
      const q = (Number(ln.cantidad) || 0) * mult / porciones;
      if (ln.tipo === 'receta') {
        const sr = ctx.recetas.get(ref); const sp = sr && sr.porciones > 0 ? sr.porciones : 1;
        // ln.cantidad = porciones consumidas de la sub-receta; explotar su lote proporcional
        explotar(ctx, ref, q * sp, acc, stack.concat(id));
      } else {
        acc.set(ref, (acc.get(ref) || 0) + q);
      }
    });
    return acc;
  }

  // insumos por 1 porción vendida (incluye guarnición por defecto y envase)
  function explotarPlato(ctx, id, porciones) {
    porciones = porciones == null ? 1 : porciones;
    const r = ctx.recetas.get(id);
    const acc = explotar(ctx, id, porciones, new Map(), []);
    if (r && r.guarnicionDefault) explotar(ctx, r.guarnicionDefault, porciones, acc, []);
    if (r && r.envaseId) acc.set(r.envaseId, (acc.get(r.envaseId) || 0) + (r.envaseCant || 1) * porciones);
    return acc;
  }

  function usosDeInsumo(ctx, insumoId) {
    const res = [];
    ctx.state.recetas.forEach(function (r) {
      if (!esVendible(r)) return;
      const q = explotarPlato(ctx, r.id, 1).get(insumoId);
      if (q) res.push({ recetaId: r.id, nombre: r.nombre, linea: r.linea, tipo: r.tipo, cantidad: q });
    });
    return res.sort(function (a, b) { return b.cantidad - a.cantidad; });
  }

  /* ---------- impacto de un cambio (precio, oferta fijada, sustitución) ---------- */
  function impacto(state, cambio, opts) {
    const base = calcularTodo(state, opts);
    const merged = Object.assign({}, opts || {});
    ['precios', 'ofertaElegida', 'sust', 'params'].forEach(function (k) {
      if (cambio[k]) merged[k] = Object.assign({}, (opts && opts[k]) || {}, cambio[k]);
    });
    if (cambio.sust) {
      merged.sust = Object.assign({}, (opts && opts.sust) || {});
      Object.keys(cambio.sust).forEach(function (rid) {
        merged.sust[rid] = Object.assign({}, (opts && opts.sust && opts.sust[rid]) || {}, cambio.sust[rid]);
      });
    }
    const nuevo = calcularTodo(state, merged);
    const filas = [];
    base.forEach(function (b, id) {
      const n = nuevo.get(id);
      if (!n) return;
      const d = n.costoTotal - b.costoTotal;
      if (Math.abs(d) > 0.005) {
        filas.push({ id: id, nombre: b.nombre, costoAntes: b.costoTotal, costoDespues: n.costoTotal, delta: d,
          margenAntes: b.margen, margenDespues: n.margen, margenPctAntes: b.margenPct, margenPctDespues: n.margenPct });
      }
    });
    filas.sort(function (a, b) { return Math.abs(b.delta) - Math.abs(a.delta); });
    return { filas: filas, afectados: filas.length, deltaMedio: filas.length ? filas.reduce(function (s, f) { return s + f.delta; }, 0) / filas.length : 0 };
  }

  /* ---------- dieta ---------- */
  function nivelDieta(ins) { return DIETA_NIVEL[ins && ins.dieta] != null ? DIETA_NIVEL[ins.dieta] : 0; }

  // insumos (directos o vía sub-recetas) que violan la línea dietaria de la receta
  function violacionesDieta(ctx, id) {
    const r = ctx.recetas.get(id);
    if (!r || LINEA_NIVEL_MAX[r.linea] == null) return [];
    const maxNivel = LINEA_NIVEL_MAX[r.linea];
    const acc = explotarPlato(ctx, id, 1);
    const out = [];
    acc.forEach(function (q, insId) {
      const ins = ctx.insumos.get(insId);
      if (ins && ins.categoria !== 'Envases' && nivelDieta(ins) > maxNivel) out.push(ins.nombre);
    });
    return out;
  }

  function dietaCompatible(ctx, receta, insumo) {
    if (!receta || LINEA_NIVEL_MAX[receta.linea] == null) return true;
    return nivelDieta(insumo) <= LINEA_NIVEL_MAX[receta.linea];
  }

  /* ---------- alternativas de producto ---------- */
  // Para cada línea de insumo de una receta: otras ofertas del mismo insumo + sustitutos de la misma familia
  function alternativasReceta(ctx, id) {
    const r = ctx.recetas.get(id);
    if (!r) return [];
    const porciones = r.porciones > 0 ? r.porciones : 1;
    const res = [];
    (r.lineas || []).forEach(function (ln, idx) {
      if (ln.tipo !== 'insumo') return;
      const ins = ctx.insumos.get(ln.ref);
      if (!ins) return;
      const actual = costoInsumo(ctx, ln.ref);
      const q = (Number(ln.cantidad) || 0) / porciones;
      const opciones = [];
      (ctx.ofertasPorInsumo.get(ln.ref) || []).forEach(function (o) {
        if (o.disponible === false || o.pendiente) return;
        if (actual.oferta && o.id === actual.oferta.id) return;
        const c = costoNetoOferta(ctx, o);
        opciones.push({ tipo: 'oferta', insumoId: ln.ref, ofertaId: o.id, nombre: ins.nombre, lugar: o.lugar, marca: o.marca,
          unit: c, deltaPorPorcion: (c - actual.unit) * q });
      });
      if (ins.familia) {
        ctx.state.insumos.forEach(function (s) {
          if (s.id === ins.id || s.familia !== ins.familia || s.unidad !== ins.unidad) return;
          if (!dietaCompatible(ctx, r, s)) return;
          const c = costoInsumo(ctx, s.id);
          if (c.missing) return;
          opciones.push({ tipo: 'sustituto', insumoId: s.id, ofertaId: c.oferta ? c.oferta.id : null, nombre: s.nombre,
            lugar: c.oferta ? c.oferta.lugar : '', marca: c.oferta ? c.oferta.marca : '', unit: c.unit,
            deltaPorPorcion: (c.unit - actual.unit) * q });
        });
      }
      opciones.sort(function (a, b) { return a.deltaPorPorcion - b.deltaPorPorcion; });
      res.push({ idx: idx, ref: ln.ref, nombre: ins.nombre, cantidad: ln.cantidad, unidad: ins.unidad, actual: actual,
        costoLinea: (Number(ln.cantidad) || 0) * actual.unit / porciones, opciones: opciones });
    });
    return res;
  }

  // porciones semanales por plato: plan semanal si existe, si no reparto parejo de porcionesSemana
  function volumenSemanal(ctx) {
    const vol = new Map();
    const plan = ctx.state.plan;
    let usoPlan = false;
    if (plan) {
      Object.keys(plan).forEach(function (dia) {
        (plan[dia] || []).forEach(function (it) {
          if (!ctx.recetas.get(it.recetaId)) return;
          vol.set(it.recetaId, (vol.get(it.recetaId) || 0) + (Number(it.porciones) || 0)); usoPlan = true;
        });
      });
    }
    if (!usoPlan) {
      const activos = ctx.state.recetas.filter(function (r) { return r.tipo === 'plato' && r.activo !== false; });
      activos.forEach(function (r) { vol.set(r.id, ctx.p.porcionesSemana / (activos.length || 1)); });
    }
    return { vol: vol, usoPlan: usoPlan };
  }

  function usoSemanalInsumos(ctx) {
    const v = volumenSemanal(ctx);
    const total = new Map();
    v.vol.forEach(function (porc, rid) {
      explotarPlato(ctx, rid, porc).forEach(function (q, ins) { total.set(ins, (total.get(ins) || 0) + q); });
    });
    return { uso: total, usoPlan: v.usoPlan };
  }

  // ahorro posible por comprar cada insumo en su oferta más barata
  function ahorrosPosibles(ctx) {
    const u = usoSemanalInsumos(ctx);
    const res = [];
    ctx.state.insumos.forEach(function (ins) {
      const ofs = ofertasDisponibles(ctx, ins.id);
      if (ofs.length < 2) return;
      const actual = costoInsumo(ctx, ins.id);
      if (actual.missing) return;
      const costos = ofs.map(function (o) { return { o: o, c: costoNetoOferta(ctx, o) }; }).filter(function (x) { return x.c > 0; });
      if (!costos.length) return;
      const mejor = costos.reduce(function (a, b) { return b.c < a.c ? b : a; });
      const dif = actual.unit - mejor.c;
      const semanal = u.uso.get(ins.id) || 0;
      if (dif > 0.0001 && (!actual.oferta || mejor.o.id !== actual.oferta.id)) {
        res.push({ insumoId: ins.id, nombre: ins.nombre, actual: actual, mejor: mejor.o, mejorUnit: mejor.c,
          ahorroUnit: dif, ahorroPct: actual.unit > 0 ? dif / actual.unit * 100 : 0,
          usoSemanal: semanal, ahorroMes: dif * semanal * 4.33 });
      }
    });
    res.sort(function (a, b) { return b.ahorroMes - a.ahorroMes; });
    return { filas: res, usoPlan: u.usoPlan };
  }

  // peso de cada insumo en el costo total de la carta (por volumen semanal)
  function pesoEnCosto(ctx) {
    const u = usoSemanalInsumos(ctx);
    const filas = [];
    let total = 0;
    u.uso.forEach(function (q, id) {
      const ins = ctx.insumos.get(id); if (!ins) return;
      const c = costoInsumo(ctx, id);
      const costo = q * c.unit; total += costo;
      filas.push({ insumoId: id, nombre: ins.nombre, categoria: ins.categoria, costoSemana: costo });
    });
    filas.forEach(function (f) { f.pct = total > 0 ? f.costoSemana / total * 100 : 0; });
    filas.sort(function (a, b) { return b.costoSemana - a.costoSemana; });
    return { filas: filas, total: total };
  }

  /* ---------- lista de compras ---------- */
  function listaCompras(ctx, items) {
    // items: [{recetaId, porciones}]
    const acc = new Map();
    items.forEach(function (it) {
      if (!ctx.recetas.get(it.recetaId)) return;
      explotarPlato(ctx, it.recetaId, Number(it.porciones) || 0).forEach(function (q, ins) {
        acc.set(ins, (acc.get(ins) || 0) + q);
      });
    });
    const filas = [];
    acc.forEach(function (usable, insId) {
      const ins = ctx.insumos.get(insId); if (!ins) return;
      const c = costoInsumo(ctx, insId);
      const o = c.oferta;
      const rend = o ? (o.rendimiento != null ? o.rendimiento : (ins.rendimiento != null ? ins.rendimiento : 1)) : 1;
      const comprarBase = rend > 0 ? usable / rend : usable;
      const formato = o && o.formatoQty > 0 ? o.formatoQty : 0;
      const packs = formato > 0 ? Math.ceil(comprarBase / formato - 1e-9) : 0;
      filas.push({ insumoId: insId, nombre: ins.nombre, categoria: ins.categoria, unidad: ins.unidad,
        usable: usable, comprarBase: comprarBase, lugar: o ? o.lugar : '(sin oferta)', formatoLabel: o ? o.formatoLabel : '',
        formatoQty: formato, packs: packs, precioPack: o ? precioOferta(ctx, o) : 0,
        costo: formato > 0 ? packs * precioOferta(ctx, o) : usable * c.unit, costoTeorico: usable * c.unit, missing: c.missing });
    });
    filas.sort(function (a, b) { return a.lugar === b.lugar ? a.nombre.localeCompare(b.nombre) : a.lugar.localeCompare(b.lugar); });
    return filas;
  }

  /* ---------- chequeos de calidad de receta ---------- */
  function chequeos(ctx, id) {
    const r = ctx.recetas.get(id);
    const out = [];
    if (!r) return out;
    const rc = costoReceta(ctx, id);
    const nIns = (r.lineas || []).length;
    if (r.tipo === 'plato' && nIns < 5 && !rc.manual) out.push({ nivel: 'warn', msg: 'Pocos ingredientes (' + nIns + '): revisa condimentos, sofrito y verduras' });
    if (rc.manual) out.push({ nivel: 'info', msg: 'Costo manual: conviértela en receta para que reaccione a los precios' });
    if (rc.faltantes.length) out.push({ nivel: 'error', msg: 'Insumos sin precio: ' + rc.faltantes.join(', ') });
    if (rc.ciclo) out.push({ nivel: 'error', msg: 'Referencia circular entre sub-recetas' });
    if (esVendible(r)) {
      if (!r.pvp) out.push({ nivel: 'warn', msg: 'Sin PVP definido' });
      if (!r.envaseId && r.envaseManual == null) out.push({ nivel: 'warn', msg: 'Sin envase asignado' });
      if (r.tipo === 'plato' && !r.pasos) out.push({ nivel: 'info', msg: 'Sin pasos de preparación para cocina' });

(function () {

  App.rol = function () { return N.activo ? (N.perfil && N.perfil.rol) || null : 'admin'; };

    if (el) { el.textContent = App.textoGuardado(); el.className = 'saved' + (estado === 'error' ? ' bad' : ''); }
  }

    const g = N.guardado;
    if (g.estado === 'guardando') return '☁ Guardando…';
    if (g.estado === 'error') return '⚠ Sin guardar: reintentando (' + (g.msg || 'error') + ')';

  };

    if (!App.rol()) return;

      const m = (e && (e.message || e.details)) || '';
      if (/row-level security|permission denied|violates/i.test(m)) {

        recargarDatos();

        N.reintento = setTimeout(function () { N.reintento = null; if (N.fase === 'listo') guardar(Store.get()); }, 8000);

  async function recargarDatos() {
    try {
      const r = await N.sync.traer(App.esStaff());

  }

    if (r.error) throw r.error;
    return r.data;
  }

  async function cargarTodo() {
    if (!N.user) return;
    const uid = N.user.id;
    const vigente = function () { return N.user && N.user.id === uid; };   // la sesión pudo cerrarse mientras cargaba
    N.fase = 'cargando'; App.render();
