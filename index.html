    const proveedores = Array.from(grupos.values()).sort(function (a, b) { return b.bruto - a.bruto; });
    return { proveedores: proveedores, nProveedores: proveedores.length, totalItems: totalItems, totalLogistica: totalLog,
      total: totalItems + totalLog, bruto: bruto, creditoIva: credito, viable: viable };
  }

  // Elige en qué proveedores comprar la canasta para minimizar precio (en formatos reales) + despacho/visitas.
  // Prueba todas las combinaciones de proveedores (hasta 13 opcionales + los que son la única opción de algún insumo).
  function optimizarCanasta(ctx, items, opts) {
    opts = opts || {};
    const nec = necesidades(ctx, items);
    const cand = new Map(), sinOferta = [];
    nec.forEach(function (q, id) {
      if (!(q > 0)) return;
      const m = new Map();
      ofertasDisponibles(ctx, id).forEach(function (o) {
        if (!(o.formatoQty > 0) || !(precioOferta(ctx, o) > 0)) return;
        const p = proveedorDe(ctx, o);
        if (!p || p.activo === false) return;
        const c = compraConOferta(ctx, o, q), prev = m.get(p.id);
        if (!prev || c.costo < prev.costo) m.set(p.id, c);
      });
      if (m.size) cand.set(id, m); else sinOferta.push(id);
    });
    const insIds = Array.from(cand.keys());

    // proveedores obligatorios (única opción de algún insumo) y opcionales, ordenados por cuánto cubren
    const obligatorios = new Set(), cuenta = new Map();
    insIds.forEach(function (id) {
      const m = cand.get(id);
      if (m.size === 1) obligatorios.add(m.keys().next().value);
      m.forEach(function (c, pid) { cuenta.set(pid, (cuenta.get(pid) || 0) + c.costo); });
    });
    const MAX_OPC = opts.maxOpcionales || 13;
    const opcionales = Array.from(cuenta.keys()).filter(function (pid) { return !obligatorios.has(pid); })
      .sort(function (a, b) { return cuenta.get(b) - cuenta.get(a); }).slice(0, MAX_OPC);

    const elegir = function (permitidos) {
      const el = new Map();
      for (let i = 0; i < insIds.length; i++) {
        let best = null;
        cand.get(insIds[i]).forEach(function (c, pid) { if (permitidos.has(pid) && (!best || c.costo < best.costo)) best = c; });
        if (!best) return null;
        el.set(insIds[i], best);
      }
      return el;
    };

    // mueve insumos hacia proveedores que quedaron bajo su pedido mínimo, la compra mínima de una campaña o el despacho gratis, si eso abarata el total
    const mejorar = function (el, plan, permitidos) {
      let mejor = { el: el, plan: plan };
      for (let vuelta = 0; vuelta < 3; vuelta++) {
        let cambio = false;
        mejor.plan.proveedores.forEach(function (g) {
          if (!g.proveedor) return;
          const lg = g.logistica;
          const meta = lg.faltaMinimo > 0 ? lg.faltaMinimo : g.faltaCampana > 0 ? g.faltaCampana : (lg.faltaGratis > 0 && lg.costo > 0 ? lg.faltaGratis : 0);
          if (!(meta > 0)) return;
          const pid = g.proveedor.id;
          const movibles = [];
          mejor.el.forEach(function (c, id) {
            if (c.proveedorId === pid) return;
            const alt = cand.get(id).get(pid);
            if (alt && permitidos.has(pid)) movibles.push({ id: id, alt: alt, extra: alt.costo - c.costo });
          });
          movibles.sort(function (a, b) { return a.extra / (a.alt.bruto || 1) - b.extra / (b.alt.bruto || 1); });
          const el2 = new Map(mejor.el);
          let sumado = 0;
          for (let i = 0; i < movibles.length && sumado < meta; i++) { el2.set(movibles[i].id, movibles[i].alt); sumado += movibles[i].alt.bruto; }
          if (sumado < meta) return;
          const p2 = armarPlan(ctx, nec, el2);
          if ((p2.viable && !mejor.plan.viable) || (p2.viable === mejor.plan.viable && p2.total < mejor.plan.total - 0.5)) { mejor = { el: el2, plan: p2 }; cambio = true; }
        });
        if (!cambio) break;
      }
      return mejor;
    };

    const firma = function (el) { const ids = []; el.forEach(function (c) { ids.push(c.ofertaId); }); return ids.sort().join('|'); };
    const vistos = new Map();
    const n = opcionales.length;
    for (let mask = 0; mask < (1 << n); mask++) {
      if (!mask && !obligatorios.size) continue;
      const permitidos = new Set(obligatorios);
      for (let i = 0; i < n; i++) if (mask & (1 << i)) permitidos.add(opcionales[i]);
      const el = elegir(permitidos);
      if (!el) continue;
      const r = mejorar(el, armarPlan(ctx, nec, el), permitidos);
      const k = firma(r.el);
      if (!vistos.has(k)) vistos.set(k, r);
    }
    const todos = Array.from(vistos.values()).sort(function (a, b) { return (b.plan.viable - a.plan.viable) || (a.plan.total - b.plan.total); });
    // los mejores planes con combinaciones de proveedores distintas
    const planes = [], combos = new Set();
    for (let i = 0; i < todos.length && planes.length < (opts.cuantos || 3); i++) {
      const combo = todos[i].plan.proveedores.map(function (g) { return g.nombre; }).sort().join('|');
      if (combos.has(combo)) continue;
      combos.add(combo);
      planes.push(Object.assign({ eleccion: todos[i].el }, todos[i].plan));
    }

    // referencias: lo que compras hoy (ofertas en uso) y lo más barato ítem por ítem
    const elActual = new Map();
    insIds.forEach(function (id) {
      const o = costoInsumo(ctx, id).oferta;
      if (o && o.formatoQty > 0) elActual.set(id, compraConOferta(ctx, o, nec.get(id)));
    });
    const elBarato = elegir(new Set(cuenta.keys()));
    return {
      planes: planes, actual: Object.assign({ eleccion: elActual }, armarPlan(ctx, nec, elActual)),
      porItem: elBarato ? Object.assign({ eleccion: elBarato }, armarPlan(ctx, nec, elBarato)) : null,
      sinOferta: sinOferta, necesidades: nec, combinaciones: vistos.size, proveedoresConsiderados: obligatorios.size + n
    };
  }

  /* ---------- campañas: reconocer, proponer, listar y planificar compras ---------- */
  function clp(n) { return '$' + String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, '.'); }

  // ¿a qué campaña vigente pertenece una cotización? d = { proveedorId | lugar, precio, precioNormal, titulo, descripcion, textos[], fecha }
  // Pistas: la página nombra la campaña o una de sus claves (fuerte), el precio es uno de sus precios fijos (fuerte),
  // o es la única campaña de precios vigente y la página muestra un precio rebajado (media).
  // Las campañas de descuento no se eligen: se aplican solas sobre el precio normal (van aparte, en `descuentos`, para avisar).
  function reconocerCampana(ctx, d) {
    d = d || {};
    const p = (d.proveedorId && ctx.proveedores.get(d.proveedorId)) || ctx.provPorNombre.get(normNombre(d.lugar)) || null;
    if (!p) return { proveedor: null, sugerida: null, candidatas: [], vigentes: [], descuentos: [] };
    const cx = d.fecha ? variante(ctx, { params: { hoy: d.fecha } }) : ctx;
    const texto = ' ' + normNombre([d.titulo, d.descripcion].concat(d.textos || []).join(' ')) + ' ';
    const precio = Math.round(Number(d.precio) || 0), rebajado = Number(d.precioNormal) > Number(d.precio);
    let cands = (p.campanas || []).map(function (c) { return { campana: c, proveedor: p, estado: estadoCampana(cx, p, c), puntaje: 0, motivos: [] }; })
      .filter(function (x) { return x.estado === 'vigente' || x.estado === 'sin-membresia'; });
    const descuentos = cands.filter(function (x) { return x.campana.tipo === 'descuento'; }).map(function (x) { return x.campana; });
    cands = cands.filter(function (x) { return x.campana.tipo !== 'descuento'; });
    cands.forEach(function (x) {
      const c = x.campana;
      const frases = (c.claves || []).concat(c.nombre ? [c.nombre] : []).map(normNombre).filter(function (k) { return k.length >= 3; });
      const hit = frases.find(function (k) { return texto.indexOf(' ' + k + ' ') >= 0; });
      if (hit) { x.puntaje += 3; x.motivos.push('la página dice “' + hit + '”'); }
      if (precio > 0 && (c.preciosFijos || []).some(function (v) { return Math.round(Number(v)) === precio; })) { x.puntaje += 2; x.motivos.push('cuesta ' + clp(precio) + ', uno de los precios de la campaña'); }
    });
    if (rebajado && cands.length === 1 && !cands.some(function (x) { return x.puntaje > 0; })) {
      cands[0].puntaje = 1; cands[0].motivos.push('es la única campaña vigente y la página muestra un precio rebajado');
    }
    const lista = cands.filter(function (x) { return x.puntaje > 0; }).sort(function (a, b) { return b.puntaje - a.puntaje; });
    lista.forEach(function (x) { x.confianza = x.puntaje >= 2 ? 'alta' : 'media'; });
    return { proveedor: p, sugerida: lista[0] || null, candidatas: lista, vigentes: cands.map(function (x) { return x.campana; }), descuentos: descuentos };
  }

  // cotizaciones que el equipo marcó como "parte de una campaña" que aún no existe: agrupadas por proveedor + nombre
  function campanasPropuestas(ctx) {
    const g = new Map();
    (ctx.state.ofertas || []).forEach(function (o) {
      if (!o.campanaPropuesta || o.campanaId) return;
      const p = proveedorDe(ctx, o), nom = String(o.campanaPropuesta.nombre || '').trim();
      const k = (p ? p.id : 'L:' + normNombre(o.lugar)) + '|' + normNombre(nom);
      if (!g.has(k)) g.set(k, { clave: k, proveedor: p, lugar: p ? p.nombre : (o.lugar || ''), nombre: nom, ofertas: [], autores: [], desde: null, hasta: null });
      const x = g.get(k);
      x.ofertas.push(o);
      if (o.autor && x.autores.indexOf(o.autor) < 0) x.autores.push(o.autor);
      if (o.fecha && (!x.desde || o.fecha < x.desde)) x.desde = o.fecha;
      const h = o.temporal && !o.hastaPorConfirmar ? o.temporal.hasta : null;
      if (h && (!x.hasta || h > x.hasta)) x.hasta = h;
    });
    return Array.from(g.values()).map(function (x) { x.nInsumos = new Set(x.ofertas.map(function (o) { return o.insumoId; })).size; return x; })
      .sort(function (a, b) { return (b.desde || '').localeCompare(a.desde || ''); });
  }

  // ahorro semanal estimado de una campaña: lo que usas cada semana, a su precio frente al precio normal (sin promociones)
  function ahorroCampana(ctx, e) {
    const normal = variante(ctx, { sinPromos: true }), uso = usoSemanalInsumos(ctx).uso, insumos = [];
    let semana = 0;
    uso.forEach(function (q, id) {
      if (!(q > 0)) return;
      const n = costoInsumo(normal, id);
      if (n.missing || !n.oferta) return;
      const ref = unitLista(normal, n.oferta), ins = ctx.insumos.get(id);
      if (ref == null) return;
      let mejor = null;
      (ctx.ofertasPorInsumo.get(id) || []).forEach(function (o) {
        if (o.pendiente || o.disponible === false) return;
        const pv = proveedorDe(ctx, o);
        if (!pv || pv.id !== e.p.id) return;
        const u = unitLista(ctx, o);
        if (u == null) return;
        let v = null;
        if (o.campanaId === e.c.id) v = u;
        else if (e.c.tipo === 'descuento' && !esTemporal(o) && alcanzaA(e.c, o, ins)) v = u * (1 - (Number(e.c.descuentoPct) || 0) / 100);
        if (v != null && (mejor == null || v < mejor)) mejor = v;
      });
      if (mejor != null && mejor < ref) { semana += (ref - mejor) * q; insumos.push({ insumoId: id, ahorroSemana: (ref - mejor) * q, pct: (1 - mejor / ref) * 100 }); }
    });
    return { semana: semana, insumos: insumos.sort(function (a, b) { return b.ahorroSemana - a.ahorroSemana; }) };
  }

  // todas las campañas (de un proveedor o de todos) con su estado, productos vinculados y ahorro estimado
  function listaCampanas(ctx, proveedorId) {
    const out = [], hoy = hoyISO(ctx.p), porCamp = new Map();
    (ctx.state.ofertas || []).forEach(function (o) { if (o.campanaId) { if (!porCamp.has(o.campanaId)) porCamp.set(o.campanaId, []); porCamp.get(o.campanaId).push(o); } });
    ctx.campanas.forEach(function (e) {
      if (proveedorId && e.p.id !== proveedorId) return;
      const ofs = porCamp.get(e.c.id) || [], est = estadoCampana(ctx, e.p, e.c);
      const ah = est === 'vigente' || est === 'programada' || est === 'sin-membresia' ? ahorroCampana(ctx, e) : { semana: 0, insumos: [] };
      out.push({ campana: e.c, proveedor: e.p, estado: est, ofertas: ofs, nOfertas: ofs.filter(function (o) { return !o.pendiente; }).length,
        nPendientes: ofs.filter(function (o) { return o.pendiente; }).length, ahorroSemana: ah.semana, insumosAhorro: ah.insumos,
        minimo: compraMinima(e.c) && est === 'vigente' ? minimoSemanal(ctx, e) : null,
        diasRestantes: e.c.hasta ? diasEntre(hoy, e.c.hasta) : null, diasParaEmpezar: e.c.desde && e.c.desde > hoy ? diasEntre(hoy, e.c.desde) : 0 });
    });
    const orden = { vigente: 0, 'sin-membresia': 1, programada: 2, inactiva: 3, vencida: 4, excluida: 5 };
    return out.sort(function (a, b) { return orden[a.estado] - orden[b.estado] || (a.campana.hasta || '9999').localeCompare(b.campana.hasta || '9999'); });
  }

  // en qué campañas apareció un insumo y a qué precio frente al normal (para aprender cuándo conviene comprar)
  function historialCampanas(ctx, insumoId) {
    const normal = variante(ctx, { sinPromos: true }), n = costoInsumo(normal, insumoId);
    const ref = n.oferta ? unitLista(normal, n.oferta) : null;
    return (ctx.ofertasPorInsumo.get(insumoId) || []).filter(function (o) { return o.campanaId && !o.pendiente && ctx.campanas.has(o.campanaId); }).map(function (o) {
      const e = ctx.campanas.get(o.campanaId), u = unitLista(ctx, o);
      return { oferta: o, campana: e.c, proveedor: e.p, desde: e.c.desde || null, hasta: e.c.hasta || null, estado: estadoCampana(ctx, e.p, e.c),
        unit: u, normal: ref, descuentoPct: ref && u != null ? (1 - u / ref) * 100 : null };
    }).sort(function (a, b) { return (b.desde || '').localeCompare(a.desde || ''); });
  }

  // Planificar compras: para las próximas semanas, en qué proveedor y cuándo conviene comprar parte del plan aprovechando
  // campañas y promociones de despacho, respetando qué se acumula con qué. items = plan semanal [{recetaId, porciones}].
  // Devuelve propuestas (ventanas de fechas con la mejor combinación y su ahorro desglosado), los eventos para dibujar
  // la línea de tiempo (con qué se acumula cada uno) y el ahorro posible por día.
  function planCompras(ctx, items, opts) {
    opts = opts || {};
    const dias = opts.dias || 21, hoy = hoyISO(ctx.p), fin = fechaMenos(hoy, -(dias - 1));
    const dentro = function (f) { return !!f && f > hoy && f <= fin; };
    const cortes = new Set([hoy]), eventos = [];
    (ctx.state.proveedores || []).forEach(function (p) {
      if (p.activo === false) return;
      const reg = function (x, tipo, i) {
        if (x.activa === false || (x.hasta && x.hasta < hoy) || (x.desde && x.desde > fin)) return;
        if (tipo === 'despacho' && promoPrimeraUsada(ctx, p, x)) return;
        if (dentro(x.desde)) cortes.add(x.desde);
        if (x.hasta && dentro(fechaMenos(x.hasta, -1))) cortes.add(fechaMenos(x.hasta, -1));
        eventos.push({ clave: x.id || (p.id + ':' + tipo + ':' + i), id: x.id || null, tipo: tipo, nombre: x.nombre || (tipo === 'despacho' ? 'Promo de despacho' : 'Campaña'),
          proveedor: p, desde: x.desde && x.desde > hoy ? x.desde : hoy, hasta: x.hasta && x.hasta < fin ? x.hasta : fin, sinFin: !x.hasta, obj: x });
      };
      (p.campanas || []).forEach(function (c, i) { reg(c, 'campana', i); });
      (p.promosDespacho || []).forEach(function (pr, i) { reg(pr, 'despacho', i); });
    });
    // qué se acumula con qué (mismo proveedor): para dibujar enlaces y tramas
    eventos.forEach(function (a) {
      a.seAcumulaCon = []; a.noSeAcumulaCon = [];
      eventos.forEach(function (b) {
        if (a === b || a.proveedor.id !== b.proveedor.id || (a.tipo === 'despacho' && b.tipo === 'despacho')) return;
        const c = a.tipo === 'campana' ? a.obj : b.obj, x = a.tipo === 'campana' ? b.obj : a.obj;
        (seAcumulan(c, x, a.tipo === 'despacho' || b.tipo === 'despacho' ? 'despacho' : 'campana') ? a.seAcumulaCon : a.noSeAcumulaCon).push(b.clave);
      });
    });

    // referencia: el plan comprado a precio normal (sin campañas, ofertas temporales ni promos)
    const filasBase = listaCompras(variante(ctx, { sinPromos: true }), items).filter(function (f) { return f.usable > 0 && !f.missing; });
    const fechas = Array.from(cortes).sort(), crudas = [];
    fechas.forEach(function (d, i) {
      const hasta = i + 1 < fechas.length ? fechaMenos(fechas[i + 1], 1) : fin;
      const cd = d === hoy ? ctx : variante(ctx, { params: { hoy: d } });
      (ctx.state.proveedores || []).forEach(function (p) {
        if (p.activo === false) return;
        const hayCamp = (p.campanas || []).some(function (c) { return estadoCampana(cd, p, c) === 'vigente'; });
        const hayDesp = (p.promosDespacho || []).some(function (pr) { return estadoPromo(cd, p, pr) === 'vigente'; });
        if (!hayCamp && !hayDesp) return;
        const compras = [];
        filasBase.forEach(function (f) {
          let mejor = null;
          (cd.ofertasPorInsumo.get(f.insumoId) || []).forEach(function (o) {
            if (o.disponible === false || o.pendiente || fueraDeVigencia(cd, o) || !ofertaHabilitada(cd, o) || !(o.formatoQty > 0) || !(o.precio > 0)) return;
            const pv = proveedorDe(cd, o);
            if (!pv || pv.id !== p.id) return;
            const c = compraConOferta(cd, o, f.usable);
            if (!mejor || c.bruto < mejor.bruto) mejor = c;
          });
          if (!mejor) return;
          const aqui = f.proveedorId === p.id;
          if (aqui || mejor.bruto < f.costo - 1) compras.push(Object.assign({ insumoId: f.insumoId, nombre: f.nombre, usable: f.usable, normal: f.costo, yaAqui: aqui }, mejor));
        });
        if (!compras.length) return;
        const ev = opcionesPromoGrupo(cd, p, compras, { todas: true }), m = ev.mejor;
        if (!m || !m.viable) return;
        const normalItems = m.items.reduce(function (t, it) { return t + it.normal; }, 0);
        const ahorroProductos = m.items.reduce(function (t, it) { return t + Math.max(0, it.normal - it.bruto); }, 0);
        const lgNormal = logistica(variante(cd, { sinPromos: true }), p, m.bruto, m.online, m.brutoSel, { soloTienda: m.soloTienda });
        const ahorroDespacho = lgNormal ? Math.max(0, lgNormal.costo - m.logistica.costo) : 0;
        const ahorroTotal = ahorroProductos + ahorroDespacho;
        if (!(ahorroTotal > 0.5)) return;
        // de dónde sale el ahorro: cada campaña, promo por cantidad, ofertas sueltas, precio más bajo, despacho
        const origen = new Map();
        const sumar = function (k, nombre, tipo, monto) { if (!(monto > 0.5)) return; const x = origen.get(k) || { clave: k, nombre: nombre, tipo: tipo, monto: 0 }; x.monto += monto; origen.set(k, x); };
        m.items.forEach(function (it) {
          let resto = it.normal - it.bruto;
          if (!(resto > 0)) return;
          (it.descuentos || []).forEach(function (dd) { const v = Math.min(resto, dd.monto); sumar(dd.id || 'cantidad', dd.nombre, dd.tipo, v); resto -= v; });
          const o = cd.ofertas.get(it.ofertaId), e = campanaDe(cd, o);
          if (e) sumar(e.c.id, e.c.nombre || 'Campaña', 'campana', resto);
          else if (o && o.temporal) sumar('temporal', 'Ofertas temporales', 'temporal', resto);
          else sumar('precio', 'Precio más bajo aquí', 'precio', resto);
        });
        sumar('despacho', m.logistica.promo || 'Despacho', 'despacho', ahorroDespacho);
        const usadas = m.campanas.map(function (id) { return ctx.campanas.get(id); }).filter(Boolean);
        const avisos = [];
        if (m.sinFactura) avisos.push('Sin factura: ' + usadas.filter(function (e) { return e.c.excluyeFactura; }).map(function (e) { return e.c.nombre; }).join(', ') + ' excluye las compras con factura');
        if (m.online) avisos.push('Solo comprando online (app o web)');
        if (m.soloTienda) avisos.push('Solo comprando en la tienda');
        if (usadas.some(function (e) { return e.c.hastaAgotarStock; })) avisos.push('Hasta agotar stock');
        // combinaciones que no se permiten (para el comparador)
        const noPermitidas = [];
        const vigentes = (p.campanas || []).filter(function (c) { return estadoCampana(cd, p, c) === 'vigente'; });
        vigentes.forEach(function (c, ci) {
          (p.promosDespacho || []).filter(function (pr) { return estadoPromo(cd, p, pr) === 'vigente' && !seAcumulan(c, pr, 'despacho'); })
            .forEach(function (pr) { noPermitidas.push({ a: c.nombre || 'Campaña', b: pr.nombre || 'Promo de despacho', motivo: 'no se acumulan: el pedido usa una o la otra' }); });
          vigentes.slice(ci + 1).forEach(function (c2) {
            if (!seAcumulan(c, c2, 'campana')) noPermitidas.push({ a: c.nombre || 'Campaña', b: c2.nombre || 'Campaña', motivo: 'no se acumulan: en un mismo producto vale solo la mejor' });
          });
        });
        const nombreCamp = function (id) { const e = ctx.campanas.get(id); return e ? e.c.nombre || 'Campaña' : id; };
        crudas.push({ proveedor: p, desde: d, hasta: hasta,
          firma: p.id + '|' + m.campanas.slice().sort().join(',') + '|' + (m.logistica.promo || '') + '|' + m.items.map(function (it) { return it.ofertaId; }).sort().join(','),
          campanas: m.campanas.map(function (id) { return { id: id, nombre: nombreCamp(id) }; }), despacho: m.logistica.promo || null, logistica: m.logistica,
          productos: m.items.map(function (it) { return { insumoId: it.insumoId, nombre: it.nombre, ofertaId: it.ofertaId, packs: it.packs, bruto: it.bruto, normal: it.normal, ahorro: Math.max(0, it.normal - it.bruto), yaAqui: it.yaAqui }; })
            .sort(function (a, b) { return b.ahorro - a.ahorro; }),
          cesta: m.bruto, normal: normalItems, ahorroProductos: ahorroProductos, ahorroDespacho: ahorroDespacho, ahorroTotal: ahorroTotal, total: m.total,
          totalBruto: m.bruto + m.logistica.bruto, descuentos: Array.from(origen.values()).sort(function (a, b) { return b.monto - a.monto; }), avisos: avisos,
          sinFactura: m.sinFactura, online: m.online, noPermitidas: noPermitidas,
          opciones: ev.opciones.map(function (op) {
            return { campanas: op.campanas.map(nombreCamp), sin: op.excluidas.map(nombreCamp), despacho: op.logistica ? op.logistica.promo || null : null,
              modo: op.logistica ? op.logistica.modo : 'no alcanza el mínimo', productos: op.bruto, logistica: op.logistica ? op.logistica.bruto : null,
              total: op.total, totalBruto: op.bruto + (op.logistica ? op.logistica.bruto : 0), viable: op.viable, elegida: op === m };
          }).sort(function (a, b) { return (b.viable - a.viable) || (a.total - b.total); }) });
      });
    });
    // tramos seguidos con la misma combinación y los mismos productos = una sola propuesta
    const propuestas = [];
    crudas.sort(function (a, b) { return a.proveedor.id.localeCompare(b.proveedor.id) || a.desde.localeCompare(b.desde); }).forEach(function (x) {
      const prev = propuestas[propuestas.length - 1];
      if (prev && prev.firma === x.firma && fechaMenos(prev.hasta, -1) === x.desde) { prev.hasta = x.hasta; return; }
      propuestas.push(x);
    });
    propuestas.forEach(function (x) {
      x.estado = x.desde === hoy ? 'vigente' : 'programada';
      x.diasParaEmpezar = diasEntre(hoy, x.desde);
      x.diasRestantes = diasEntre(hoy, x.hasta);
    });
    propuestas.sort(function (a, b) { return b.ahorroTotal - a.ahorroTotal || a.desde.localeCompare(b.desde); });
    // ahorro posible cada día (la mejor propuesta que lo cubre)
    const porDia = [];
    for (let k = 0; k < dias; k++) {
      const f = fechaMenos(hoy, -k);
      const best = propuestas.filter(function (x) { return x.desde <= f && x.hasta >= f; }).reduce(function (a, x) { return !a || x.ahorroTotal > a.ahorroTotal ? x : a; }, null);
      porDia.push({ fecha: f, ahorro: best ? best.ahorroTotal : 0, propuesta: best ? propuestas.indexOf(best) : -1 });
    }
    return { desde: hoy, hasta: fin, dias: dias, propuestas: propuestas, eventos: eventos, porDia: porDia };
  }

  /* ---------- combos, precio de línea y menú del día ---------- */

  // un fallo nunca pasa en silencio: si un cambio no se pudo hacer, se dice (el detalle técnico queda en la consola)
  let ultimoAviso = 0;

  App.confirm = function (msg, onYes, labelYes, danger) {

    });
  };
  // opt.sugerencias: nombres existentes → autocompletado y aviso de parecidos; opt.usar(valor, cerrar): qué hacer si elige uno existente
  App.prompt = function (title, def, onOk, ph, opt) {
    const inp = h('input', { type: 'text', value: def || '', placeholder: ph || '', class: 'wide', onkeydown: function (ev) { if (ev.key === 'Enter') ev.target.closest('.modal').querySelector('.primary').click(); } });

      App.autoInput(inp, opt.sugerencias);
      cuerpo = h('div', { class: 'stack' }, inp, App.avisoParecidos(inp, opt.sugerencias, function (v) {
        if (opt.usar) opt.usar(v, function () { cerrarModal(); }); else { inp.value = v; inp.focus(); }
      }));
    }
    const close = cerrarModal = App.modal(title, cuerpo, function (close) {
      return [App.btn('Cancelar', close), App.btn('Aceptar', function () { const v = inp.value.trim(); if (v) { close(); onOk(v); } }, 'primary')];
    });

  };
  App.descargar = function (nombre, texto, tipo) {

    const a = h('a', { href: URL.createObjectURL(blob), download: nombre });
    document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  };

  // elegir un archivo .json de respaldo e importarlo (en la nube reemplaza los datos de todos)
  App.importarRespaldo = function () {
    const inp = h('input', { type: 'file', accept: '.json,application/json', style: { display: 'none' }, onchange: function (ev) {
      const f = ev.target.files[0]; inp.remove(); if (!f) return;

        const go = function () {
          try { Store.importJSON(rd.result); App.toast('Respaldo importado'); }
          catch (e) { App.modal('No se pudo importar', h('p', null, String(e.message || e)), function (c) { return [App.btn('Cerrar', c, 'primary')]; }); }
        };
        if (App.nube.activo) App.confirm('Esto reemplaza los datos en la nube para “todos” los usuarios con el contenido de "' + f.name + '". ¿Continuar?', go, 'Reemplazar', true);
        else go();
      };

    } });
    document.body.appendChild(inp); inp.click();
  };

  /* ---------- datos derivados con caché ---------- */
  App.escenario = function () {
    const s = Store.get();
    return s.escenarioActivo ? s.escenarios.find(function (e) { return e.id === s.escenarioActivo; }) || null : null;
  };
  App.opts = function () {
    const e = App.escenario();
    return e ? { precios: e.precios || {}, ofertaElegida: e.ofertaElegida || {}, sust: e.sust || {} } : {};
  };
  App.ctx = function () {
    if (App.cache.ctxV !== App.version) { App.cache.ctx = E.makeCtx(Store.get(), App.opts()); App.cache.ctxV = App.version; }
    return App.cache.ctx;
  };
  App.ctxBase = function () {
    if (App.cache.baseV !== App.version) { App.cache.base = E.makeCtx(Store.get(), {}); App.cache.baseV = App.version; }
    return App.cache.base;
  };
  App.calc = function () {
    if (App.cache.calcV !== App.version) { App.cache.calc = E.calcularTodo(Store.get(), App.opts()); App.cache.calcV = App.version; }
    return App.cache.calc;
  };
  App.calcBase = function () {
    if (!App.escenario()) return App.calc();
    if (App.cache.calcBV !== App.version) { App.cache.calcB = E.calcularTodo(Store.get(), {}); App.cache.calcBV = App.version; }
    return App.cache.calcB;
  };
  App.receta = function (id) { return Store.get().recetas.find(function (r) { return r.id === id; }); };
  App.insumo = function (id) { return Store.get().insumos.find(function (i) { return i.id === id; }); };
  App.ofertasDe = function (id) { return Store.get().ofertas.filter(function (o) { return o.insumoId === id; }); };

  /* ---------- escenarios ---------- */
  App.ensureEscenario = function () {
    if (App.escenario()) return App.escenario();
    const id = Store.uid('E');
    Store.mutate(function (s) {
      s.escenarios.push({ id: id, nombre: 'Escenario ' + (s.escenarios.length + 1), precios: {}, ofertaElegida: {}, sust: {}, creado: App.hoy() });
      s.escenarioActivo = id;
    });
    return App.escenario();
  };
  // cambio: {precios:{ofertaId:n}, ofertaElegida:{insumoId:ofertaId}, sust:{recetaId:{idx:insumoId}}}
  App.simular = function (cambio) {
    App.ensureEscenario();
    const id = Store.get().escenarioActivo;
    Store.mutate(function (s) {
      const e = s.escenarios.find(function (x) { return x.id === id; });
      e.precios = Object.assign(e.precios || {}, cambio.precios || {});
      e.ofertaElegida = Object.assign(e.ofertaElegida || {}, cambio.ofertaElegida || {});
      e.sust = e.sust || {};
      if (cambio.sust) Object.keys(cambio.sust).forEach(function (rid) { e.sust[rid] = Object.assign(e.sust[rid] || {}, cambio.sust[rid]); });
    });
    App.toast('Cambio agregado al ' + App.escenario().nombre);
  };
  App.aplicarEscenario = function (id) {
    Store.mutate(function (s) {
      const e = s.escenarios.find(function (x) { return x.id === id; }); if (!e) return;
      Object.keys(e.precios || {}).forEach(function (oid) {
        const o = s.ofertas.find(function (x) { return x.id === oid; });
        if (o) { App.registrarPrecio(o, e.precios[oid]); o.precio = e.precios[oid]; o.fecha = App.hoy(); }
      });
      Object.keys(e.ofertaElegida || {}).forEach(function (insId) {
        s.ofertas.forEach(function (o) { if (o.insumoId === insId) o.preferida = (o.id === e.ofertaElegida[insId]); });
      });
      Object.keys(e.sust || {}).forEach(function (rid) {
        const r = s.recetas.find(function (x) { return x.id === rid; }); if (!r) return;
        Object.keys(e.sust[rid]).forEach(function (idx) { if (r.lineas[idx]) { r.lineas[idx].ref = e.sust[rid][idx]; r.lineas[idx].nota = 'sustituido'; } });
      });
      s.escenarios = s.escenarios.filter(function (x) { return x.id !== id; });
      s.escenarioActivo = null;
    });
    App.toast('Escenario aplicado a los datos reales');
  };
  // guarda el precio vigente en el historial antes de reemplazarlo; un precio del mismo día se corrige, no se acumula
  App.registrarPrecio = function (o, nuevo, fecha) {
    if (o.precio === nuevo || !(o.precio > 0) || !o.fecha || o.fecha >= (fecha || App.hoy())) return;
    o.historial = o.historial || [];
    o.historial.push({ fecha: o.fecha, precio: o.precio, fuente: o.fuente || null });
    if (o.historial.length > 60) o.historial.shift();
  };

  /* ---------- render ---------- */
  function captureFocus() {
    const a = document.activeElement;
    if (a && a.dataset && a.dataset.fk) return { fk: a.dataset.fk, s: a.selectionStart, e: a.selectionEnd, v: a.value, num: a.dataset.num };
    return null;
  }
  function restoreFocus(f) {
    if (!f) return;
    const el = document.querySelector('[data-fk="' + String(f.fk).replace(/"/g, '\\"') + '"]');
    if (!el) return;
    if (f.num && App.parseNum(f.v) === App.parseNum(el.value)) el.value = f.v;
    el.focus();
    try { if (f.s != null) el.setSelectionRange(f.s, f.e); } catch (e) { /* inputs sin selección */ }
  }

  const NAV = [['panel', 'Panel'], ['platos', 'Platos y PVP'], ['recetas', 'Recetas'], ['insumos', 'Insumos y compras'], ['alternativas', 'Alternativas'],
    ['cocina', 'Cocina'], ['cotizaciones', 'Cotizaciones'], ['compras', 'Lista de compras'], ['proveedores', 'Proveedores'], ['ajustes', 'Ajustes'], ['guia', '❓ Guía'], ['historial', 'Historial'], ['usuarios', 'Usuarios']];

  function headerNode() {
    const s = Store.get(), esc = App.escenario(), staff = App.esStaff();
    const guardado = App.nube.activo ? App.textoGuardado() : Store.storageOk() ? (Store.lastSaved() ? 'Guardado ' + Store.lastSaved().toLocaleTimeString('es-CL', { hour: '2-digit', minute: '2-digit' }) : 'Autoguardado activo') : 'Sin autoguardado: exporta un respaldo';
    return h('header', { class: 'top' },
      h('div', { class: 'brand' }, h('span', { class: 'logo' }, '🍲'), h('div', null, h('b', null, 'Colaciones Cerro Jiménez'), h('small', null, 'Costeo, recetas y compras'))),
      h('nav', { class: 'tabs', role: 'tablist' }, NAV.filter(function (n) { return App.puedeVer(n[0]); }).map(function (n) {
        const pend = n[0] === 'cotizaciones' && App.cotizacionesPendientes ? App.cotizacionesPendientes() : n[0] === 'proveedores' && App.urgenciasAbiertas ? App.urgenciasAbiertas() + (App.campanasPorCompletar ? App.campanasPorCompletar() : 0) : 0;
        return h('a', { href: '#/' + n[0], class: 'tab' + (App.route.name === n[0] ? ' on' : ''), role: 'tab' }, n[1], pend ? h('span', { class: 'count' }, pend) : null);
      })),
      h('div', { class: 'tools' },
        !staff ? null : App.select({ cls: 'esc-sel', fk: 'esc-sel', value: s.escenarioActivo || '', options: [['', 'Datos reales']].concat(s.escenarios.map(function (e) { return [e.id, '🧪 ' + e.nombre]; })),
          onChange: function (v) { Store.mutate(function (st) { st.escenarioActivo = v || null; }); } }),
        !staff ? null : h('button', { class: 'btn ghost', onclick: function () { Store.undo(); }, disabled: !Store.canUndo(), title: 'Deshacer (Ctrl+Z)' }, '↶ Deshacer'),
        !(staff || App.nube.activo) ? null : h('small', { class: 'saved' + ((App.nube.activo ? App.nube.guardado.estado === 'error' : !Store.storageOk()) ? ' bad' : '') }, guardado),
        App.usuarioHeader ? App.usuarioHeader() : null),
      esc ? h('div', { class: 'esc-banner' }, h('b', null, '🧪 Simulación: ' + esc.nombre), ' — los números de toda la app incluyen este escenario; tus datos reales no cambian.',
        App.btn('Aplicar a datos reales', function () { App.confirm('¿Aplicar los cambios de "' + esc.nombre + '" a tus precios y recetas reales?', function () { App.aplicarEscenario(esc.id); }, 'Aplicar'); }, 'small primary'),
        App.btn('Salir', function () { Store.mutate(function (st) { st.escenarioActivo = null; }); }, 'small'),
        App.btn('Descartar', function () { Store.mutate(function (st) { st.escenarios = st.escenarios.filter(function (x) { return x.id !== esc.id; }); st.escenarioActivo = null; }); }, 'small danger')) : null,
      App.bannerDemo ? App.bannerDemo() : null, App.bannerVersion ? App.bannerVersion() : null);
  }

  App.render = function () {
    const f = captureFocus();
    const scrolls = {};
    document.querySelectorAll('[data-sk]').forEach(function (el) { scrolls[el.dataset.sk] = el.scrollTop; });
    const y = window.scrollY;
    const root = document.getElementById('app');
    if (App.nube.activo && App.nube.fase !== 'listo') { root.replaceChildren(App.pantallaAcceso()); document.title = 'Colaciones'; return; }
    const view = App.views[App.route.name] || App.views.panel;
    let body;
    try { body = view(App.route.arg); }
    catch (err) { console.error(err); body = h('div', { class: 'card' }, h('h3', null, 'Error al mostrar la vista'), h('pre', null, String(err && err.stack || err))); }
    root.replaceChildren(headerNode(), h('main', { class: 'main view-' + App.route.name }, body), App.pieAyudas ? App.pieAyudas() : null);
    if (App.aplicarAC) App.aplicarAC(root);   // antes de restaurar el foco
    if (App.aplicarAyudas) App.aplicarAyudas(root);   // antes de restaurar el foco: la ayuda del campo en edición reaparece sola
    document.querySelectorAll('[data-sk]').forEach(function (el) { if (scrolls[el.dataset.sk] != null) el.scrollTop = scrolls[el.dataset.sk]; });
    window.scrollTo(0, y);
    restoreFocus(f);

  App.go = function (name, arg) {
    location.hash = '#/' + name + (arg ? '/' + encodeURIComponent(arg) : '');
  };
  function parseHash() {
    const partes = location.hash.replace(/^#\/?/, '').split('?');
    if (partes[0] === 'capturar' && partes[1] && App.recibirCaptura) App.recibirCaptura(partes[1]);   // datos del botón ➕ Cotizar
    const m = partes[0].split('/');
    let name = App.views[m[0]] ? m[0] : App.vistaInicial();
    if (!App.puedeVer(name) && (!App.nube.activo || App.nube.fase === 'listo')) name = App.vistaInicial();
    const arg = m[1] ? decodeURIComponent(m[1]) : null;
    const cambio = App.route.name !== name || App.route.arg !== arg;
    App.route = { name: name, arg: arg };
    if (cambio) { window.scrollTo(0, 0); }
    App.render();
  }

  App.start = function () {
    if (App.nube.activo) App.iniciarNube(); else Store.load();
    Store.subscribe(function (ev) {
      if (ev === 'change') { App.version++; App.render(); }
      else if (ev === 'error') App.avisarFallo(arguments[1]);
      else if (ev === 'saved' && !App.nube.activo) { const el = document.querySelector('.saved'); if (el && Store.lastSaved()) el.textContent = 'Guardado ' + Store.lastSaved().toLocaleTimeString('es-CL', { hour: '2-digit', minute: '2-digit' }); }
    });
    window.addEventListener('hashchange', parseHash);
    // errores sin atrapar en botones y demás acciones (los de un cambio revertido ya se avisaron)
    window.addEventListener('error', function (ev) { if (ev.error && !ev.error.revertido) App.avisarFallo(ev.error); });
    window.addEventListener('unhandledrejection', function (ev) { if (!(ev.reason && ev.reason.revertido)) App.avisarFallo(ev.reason); });
    window.addEventListener('beforeunload', function () { Store.flush(); });
    document.addEventListener('keydown', function (ev) {
      if ((ev.ctrlKey || ev.metaKey) && ev.key === 'z' && !/INPUT|TEXTAREA/.test((document.activeElement || {}).tagName || '')) { ev.preventDefault(); Store.undo(); }
    });
    parseHash();
  };
})();

    'llega': 'Cuándo tendrías el producto: ahora si vas a comprarlo, o según el plazo del despacho y su hora de corte.',
    'vs. normal': 'Cuánto más (o menos) pagas que comprando esa cantidad con la oferta de siempre.',
    'como': 'Ir a comprar, retirar un pedido online o despacho (normal o en promoción).',

    'compra de oportunidad': 'Lo comprado queda como sobrestock y se descuenta solo con el consumo: la lista de compras no te lo vuelve a pedir hasta que se gaste.'
  };

  const norm = function (s) {
    return String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[▲▼↑↓]/g, '').replace(/\s+/g, ' ').replace(/[:*]+$/, '').trim();
  };
  // texto propio de una etiqueta, sin el de los controles que contiene
  const textoPropio = function (el) {
    let t = '';

    try { return localStorage.getItem(CLAVE) !== '0'; } catch (e) { return true; }
  };
  function fijarAyudas(on) {
    try { localStorage.setItem(CLAVE, on ? '1' : '0'); } catch (e) { /* sin almacenamiento: vale hasta recargar */ }

  }

  /* ---------- asignar textos tras cada render ---------- */
  App.aplicarAyudas = function (root) {
    ocultar();
    const on = App.ayudasOn();
    // 1. los `title` existentes pasan a la burbuja (el del navegador es lento y no funciona en celular)
    root.querySelectorAll('[title]').forEach(function (el) {
      const t = el.getAttribute('title');
      if (!t) return;
      if (on) { if (!el.dataset.ayuda) el.dataset.ayuda = t; el.removeAttribute('title'); }
      else if (!/^(BUTTON|A)$/.test(el.tagName)) el.removeAttribute('title');
    });
    if (!on) return;
    // 2. campos por nombre
    root.querySelectorAll('[data-fk]').forEach(function (el) {
      if (el.dataset.ayuda) return;
      const fk = el.dataset.fk;
      for (let i = 0; i < CAMPOS.length; i++) { if (fk.indexOf(CAMPOS[i][0]) === 0) { el.dataset.ayuda = CAMPOS[i][1]; return; } }
    });
    // 3. encabezados, indicadores y etiquetas por su texto
    root.querySelectorAll('th, label').forEach(function (el) {
      if (el.dataset.ayuda) return;
      const t = TEXTOS[el.tagName === 'TH' ? norm(el.textContent) : textoPropio(el)];
      if (t) el.dataset.ayuda = t;
    });
    root.querySelectorAll('.kpi').forEach(function (el) {
      if (el.dataset.ayuda) return;
      const l = el.querySelector('.kpi-l');
      const t = l && TEXTOS[norm(l.textContent)];
      if (t) el.dataset.ayuda = t;
    });
  };

  /* ---------- burbuja ---------- */
  let tip = null, ancla = null, espera = null, cierre = null, tecleo = 0;
  function ocultar() {
    clearTimeout(espera); clearTimeout(cierre); espera = cierre = null;
    if (tip) { tip.remove(); tip = null; }
    ancla = null;
  }
  function mostrar(el) {
    if (!App.ayudasOn() || !el || !el.isConnected) return;
    const txt = el.dataset.ayuda;
    if (!txt) return;
    if (ancla === el && tip) return;
    ocultar();
    ancla = el;
    tip = h('div', { class: 'ayuda-tip', role: 'tooltip' }, txt);
    document.body.appendChild(tip);
    const r = el.getBoundingClientRect(), w = tip.offsetWidth, hh = tip.offsetHeight, m = 8;
    let x = Math.min(Math.max(m, r.left), window.innerWidth - w - m);
    let y = r.bottom + 6;
    if (y + hh > window.innerHeight - m) y = Math.max(m, r.top - hh - 6);
    tip.style.left = x + 'px'; tip.style.top = y + 'px';
  }
  const objetivo = function (ev) { return ev.target && ev.target.closest ? ev.target.closest('[data-ayuda]') : null; };

  document.addEventListener('mouseover', function (ev) {
    const el = objetivo(ev);
    if (!el || el === ancla || Date.now() - tecleo < 800) return;
    clearTimeout(espera);
    espera = setTimeout(function () { mostrar(el); }, 300);
  });
  document.addEventListener('mouseout', function (ev) {
    const el = objetivo(ev);
    if (!el || (ev.relatedTarget && el.contains(ev.relatedTarget))) return;
    if (document.activeElement === el) return;   // campo con el cursor dentro: la ayuda sigue mientras escribe
    ocultar();
  });
  document.addEventListener('focusin', function (ev) {
    const el = objetivo(ev);
    if (!el || Date.now() - tecleo < 800) return;
    mostrar(el);
    clearTimeout(cierre);
    cierre = setTimeout(ocultar, 7000);
  });
  document.addEventListener('focusout', ocultar);
  document.addEventListener('keydown', function () { tecleo = Date.now(); if (tip) ocultar(); }, true);
  document.addEventListener('touchstart', function (ev) {
    const el = objetivo(ev);
    if (!el) { ocultar(); return; }
    mostrar(el);
    clearTimeout(cierre);
    cierre = setTimeout(ocultar, 4000);
  }, { passive: true });
  window.addEventListener('scroll', ocultar, true);
  window.addEventListener('resize', ocultar);

  /* ---------- interruptor general (pie de página) ---------- */
  App.pieAyudas = function () {
    return h('footer', { class: 'pie noprint' },
      h('label', { class: 'chk' }, h('input', { type: 'checkbox', checked: App.ayudasOn(), onchange: function (ev) { fijarAyudas(ev.target.checked); } }),
        ' Mostrar ayudas al pasar el mouse sobre los campos'));
  };
})();

/* Autocompletado de nombres (insumos, lugares, proveedores…), al estilo Excel:
 *  - lista propia bajo el campo con lo que contiene lo escrito (sin importar mayúsculas ni tildes),
 *  - texto gris dentro del campo cuando una opción empieza igual (Tab, → o Enter lo aceptan),
 *  - flechas para recorrer la lista, Enter elige, Esc cierra.
 * Se activa solo en todo <input list="…"> (reemplaza la lista nativa del navegador) y en los cuadros de nombre
 * que lo pidan con App.autoInput / App.prompt(..., { sugerencias }). */
(function () {
  'use strict';
  const App = window.App, h = App.h, E = window.Engine;
  const MAX = 12;
  const norm = E.normNombre;
  let ac = null, pop = null, ghost = null, eligiendo = false;

  /* ---------- opciones y coincidencias ---------- */
  function opcionesDe(el) {
    if (el._acItems) return typeof el._acItems === 'function' ? el._acItems() : el._acItems;
    const dl = el.dataset.acList && document.getElementById(el.dataset.acList);
    return dl ? Array.from(dl.options).map(function (o) { return o.value; }) : [];
  }
  // primero las que empiezan igual, luego las que tienen una palabra que empieza igual, al final las que lo contienen
  function coincidencias(items, q, todas) {
    const k = norm(q);
    if (!k) return todas ? items.slice(0, MAX) : [];
    const pre = [], pal = [], con = [], vistos = new Set();
    items.forEach(function (v) {
      const n = norm(v);
      if (!n || vistos.has(n)) return;
      vistos.add(n);
      if (n === k) return;
      if (n.indexOf(k) === 0) pre.push(v);
      else if (n.split(' ').some(function (w) { return w.indexOf(k) === 0; })) pal.push(v);
      else if (n.indexOf(k) >= 0) con.push(v);
    });
    return pre.concat(pal, con).slice(0, MAX);
  }
  App.autoInput = function (input, items) { input._acItems = items; input.setAttribute('autocomplete', 'off'); return input; };
  const esAC = function (el) { return !!el && el.nodeType === 1 && el.tagName === 'INPUT' && (el.dataset.ac === '1' || !!el._acItems); };

  // convierte los <input list> de la vista en campos con autocompletado propio (la lista nativa se desactiva)
  App.aplicarAC = function (root) {
    root.querySelectorAll('input[list]').forEach(function (el) {
      el.dataset.acList = el.getAttribute('list'); el.dataset.ac = '1';
      el.removeAttribute('list'); el.setAttribute('autocomplete', 'off');
    });
  };

  /* ---------- dibujo ---------- */
  function cerrarLista() { if (pop) { pop.remove(); pop = null; } }
  function cerrarGhost() { if (ghost) { ghost.remove(); ghost = null; } }
  function cerrar() { cerrarLista(); cerrarGhost(); ac = null; }

  function resaltar(txt, q) {
    const i = txt.toLowerCase().indexOf(q.trim().toLowerCase());
    if (!q.trim() || i < 0) return [txt];
    return [txt.slice(0, i), h('b', null, txt.slice(i, i + q.trim().length)), txt.slice(i + q.trim().length)];
  }
  function posicionar() {
    if (!ac || !ac.el.isConnected) return;
    const r = ac.el.getBoundingClientRect();
    if (pop) {
      pop.style.minWidth = Math.max(r.width, 220) + 'px';
      const hh = pop.offsetHeight;
      let y = r.bottom + 2;
      if (y + hh > window.innerHeight - 8) y = Math.max(8, r.top - hh - 2);
      pop.style.left = Math.min(Math.max(8, r.left), window.innerWidth - pop.offsetWidth - 8) + 'px';
      pop.style.top = y + 'px';
    }
    if (ghost) { ghost.style.left = r.left + 'px'; ghost.style.top = r.top + 'px'; ghost.style.width = r.width + 'px'; ghost.style.height = r.height + 'px'; }
  }
  function dibujarGhost() {
    cerrarGhost();
    const el = ac.el, v = el.value;
    if (!v || ac.sel >= 0 || el.selectionStart !== v.length) return;
    const c = ac.res.find(function (x) { return x.length > v.length && x.toLowerCase().indexOf(v.toLowerCase()) === 0; });
    if (!c) return;

    const cs = getComputedStyle(el);

      paddingLeft: (parseFloat(cs.paddingLeft) + parseFloat(cs.borderLeftWidth)) + 'px' } },
      h('span', { style: { visibility: 'hidden' } }, v), c.slice(v.length));
    document.body.appendChild(ghost);
  }
  function dibujar() {
    cerrarLista();
    ac.ghost = null;
    if (!ac.res.length) { cerrarGhost(); return; }
    pop = h('div', { class: 'ac-lista', role: 'listbox' }, ac.res.map(function (v, i) {
      return h('div', { class: 'ac-item' + (i === ac.sel ? ' on' : ''), role: 'option', 'aria-selected': i === ac.sel ? 'true' : 'false',
        onpointerdown: function (ev) { ev.preventDefault(); elegir(v); } }, resaltar(v, ac.el.value));
    }));

    dibujarGhost();
    posicionar();
  }
  function actualizar(todas) {
    if (!ac) return;
    ac.res = coincidencias(opcionesDe(ac.el), ac.el.value, todas);
    ac.sel = -1;
    dibujar();
  }

  function elegir(valor) {
    if (!ac) return;
    const el = ac.el;
    eligiendo = true;
    el.value = valor;
    el.dispatchEvent(new Event('input', { bubbles: true }));
    el.dispatchEvent(new Event('change', { bubbles: true }));
    eligiendo = false;
    cerrar();
  }

  // tras cada render la página reconstruye el campo: se vuelve a anclar la lista al nuevo
  App.reanclarAC = function () {
    if (!ac) return;
    const el = ac.fk ? document.querySelector('[data-fk="' + String(ac.fk).replace(/"/g, '\\"') + '"]') : ac.el;
    if (!el || document.activeElement !== el) { cerrar(); return; }
    ac.el = el;
    actualizar(false);
  };

  /* ---------- eventos (delegados, en captura: corren antes que los del propio campo) ---------- */
  document.addEventListener('input', function (ev) {
    const el = ev.target;
    if (eligiendo || !esAC(el)) return;
    ac = { el: el, fk: el.dataset.fk || null, sel: -1, res: [] };
    actualizar(false);
  }, true);
  document.addEventListener('keydown', function (ev) {
    const el = ev.target;
    if (!esAC(el)) return;
    if (ev.key === 'ArrowDown' && (!ac || ac.el !== el)) { ac = { el: el, fk: el.dataset.fk || null, sel: -1, res: [] }; actualizar(true); ev.preventDefault(); return; }
    if (!ac || ac.el !== el) return;
    const n = ac.res.length;
    if (ev.key === 'ArrowDown' && n) { ac.sel = Math.min(ac.sel + 1, n - 1); dibujar(); ev.preventDefault(); }
    else if (ev.key === 'ArrowUp' && n) { ac.sel = Math.max(ac.sel - 1, -1); dibujar(); ev.preventDefault(); }
    else if ((ev.key === 'Enter' || ev.key === 'Tab') && (ac.sel >= 0 || ac.ghost)) {
      const v = ac.sel >= 0 ? ac.res[ac.sel] : ac.ghost;
      ev.preventDefault(); ev.stopPropagation(); elegir(v);
    }
    else if (ev.key === 'ArrowRight' && ac.ghost && el.selectionStart === el.value.length) { ev.preventDefault(); elegir(ac.ghost); }
    else if (ev.key === 'Escape' && (pop || ghost)) { ev.stopPropagation(); cerrar(); }
  }, true);
  // al reconstruir la página el campo pierde y recupera el foco en el mismo instante: se cierra solo si el foco no vuelve
  document.addEventListener('focusout', function (ev) {
    if (!ac || ev.target !== ac.el) return;
    setTimeout(function () {
      if (!ac) return;
      const el = ac.fk ? document.querySelector('[data-fk="' + String(ac.fk).replace(/"/g, '\\"') + '"]') : ac.el;
      if (!el || document.activeElement !== el) cerrar();
    }, 0);
  }, true);
  window.addEventListener('scroll', function () { posicionar(); }, true);
  window.addEventListener('resize', function () { posicionar(); });

  /* ---------- aviso de nombres parecidos (cuadros "Nuevo …") ---------- */
  App.avisoParecidos = function (input, items, usar) {
    const caja = h('div', { class: 'ac-aviso' });
    const pintar = function () {
      const r = E.parecidos(items, input.value);
      caja.replaceChildren();
      if (!r.igual && !r.parecidos.length) return;
      caja.appendChild(h('div', { class: r.igual ? 'bad-t' : 'warn-t' }, r.igual ? 'Ya existe: ' : '¿Quisiste decir…? '));
      (r.igual ? [r.igual] : r.parecidos).forEach(function (v) {
        caja.appendChild(App.btn(r.igual ? 'Usar “' + v + '”' : v, function () { usar(v); }, 'small'));
      });
    };
    input.addEventListener('input', pintar);
    return caja;
  };
})();

  App.esStaff = function () { const r = App.rol(); return r === 'admin' || r === 'gerente' || r === 'visita'; };
  App.puedeVer = function (vista) {
    const r = App.rol();
    if (r && !ROL_TXT[r]) return false;   // rol que esta versión no conoce: mejor no mostrar datos incompletos
    if (vista === 'usuarios' || vista === 'historial') return N.activo && r === 'admin';
    if (r === 'cocina') return vista === 'cocina' || vista === 'cotizaciones' || vista === 'capturar' || vista === 'guia';
    return !!r;
  };
  App.vistaInicial = function () { return App.rol() === 'cocina' ? 'cocina' : 'panel'; };

  function vacio() { return { meta: { version: 1 }, params: {}, insumos: [], ofertas: [], recetas: [], plan: { lun: [], mar: [], mie: [], jue: [], vie: [] }, escenarios: [], escenarioActivo: null }; }

  const claveDemo = function () { return 'colaciones.demo.' + (N.user ? N.user.id : ''); };

      const html = await fetch(location.pathname + '?v=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.ok ? r.text() : ''; });
      const m = /<meta name="build" content="([^"]+)"/.exec(html);

      h('span', null, App.esVisita() ? 'Recarga para verla (tus cambios demo se conservan).' : 'Recarga para usarla.'),

  function revisarDemo() {

  // opinión validada de cocina que aplica a una oferta: la del producto exacto, si no la que coincide por marca o lugar,

  App.opinionOferta = function (o) {
    const i = o && App.insumo(o.insumoId);
    if (!i || !(i.calidad || []).length) return null;
    const lista = i.calidad.slice().reverse();
    const exacta = lista.find(function (c) { return c.ofertaId === o.id; });
    if (exacta) return { c: exacta, alcance: 'producto' };

    // del local (Lider, Acuenta), y "arroz marca Lider" no es lo mismo que "cualquier arroz comprado en Lider".
    const k = function (t) { return E.normNombre(t); };
    const contiene = function (texto, buscado) { return !!texto && !!buscado && (' ' + texto + ' ').indexOf(' ' + buscado + ' ') >= 0; };
    const prov = App.proveedorDeOferta(o);
    const lugares = [o.lugar, prov && prov.nombre].concat(prov && prov.alias || []).map(k).filter(Boolean);
    const calza = function (c) {
      const m = k(c.marca), l = k(c.lugar);
      if (!m && !l) return false;
      if (m && !contiene(k(o.marca), m)) return false;
      if (l && !lugares.some(function (t) { return contiene(t, l) || contiene(l, t); })) return false;
      return true;
    };
    const porMarca = lista.find(function (c) { return !c.ofertaId && calza(c); });
    if (porMarca) return { c: porMarca, alcance: 'marca' };

  /* ================= Evolución de precios ================= */
  function grafico(series, unidad) {
    const W = 680, H = 250, L = 70, R = 14, T = 12, B = 28, DIA = 86400000;
    const mult = unidad === 'un' ? 1 : 1000;
    const pts = [];
    series.forEach(function (s) { s.puntos.forEach(function (p) { pts.push(p); }); });
    if (!pts.length) return null;
    const ts = pts.map(function (p) { return Date.parse(p.fecha); }), vs = pts.map(function (p) { return p.unit * mult; });
    let x0 = Math.min.apply(null, ts), x1 = Math.max.apply(null, ts), y0 = Math.min.apply(null, vs), y1 = Math.max.apply(null, vs);
    if (x1 - x0 < 14 * DIA) { x0 -= 7 * DIA; x1 += 7 * DIA; }
    const pad = (y1 - y0) * 0.15 || y1 * 0.1 || 1;
    y0 = Math.max(0, y0 - pad); y1 += pad;
    const X = function (t) { return L + (t - x0) / (x1 - x0) * (W - L - R); };
    const Y = function (v) { return T + (1 - (v - y0) / (y1 - y0)) * (H - T - B); };
    let svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" class="chart" role="img" aria-label="Evolución del precio">';
    for (let i = 0; i <= 4; i++) {
      const v = y0 + (y1 - y0) * i / 4, y = Y(v).toFixed(1);
      svg += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + y + '" y2="' + y + '" class="grid"/><text x="' + (L - 6) + '" y="' + (+y + 4) + '" class="axis" text-anchor="end">' + esc(App.clp(v)) + '</text>';
    }
    [x0, (x0 + x1) / 2, x1].forEach(function (t, i) {
      svg += '<text x="' + X(t).toFixed(1) + '" y="' + (H - 8) + '" class="axis" text-anchor="' + (i === 0 ? 'start' : i === 2 ? 'end' : 'middle') + '">' + fmtFecha(new Date(t).toISOString().slice(0, 10)) + '</text>';
    });
    series.forEach(function (s, i) {
      const col = 'var(--seg' + (i % 7) + ')';
      const ps = s.puntos.map(function (p) { return [X(Date.parse(p.fecha)), Y(p.unit * mult), p]; });
      if (ps.length > 1) svg += '<polyline points="' + ps.map(function (q) { return q[0].toFixed(1) + ',' + q[1].toFixed(1); }).join(' ') + '" style="fill:none;stroke:' + col + ';stroke-width:2"/>';
      ps.forEach(function (q) {
        svg += '<circle cx="' + q[0].toFixed(1) + '" cy="' + q[1].toFixed(1) + '" r="4.5" style="stroke:' + col + ';stroke-width:2;fill:' + (q[2].tipo === 'compra' ? col : 'var(--surface)') + '"><title>' +
          esc(s.nombre + ' · ' + fmtFecha(q[2].fecha) + ' · ' + App.costoVisible(q[2].unit, unidad) + (q[2].tipo === 'compra' ? ' (compra)' : ' (cotización)')) + '</title></circle>';
      });
    });
    return h('div', { class: 'chart-wrap', html: svg + '</svg>' });
  }

  // colores por origen del ahorro: fijos por entidad (campañas en orden de la línea de tiempo, luego los demás), nunca por ranking
  function coloresOrigen(r) {
    const claves = [];
    r.eventos.forEach(function (e) { if (e.tipo === 'campana' && e.id && claves.indexOf(e.id) < 0) claves.push(e.id); });
    ['temporal', 'cantidad', 'precio', 'despacho'].forEach(function (k) { claves.push(k); });
    r.propuestas.forEach(function (x) { x.descuentos.forEach(function (d) { if (claves.indexOf(d.clave) < 0) claves.push(d.clave); }); });
    const m = {};
    let i = 0;
    claves.forEach(function (k) { if (k === 'despacho') return; m[k] = i < 4 ? 'var(--cv' + (i + 1) + ')' : 'var(--cv0)'; i++; });
    m.despacho = 'var(--cv5)';
    return m;
  }

  // línea de tiempo: una barra por campaña o promo de despacho (agrupadas por proveedor) y, abajo, el ahorro posible de cada día
  function lineaDeTiempo(r, colores) {
    // el mismo color que la campaña tiene en las barras de ahorro; el despacho, siempre el suyo
    const colorEv = function (e) { return e.tipo === 'despacho' ? colores.despacho : colores[e.id] || 'var(--cv0)'; };
    const N = r.dias, W = 720, LAB = 170, R = 10, T = 18, FILA = 20, DIA = 86400000, x0 = Date.parse(r.desde);
    const dW = (W - LAB - R) / N;
    const X = function (iso) { return LAB + Math.round((Date.parse(iso) - x0) / DIA) * dW; };
    const provs = [];
    r.eventos.forEach(function (e) { if (provs.indexOf(e.proveedor) < 0) provs.push(e.proveedor); });
    const filas = [];
    provs.forEach(function (p) {
      filas.push({ prov: p });
      r.eventos.filter(function (e) { return e.proveedor === p; }).forEach(function (e) { filas.push({ ev: e }); });
    });
    const nombre = function (clave) { const e = r.eventos.find(function (x) { return x.clave === clave; }); return e ? e.nombre : clave; };
    const AH = 64, yAh = T + filas.length * FILA + 18, H = yAh + AH + 30;
    const maxAh = Math.max.apply(null, r.porDia.map(function (d) { return d.ahorro; }).concat([1]));
    let svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" class="chart" role="img" aria-label="Campañas y promociones de las próximas ' + N + ' días, con el ahorro posible de cada día">' +
      '<defs>' + r.eventos.map(function (e, j) {
        const col = colorEv(e);
        return '<pattern id="trama-' + j + '" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" style="fill:' + col + ';opacity:.35"/><rect width="3" height="6" style="fill:' + col + '"/></pattern>';
      }).join('') + '</defs>';
    // semanas y hoy
    for (let k = 0; k <= N; k += 7) {
      const x = (LAB + k * dW).toFixed(1), f = fmtFecha(E.fechaMenos(r.desde, -k));
      svg += '<line x1="' + x + '" x2="' + x + '" y1="' + (T - 6) + '" y2="' + (yAh + AH) + '" class="grid"/>' + (k < N ? '<text x="' + (+x + 3) + '" y="' + (T - 8) + '" class="axis">' + (k === 0 ? 'hoy ' : '') + esc(f) + '</text>' : '');
    }
    filas.forEach(function (f, i) {
      const y = T + i * FILA;
      if (f.prov) { svg += '<text x="0" y="' + (y + 14) + '" class="tl-prov">' + esc(f.prov.nombre.slice(0, 26)) + '</text>'; return; }
      const e = f.ev, trama = e.noSeAcumulaCon.length > 0;
      const col = colorEv(e);
      const xa = X(e.desde), xb = X(e.hasta) + dW, w = Math.max(4, xb - xa - 2);
      const tip = (e.tipo === 'campana' ? '🎯 ' : '🚚 ') + e.nombre + ' · ' + fmtFecha(e.desde) + ' al ' + (e.sinFin ? 'sin fecha de término' : fmtFecha(e.obj.hasta)) +
        (e.seAcumulaCon.length ? '\nSe suma con: ' + e.seAcumulaCon.map(nombre).join(', ') : '') + (e.noSeAcumulaCon.length ? '\nNo se suma con: ' + e.noSeAcumulaCon.map(nombre).join(', ') : '');
      svg += '<text x="10" y="' + (y + 14) + '" class="tl-lab">' + esc((e.tipo === 'campana' ? '🎯 ' : '🚚 ') + (e.nombre.length > 24 ? e.nombre.slice(0, 23) + '…' : e.nombre)) + '<title>' + esc(e.nombre) + '</title></text>' +
        '<rect class="tl-bar" x="' + (xa + 1).toFixed(1) + '" y="' + (y + 4) + '" width="' + w.toFixed(1) + '" height="12" rx="4" style="fill:' + (trama ? 'url(#trama-' + r.eventos.indexOf(e) + ')' : col) + '"><title>' + esc(tip) + '</title></rect>';
    });
    // ahorro posible por día (una sola magnitud: un solo tono)
    svg += '<text x="0" y="' + (yAh + 12) + '" class="tl-prov">Ahorro posible</text><text x="0" y="' + (yAh + 26) + '" class="axis">si compras ese día</text>';
    const mejor = r.porDia.reduce(function (a, d) { return d.ahorro > a.ahorro ? d : a; }, { ahorro: 0 });
    r.porDia.forEach(function (d, k) {
      if (!(d.ahorro > 0)) return;
      const hh = Math.max(3, d.ahorro / maxAh * (AH - 14)), x = LAB + k * dW + 1;
      svg += '<rect class="tl-dia" x="' + x.toFixed(1) + '" y="' + (yAh + AH - hh).toFixed(1) + '" width="' + Math.max(2, dW - 2).toFixed(1) + '" height="' + hh.toFixed(1) + '" rx="3" style="fill:var(--accent);opacity:' + (d === mejor ? 1 : 0.45) + '">' +
        '<title>' + esc(fmtFecha(d.fecha) + ': hasta ' + App.clp(d.ahorro) + (d.propuesta >= 0 ? ' en ' + r.propuestas[d.propuesta].proveedor.nombre : '')) + '</title></rect>';
    });
    if (mejor.ahorro > 0) {
      const k = r.porDia.indexOf(mejor), x = LAB + (k + 0.5) * dW;
      svg += '<text x="' + Math.min(W - R, Math.max(LAB + 40, x)).toFixed(1) + '" y="' + (yAh + AH + 16) + '" class="tl-lab" text-anchor="middle">mejor: ' + esc(fmtFecha(mejor.fecha)) + ' · ' + esc(App.clp(mejor.ahorro)) + '</text>';
    }
    svg += '<line x1="' + LAB + '" x2="' + (W - R) + '" y1="' + (yAh + AH) + '" y2="' + (yAh + AH) + '" class="grid"/>';
    return h('div', { class: 'chart-wrap ancho', html: svg + '</svg>' });
  }

  /* ---------- vista ---------- */
  function quien(c, personas) {
    const p = c.usuario && personas.find(function (x) { return x.id === c.usuario; });
    if (p) return { nombre: p.nombre || p.email, rol: c.rol || p.rol };
    if (c.usuario) return { nombre: c.nombre || 'cuenta borrada', rol: c.rol };
    return { nombre: c.tabla === 'perfiles' && c.operacion === 'crear' ? 'Registro de cuenta' : 'Sistema (Supabase)', rol: null };
  }
  function diaTxt(d) {
    const hoy = new Date(); hoy.setHours(0, 0, 0, 0);
    const x = new Date(d); x.setHours(0, 0, 0, 0);
    const dif = Math.round((hoy - x) / 86400000);
    if (dif === 0) return 'Hoy';
    if (dif === 1) return 'Ayer';
    const t = x.toLocaleDateString('es-CL', { weekday: 'long', day: 'numeric', month: 'long', year: x.getFullYear() === hoy.getFullYear() ? undefined : 'numeric' });
    return t.charAt(0).toUpperCase() + t.slice(1);

  const hora = function (d) { return new Date(d).toLocaleTimeString('es-CL', { hour: '2-digit', minute: '2-digit', hour12: false }); };

  function item(c, personas, nom) {
    const q = quien(c, personas);
    const que = c.etiqueta || nom[c.tabla + '|' + c.fila_id] || FILAS_FIJAS[c.tabla + '|' + c.fila_id] || c.fila_id;

        'solo' in l ? valor(l.campo, l.solo) : [valor(l.campo, l.antes), h('span', { class: 'hist-flecha' }, ' → '), h('b', null, valor(l.campo, l.despues))]);
    };

    return h('div', { class: 'hist-item hist-' + c.operacion },

        lineas.length ? h('ul', { class: 'hist-lineas' }, lineas.slice(0, MAX).map(fila)) : null,

  function csv(H, personas, nom) {

    const filas = [['Fecha', 'Hora', 'Persona', 'Rol', 'Acción', 'Qué', 'Campo', 'Antes', 'Después']];

      const d = new Date(c.hasta), base = [d.toLocaleDateString('es-CL'), hora(c.hasta), q.nombre, ROL_TXT[q.rol] || '', VERBO[c.operacion] + ' ' + COSA[c.tabla], que];

  }

  App.views.historial = function () {
    const H = estado();
    if (!H.cargado && !H.cargando && !H.error) cargar(H);
    const personas = H.personas || [];
    const nom = nombres();

    const filtros = h('div', { class: 'filters' },
      h('input', { type: 'text', class: 'search', 'data-fk': 'hist-texto', placeholder: 'Buscar por lo cambiado o la persona…', value: H.filtros.texto,
        oninput: function (ev) { const v = ev.target.value; clearTimeout(espera); espera = setTimeout(function () { H.filtros.texto = v; cargar(H); }, 400); } }),
      App.select({ fk: 'hist-usuario', value: H.filtros.usuario, onChange: filtro('usuario'),
        options: [['', 'Todas las personas']].concat(personas.map(function (p) { return [p.id, (p.nombre || p.email) + (p.rol ? ' (' + (ROL_TXT[p.rol] || p.rol) + ')' : '')]; }), [['sistema', 'Sistema (Supabase)']]) }),
      App.select({ fk: 'hist-seccion', value: H.filtros.seccion, onChange: filtro('seccion'), options: SECCIONES }),
      App.select({ fk: 'hist-dias', value: H.filtros.dias, onChange: filtro('dias'), options: PERIODOS }));

    let cuerpo;
    if (H.error) cuerpo = h('div', { class: 'chk-error' }, H.error);
    else if (!H.lista.length) cuerpo = App.empty(H.cargando || !H.cargado ? 'Cargando historial…' : 'No hay cambios con estos filtros.');

        h('p', { class: 'help' }, 'Cada cambio que alguien guarda en la app queda anotado aquí: qué cambió, el valor anterior y el nuevo, cuándo y quién. Lo anota la base de datos, así que nadie puede saltárselo ni borrarlo. Las ediciones seguidas de una persona sobre lo mismo se juntan en una línea. Los cambios demo de una visita no llegan aquí porque nunca se guardan.'),
        filtros, cuerpo), '',

  };
})();
