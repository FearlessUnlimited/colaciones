<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Colaciones — Costeo</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍲</text></svg>">
<style>
:root {
  --bg: #f6f5f1; --surface: #ffffff; --surface2: #f0eee8; --ink: #1f2421; --mut: #6b726d; --line: #e2dfd6;
  --accent: #0f766e; --accent-ink: #ffffff; --accent-soft: #d7efec;
  --good: #1f7a3f; --good-soft: #dcf0e2; --warn: #b45309; --warn-soft: #fdecc8; --bad: #b42318; --bad-soft: #fde1de; --info: #1d5fa8; --info-soft: #dce9f7;
  --oferta-soft: #eef6c9; --sim: #7c3aed; --sim-soft: #ece4fd; --shadow: 0 1px 2px rgba(0,0,0,.06), 0 4px 14px rgba(0,0,0,.05);
  --seg0: #0f766e; --seg1: #2563a8; --seg2: #b45309; --seg3: #7c3aed; --seg4: #be185d; --seg5: #4d7c0f; --seg6: #0e7490; --seg7: #9ca3af;
  /* planificar compras: categórica validada (validate_palette) en claro y oscuro; pagas = neutro */
  --cv1: #2563a8; --cv2: #b45309; --cv3: #7c3aed; --cv4: #be185d; --cv5: #4d7c0f; --cv0: #a8aea9;
  color-scheme: light;
  --radius: 10px; --font: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;   /* calendario, reloj e íconos de fecha/hora en oscuro */
    --bg: #14181a; --surface: #1d2326; --surface2: #262d30; --ink: #e8ece9; --mut: #96a09a; --line: #333c40;
    --accent: #2dd4bf; --accent-ink: #062a26; --accent-soft: #123a36;
    --good: #5fd08a; --good-soft: #17341f; --warn: #f0b05a; --warn-soft: #3b2c10; --bad: #ff8a7d; --bad-soft: #3d1b18; --info: #7db7f0; --info-soft: #17283a;
    --oferta-soft: #2c3412; --sim: #b69cff; --sim-soft: #2a2145; --shadow: 0 1px 2px rgba(0,0,0,.4);
    --seg0: #2dd4bf; --seg1: #6aa8f0; --seg2: #f0b05a; --seg3: #b69cff; --seg4: #f472b6; --seg5: #a3d65c; --seg6: #5ad1e6; --seg7: #7b848a;
    --cv1: #4f8fdb; --cv2: #c07c22; --cv3: #9b7bef; --cv4: #e0559a; --cv5: #6b9a2a; --cv0: #5d666a;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; font: 14px/1.45 var(--font); color: var(--ink); background: var(--bg); }
h1, h2, h3, h4 { margin: 0; line-height: 1.25; }
h3 { font-size: 15px; } h4 { font-size: 13px; margin: 14px 0 6px; color: var(--mut); text-transform: uppercase; letter-spacing: .04em; }
a { color: var(--accent); }
p { margin: 0 0 8px; }
small { font-size: 12px; color: var(--mut); }
button, input, select, textarea { font: inherit; color: inherit; }
input[type=text], input[type=email], input[type=password], input[type=date], input[type=time], input[type=number], input:not([type]), select, textarea {
  background: var(--surface); border: 1px solid var(--line); border-radius: 7px; padding: 6px 8px; min-width: 0; max-width: 100%;
}
input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible, a:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
textarea { width: 100%; resize: vertical; }
input.num { text-align: right; }
input.sim { border-color: var(--sim); background: var(--sim-soft); }
input[type=range] { width: 100%; accent-color: var(--accent); }
.w60 { width: 60px; } .w70 { width: 74px; } .w80 { width: 88px; } .w90 { width: 96px; } .w200 { width: 160px; }
input.wide { width: 100%; } input.ing { width: 100%; min-width: 180px; } input.alt { width: 120px; }

/* header */
.top { position: sticky; top: 0; z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 8px 16px; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 190px; }
.brand b { display: block; font-size: 15px; } .brand small { display: block; line-height: 1.1; }
.logo { font-size: 24px; }
.tabs { display: flex; gap: 2px; overflow-x: auto; flex: 1 1 auto; scrollbar-width: thin; }
.tab { padding: 7px 12px; border-radius: 8px; color: var(--ink); text-decoration: none; white-space: nowrap; font-weight: 500; }
.tab:hover { background: var(--surface2); }
.tab.on { background: var(--accent); color: var(--accent-ink); }
.tab .count { display: inline-block; margin-left: 6px; min-width: 18px; padding: 0 5px; border-radius: 9px; background: var(--warn); color: #fff; font-size: 11px; text-align: center; }
.tools { display: flex; align-items: center; gap: 8px; }
.saved { white-space: nowrap; } .saved.bad { color: var(--bad); }
.demo-banner { flex-basis: 100%; background: var(--info-soft); color: var(--ink); border: 1px solid var(--info); border-radius: 8px; padding: 6px 10px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.mini label.chk { font-size: 12px; color: var(--mut); } input.w-fecha { width: 140px; } input.w-hora { width: 110px; }
.sub-row h4 { margin: 10px 0 2px; }
.guia-paso { display: flex; align-items: center; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line); } .guia-ico { font-size: 24px; width: 34px; text-align: center; } .guia-paso > div:nth-child(2) { flex: 1; }
.oport { display: flex; flex-direction: column; gap: 8px; } .oport .sug { background: var(--surface2); border-radius: 8px; padding: 8px 10px; font-size: 13px; }
.ac-lista { position: fixed; z-index: 310; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 6px 22px rgba(0,0,0,.28); max-height: 260px; overflow: auto; font-size: 13.5px; padding: 3px; }
.ac-item { padding: 6px 10px; border-radius: 6px; cursor: pointer; } .ac-item.on, .ac-item:hover { background: var(--accent-soft); } .ac-item b { color: var(--accent); }
.ac-ghost { position: fixed; z-index: 5; display: flex; align-items: center; white-space: pre; overflow: hidden; pointer-events: none; color: var(--mut); opacity: .75; box-sizing: border-box; }
.ac-aviso { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12.5px; } .ac-aviso:empty { display: none; }
.ayuda-tip { position: fixed; z-index: 300; max-width: 280px; background: var(--ink); color: var(--bg); font-size: 12.5px; line-height: 1.4; padding: 7px 10px; border-radius: 8px; box-shadow: 0 4px 18px rgba(0,0,0,.3); pointer-events: none; }
th[data-ayuda]:not(.sortable) { cursor: help; }
.pie { text-align: center; padding: 14px 16px 22px; font-size: 12.5px; color: var(--mut); }
.pie label.chk { justify-content: center; color: var(--mut); }
.esc-banner { flex-basis: 100%; background: var(--sim-soft); color: var(--ink); border: 1px solid var(--sim); border-radius: 8px; padding: 6px 10px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.main { max-width: 1500px; margin: 0 auto; padding: 16px; }

/* controles */
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 7px 12px; cursor: pointer; font-weight: 500; }
.btn:hover:not(:disabled) { background: var(--surface2); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover:not(:disabled) { filter: brightness(1.08); background: var(--accent); }
.btn.danger { color: var(--bad); border-color: var(--bad); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.small { padding: 3px 8px; font-size: 12px; border-radius: 7px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 11px; cursor: pointer; font-size: 13px; }
.chip.on { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); font-weight: 600; }
.chip.small { padding: 1px 8px; font-size: 12px; }
.chips.big .chip { padding: 7px 16px; font-size: 14px; }
.badge { display: inline-block; font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 999px; background: var(--surface2); color: var(--mut); }
.badge.bad { background: var(--bad-soft); color: var(--bad); } .badge.warn { background: var(--warn-soft); color: var(--warn); }
.badge.good { background: var(--good-soft); color: var(--good); } .badge.info { background: var(--info-soft); color: var(--info); }
.badge.tenue { background: transparent; border: 1px dashed currentColor; }
.bar { display: inline-block; width: 70px; height: 7px; background: var(--surface2); border-radius: 4px; overflow: hidden; vertical-align: middle; }
.bar .fill { display: block; height: 100%; background: var(--accent); } .bar .fill.good { background: var(--good); } .bar .fill.warn { background: var(--warn); } .bar .fill.bad { background: var(--bad); }
.cellbar { display: flex; align-items: center; justify-content: flex-end; gap: 6px; }
.empty { color: var(--mut); padding: 18px; text-align: center; }
.mut { color: var(--mut); } .strong { font-weight: 700; } .small { font-size: 12px; }
.good-t { color: var(--good); } .bad-t { color: var(--bad); } .warn-t { color: var(--warn); } .sim-t { color: var(--sim); }
.nowrap { white-space: nowrap; } .r { text-align: right; } .c { text-align: center; } .spacer { flex: 1; }
.row { display: flex; align-items: center; } .gap { gap: 10px; } .wrap { flex-wrap: wrap; } .mt { margin-top: 10px; }
.stack { display: flex; flex-direction: column; gap: 14px; }
.help { color: var(--mut); font-size: 12.5px; } ul.help, ol.help { padding-left: 18px; margin: 6px 0; }
label { display: flex; flex-direction: column; gap: 3px; font-size: 12.5px; color: var(--mut); }
label.chk { flex-direction: row; align-items: center; gap: 6px; color: var(--ink); } label.block { width: 100%; }

/* tarjetas */
.card { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; box-shadow: var(--shadow); min-width: 0; }
.card-h { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; box-shadow: var(--shadow); border-left: 4px solid var(--line); }
.kpi.good { border-left-color: var(--good); } .kpi.warn { border-left-color: var(--warn); } .kpi.bad { border-left-color: var(--bad); }
.kpi-l { font-size: 12px; color: var(--mut); } .kpi-v { font-size: 24px; font-weight: 700; line-height: 1.2; margin: 2px 0; } .kpi-s { font-size: 12px; color: var(--mut); }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); gap: 14px; }
.form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 10px 14px; }
.cost-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; }
.cost-grid > div { display: flex; flex-direction: column; } .cost-grid b { font-size: 16px; } .cost-grid .tot b { font-size: 19px; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; } .tag { background: var(--surface2); border-radius: 6px; padding: 2px 8px; font-size: 12px; text-decoration: none; color: var(--ink); } .tag:hover { background: var(--accent-soft); }
.checks { display: flex; flex-direction: column; gap: 4px; } .checks > div { padding: 6px 10px; border-radius: 8px; font-size: 13px; }
.chk-error { background: var(--bad-soft); } .chk-warn { background: var(--warn-soft); } .chk-info { background: var(--info-soft); }
.alerts { display: flex; flex-direction: column; gap: 6px; }
.alert { display: flex; gap: 8px; padding: 7px 10px; border-radius: 8px; background: var(--surface2); }
.alert.bad { background: var(--bad-soft); } .alert.warn { background: var(--warn-soft); } .alert.info { background: var(--info-soft); } .alert.good { background: var(--good-soft); }
.alert.link { cursor: pointer; } .alert.link:hover { filter: brightness(.97); }

/* layout dividido */
.split { display: grid; grid-template-columns: minmax(300px, 400px) 1fr; gap: 14px; align-items: start; }
.split.wide { grid-template-columns: 1fr; } .split.wide:has(.drawer) { grid-template-columns: minmax(0, 1fr) 380px; }
.pane-list { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px; display: flex; flex-direction: column; gap: 8px; position: sticky; top: 74px; max-height: calc(100vh - 90px); }
.pane-detail, .pane-wide { min-width: 0; display: flex; flex-direction: column; gap: 14px; }
.scroll { overflow: auto; flex: 1; min-height: 120px; } .scroll-x { overflow-x: auto; }
.filters { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; } .filters select { min-width: 0; flex: 1 1 140px; } .filters .search { flex: 1; min-width: 140px; }
.drawer { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 8px; position: sticky; top: 74px; max-height: calc(100vh - 90px); overflow: auto; }
.x { border: 0; background: transparent; font-size: 22px; line-height: 1; cursor: pointer; color: var(--mut); }
.alt-row { display: grid; grid-template-columns: 1fr auto auto; gap: 8px; align-items: center; padding: 5px 0; border-bottom: 1px solid var(--line); font-size: 13px; }

/* historial de cambios */
.hist { display: flex; flex-direction: column; }
.hist-dia { margin: 14px 0 4px; text-transform: none; letter-spacing: 0; } .hist-dia:first-child { margin-top: 0; }
.hist-item { display: grid; grid-template-columns: 82px minmax(0, 1fr); gap: 10px; padding: 8px 0 8px 10px; border-bottom: 1px solid var(--line); border-left: 3px solid var(--line); font-size: 13px; }
.hist-item.hist-crear { border-left-color: var(--good); } .hist-item.hist-borrar { border-left-color: var(--bad); } .hist-item.hist-editar { border-left-color: var(--info); }
.hist-hora { color: var(--mut); font-variant-numeric: tabular-nums; }
.hist-lineas { margin: 4px 0 0; padding-left: 16px; overflow-wrap: anywhere; } .hist-lineas li { margin: 1px 0; }
.hist-flecha { color: var(--mut); }
@media (max-width: 600px) { .hist-item { grid-template-columns: 1fr; gap: 2px; } }

/* tablas */
.tbl { width: 100%; border-collapse: collapse; }
.tbl th { text-align: left; font-size: 12px; color: var(--mut); font-weight: 600; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; position: sticky; top: 0; background: var(--surface); z-index: 1; }
.tbl th.r { text-align: right; } .tbl th.c { text-align: center; }
.tbl td { padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.tbl.compact td { padding: 4px 6px; } .tbl.compact th { padding: 4px 6px; }
.tbl tfoot td { font-weight: 600; border-top: 2px solid var(--line); }
.tbl.sel tbody tr { cursor: pointer; } .tbl.sel tbody tr:hover, .tbl tr.link:hover { background: var(--surface2); }
.tbl tr.link { cursor: pointer; } .tbl td.link { cursor: pointer; }
.tbl tr.on { background: var(--accent-soft); } .tbl tr.off { opacity: .55; } .tbl tr.en-oferta td { background: var(--oferta-soft); } .tbl tr.warnrow td { background: var(--warn-soft); } .tbl tr.usada td:first-child { border-left: 3px solid var(--accent); }
.tbl th.sortable { cursor: pointer; user-select: none; } .tbl th.on { color: var(--ink); }
.nm { font-weight: 600; }
.tbl.platos td input.num { padding: 3px 6px; }

/* composición */
.comp { display: flex; flex-direction: column; gap: 6px; }
.stackbar { display: flex; height: 14px; border-radius: 7px; overflow: hidden; background: var(--surface2); }
.seg { display: block; height: 100%; min-width: 2px; }
.seg0, .dot.seg0 { background: var(--seg0); } .seg1, .dot.seg1 { background: var(--seg1); } .seg2, .dot.seg2 { background: var(--seg2); } .seg3, .dot.seg3 { background: var(--seg3); }
.seg4, .dot.seg4 { background: var(--seg4); } .seg5, .dot.seg5 { background: var(--seg5); } .seg6, .dot.seg6 { background: var(--seg6); } .seg7, .dot.seg7 { background: var(--seg7); }
.wf-ing, .dot.wf-ing { background: var(--seg1); } .wf-env, .dot.wf-env { background: var(--seg2); } .wf-oh, .dot.wf-oh { background: var(--seg3); } .wf-com, .dot.wf-com { background: var(--seg4); }
.wf-iva, .dot.wf-iva { background: var(--seg7); } .wf-mg, .dot.wf-mg { background: var(--good); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--mut); }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 4px; }

/* plan y compras */
.plan-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 10px; }
.dia { background: var(--surface2); border-radius: 10px; padding: 8px; display: flex; flex-direction: column; gap: 6px; }
.dia-h { display: flex; justify-content: space-between; align-items: baseline; }
.plan-it { display: flex; align-items: center; gap: 6px; background: var(--surface); border-radius: 7px; padding: 3px 6px; } .plan-it .nm { flex: 1; font-weight: 500; font-size: 13px; }
.total-bar { text-align: right; font-size: 17px; padding: 6px 4px; }
.opc-dia { display: flex; flex-direction: column; gap: 5px; border-top: 1px dashed var(--line); padding-top: 6px; margin-top: 2px; }
.opc-t { display: flex; flex-direction: column; gap: 3px; } .opc-t .grow { flex: 1; min-width: 0; width: 100%; }
.plan-it.alt { background: transparent; padding-left: 10px; } .sug-alt { display: flex; flex-direction: column; gap: 3px; }

/* parámetros */
.params { display: flex; flex-direction: column; } .param { display: flex; justify-content: space-between; align-items: center; gap: 14px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.param:last-child { border-bottom: 0; }

/* cocina */
.lista { list-style: none; margin: 0; padding: 0; } .lista li { padding: 6px 8px; border-radius: 6px; cursor: pointer; } .lista li:hover { background: var(--surface2); } .lista li.on { background: var(--accent-soft); font-weight: 600; }
.grp { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--mut); margin: 10px 8px 2px; }
.ficha { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 22px 26px; font-size: 16px; }
.ficha-h { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; } .ficha h2 { font-size: 26px; }
.ficha .desc { color: var(--mut); } .ficha-t td, .ficha-t th { font-size: 16px; } .ficha .pasos { white-space: pre-wrap; line-height: 1.6; }
tr.subhead td { font-weight: 700; background: var(--surface2); } tr.hijo td { color: var(--mut); padding-left: 22px; }

/* acceso (modo nube) */
.acceso { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; }
.acceso-box { width: 100%; max-width: 380px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 24px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 14px; }
.acceso-box h2 { font-size: 20px; } .acceso-box .btn.primary { padding: 10px; }
.acc-msg { font-size: 13px; min-height: 18px; } .acc-msg.bad { color: var(--bad); } .acc-msg.good { color: var(--good); }
.user { display: flex; align-items: center; gap: 6px; font-size: 13px; white-space: nowrap; }

/* overlays */
.overlay { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: flex; align-items: center; justify-content: center; z-index: 100; padding: 16px; }
.modal { background: var(--surface); border-radius: 12px; max-width: 520px; width: 100%; max-height: 90vh; overflow: auto; box-shadow: 0 10px 40px rgba(0,0,0,.35); }
.modal-h { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px 0; } .modal-b { padding: 12px 16px; } .modal-f { padding: 0 16px 14px; display: flex; justify-content: flex-end; gap: 8px; }
.toast.bad { background: #b42318; color: #fff; max-width: min(92vw, 520px); }
.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: 9px; z-index: 200; box-shadow: var(--shadow); transition: opacity .4s; } .toast.out { opacity: 0; }
details summary { cursor: pointer; color: var(--accent); margin: 6px 0; }

/* proveedores */
.grid3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; align-items: start; }
.card.mejor { border-color: var(--good); box-shadow: 0 0 0 1px var(--good) inset, var(--shadow); }
b.big { font-size: 22px; }
.tbl.prov td { vertical-align: top; } .desp { display: flex; flex-direction: column; gap: 3px; margin-top: 4px; font-size: 12px; color: var(--mut); }
.desp span { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
select.w-prov { width: 160px; }
.tbl tr.sub-row > td { background: var(--surface2); padding: 10px 12px; }
/* la ficha toma el ancho de la tabla sin estirarla: sus tablas anchas se desplazan dentro (scroll-x) */
.tbl tr.sub-row > td > * { width: 0; min-width: 100%; } .montos { align-items: flex-end; }
.tbl.sub { background: var(--surface2); border-radius: 8px; }
.chart-wrap { width: 100%; overflow: hidden; } .chart { width: 100%; height: auto; display: block; }

  function horaActual(ctx) {
    if (ctx.p.hora) return ctx.p.hora;
    const d = new Date();
    return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  }
  // días hasta que llega con esa condición (null = no se sabe)
  function plazoEntrega(ctx, c) {
    if (c.plazoDias == null || isNaN(c.plazoDias)) return null;
    return c.plazoDias + (c.horaCorte && horaActual(ctx) > c.horaCorte ? 1 : 0);
  }
  function factorIva(ctx) { return 1 + (Number(ctx.p.ivaPct) || 0) / 100; }
  function ivaAplica(ctx) { return ctx.p.ivaRecuperable === 'si' || !!ctx.opts.simularIva; }
  function divisorIva(ctx, prov) { return ivaAplica(ctx) && daFactura(prov) ? factorIva(ctx) : 1; }

  /* ---------- insumos y ofertas ---------- */
  // promoción por cantidad ("lleva 2 o más a $X c/u"): vale entre desde y hasta; después vuelve el precio de lista
  function promoCantidadVigente(ctx, o) {
    const pc = o.promoCantidad;
    if (ctx.opts.sinPromos || !pc || !(Number(pc.minimo) > 1) || !(Number(pc.precio) > 0)) return null;
    const hoy = hoyISO(ctx.p);
    if ((pc.desde && pc.desde > hoy) || (pc.hasta && pc.hasta < hoy)) return null;
    return pc;
  }
  // precio de un formato comprando `packs` unidades (promo por cantidad si se alcanza el mínimo y descuentos de campaña)
  function precioPorPack(ctx, o, packs) { return infoPrecio(ctx, o, packs, false).precio; }
  // formatos que compras de esta oferta en una semana (para saber si alcanzas la promo por cantidad)
  function packsSemanales(ctx, o) {
    if (!(o.formatoQty > 0)) return 0;
    const ins = ctx.insumos.get(o.insumoId);
    const rend = o.rendimiento != null ? o.rendimiento : (ins && ins.rendimiento != null ? ins.rendimiento : 1);
    const uso = usoSemanalInsumos(ctx).uso.get(o.insumoId) || 0;
    return uso > 0 ? Math.ceil(uso / (rend || 1) / o.formatoQty - 1e-9) : 0;
  }
  // precio que usan los costos: el de promo por cantidad solo si tu compra semanal alcanza el mínimo;
  // los descuentos de campaña solo si la campaña se usa en los costos
  function infoCostos(ctx, o) { return infoPrecio(ctx, o, promoCantidadVigente(ctx, o) ? packsSemanales(ctx, o) : 0, true); }
  function precioOferta(ctx, o) { return infoCostos(ctx, o).precio; }

  // costo por unidad base utilizable de una oferta, tal como se paga (IVA incluido si lo trae)
  function costoBrutoOferta(ctx, o) {
    const ins = ctx.insumos.get(o.insumoId);
    const rend = o.rendimiento != null ? o.rendimiento : (ins && ins.rendimiento != null ? ins.rendimiento : 1);
    const denom = (o.formatoQty || 0) * (rend || 1);
    return denom > 0 ? precioOferta(ctx, o) / denom : 0;
  }

  // costo neto (después de merma y, si el negocio recupera IVA y el proveedor da factura, sin IVA) por unidad base.
  // Una campaña que excluye las compras con factura no da crédito fiscal: se costea con IVA.
  function costoNetoOferta(ctx, o) {
    return costoBrutoOferta(ctx, o) / (infoCostos(ctx, o).sinFactura ? 1 : divisorIva(ctx, proveedorDe(ctx, o)));
  }
  // precio de lista por unidad base utilizable (sin promociones; para comparar campañas)
  function unitLista(ctx, o) {
    const ins = ctx.insumos.get(o.insumoId);
    const rend = o.rendimiento != null ? o.rendimiento : (ins && ins.rendimiento != null ? ins.rendimiento : 1);
    const denom = (o.formatoQty || 0) * (rend || 1);
    return denom > 0 && o.precio > 0 ? o.precio / denom : null;
  }

  // ofertas utilizables: disponibles y ya revisadas (una cotización "pendiente" no entra a los costos hasta aprobarla)
  // ofertas temporales: valen hasta temporal.hasta (inclusive) o, si son de una campaña, hasta el fin de la campaña;
  // vencidas no entran a los costos (quedan en el historial). Una campaña borrada deja vencidas sus ofertas.
  function ofertaVencida(ctx, o) {
    if (o.campanaId) { const e = campanaDe(ctx, o); return !e || !!(e.c.hasta && e.c.hasta < hoyISO(ctx.p)); }
    return !!(o.temporal && o.temporal.hasta && o.temporal.hasta < hoyISO(ctx.p));
  }
  // no vale hoy: vencida, de una campaña que aún no empieza o desactivada, o excluida en una simulación
  function fueraDeVigencia(ctx, o) {
    if (ofertaVencida(ctx, o)) return true;
    const e = campanaDe(ctx, o);
    return !!e && ['programada', 'inactiva', 'excluida'].indexOf(estadoCampana(ctx, e.p, e.c)) >= 0;
  }
  function diasParaVencer(ctx, o) { const h = hastaOferta(ctx, o); return h ? diasEntre(hoyISO(ctx.p), h) : null; }
  // oferta temporal que el administrador decidió usar mientras dure; las de campaña siguen a su campaña
  // (usarEnCostos), salvo que en la oferta se haya decidido otra cosa (usarMientrasDure true/false)
  function oportunidadActiva(ctx, o) {
    if (!esTemporal(o) || o.pendiente || o.disponible === false || fueraDeVigencia(ctx, o) || !ofertaHabilitada(ctx, o)) return false;
    const e = campanaDe(ctx, o);
    if (e) return o.usarMientrasDure != null ? !!o.usarMientrasDure : e.c.usarEnCostos !== false;
    return !!o.usarMientrasDure;
  }

  function ofertasDisponibles(ctx, insumoId) {
    return (ctx.ofertasPorInsumo.get(insumoId) || []).filter(function (o) {
      return o.disponible !== false && !o.pendiente && !fueraDeVigencia(ctx, o) && !((ctx.opts.sinOportunidades || ctx.opts.sinPromos) && esTemporal(o)) && ofertaHabilitada(ctx, o);
    });
  }

  // oferta/costo vigente de un insumo según modo (preferida | barata | promedio) o fijación de escenario
  function costoInsumo(ctx, insumoId) {
    if (ctx.memoInsumo.has(insumoId)) return ctx.memoInsumo.get(insumoId);
    let res = { unit: 0, oferta: null, missing: true, modo: ctx.p.modoOferta };
    const pin = ctx.opts.ofertaElegida && ctx.opts.ofertaElegida[insumoId];
    let lista = ofertasDisponibles(ctx, insumoId);
    if (!lista.length) lista = (ctx.ofertasPorInsumo.get(insumoId) || []).filter(function (o) { return !o.pendiente && !esTemporal(o) && ofertaHabilitada(ctx, o); });
    // escenario (simulación) > oferta temporal o de campaña en uso mientras dure > modo normal
    const oport = ctx.opts.sinOportunidades || ctx.opts.sinPromos ? [] : (ctx.ofertasPorInsumo.get(insumoId) || []).filter(function (o) { return oportunidadActiva(ctx, o); })
      .map(function (o) { return { o: o, c: costoNetoOferta(ctx, o) }; }).filter(function (x) { return x.c > 0; });
    if (pin && ctx.ofertas.get(pin)) {
      const o = ctx.ofertas.get(pin);
      res = { unit: costoNetoOferta(ctx, o), oferta: o, missing: false, modo: 'fijada' };
    } else if (oport.length) {
      const b = oport.reduce(function (a, x) { return x.c < a.c ? x : a; });
      res = { unit: b.c, oferta: b.o, missing: false, modo: 'oportunidad' };
    } else if (lista.length) {
      const costos = lista.map(function (o) { return { o: o, c: costoNetoOferta(ctx, o) }; });
      const barata = costos.reduce(function (a, b) { return b.c < a.c ? b : a; });
      if (ctx.p.modoOferta === 'barata') {
        res = { unit: barata.c, oferta: barata.o, missing: false, modo: 'barata' };
      } else if (ctx.p.modoOferta === 'promedio') {
        const avg = costos.reduce(function (s, x) { return s + x.c; }, 0) / costos.length;
        res = { unit: avg, oferta: null, missing: false, modo: 'promedio' };
      } else {
        const pref = costos.find(function (x) { return x.o.preferida; }) || barata;
        res = { unit: pref.c, oferta: pref.o, missing: false, modo: 'preferida' };
      }
      if (res.unit <= 0) res.missing = true; // precio 0 = sin precio
    }
    ctx.memoInsumo.set(insumoId, res);
    return res;
  }

  /* ---------- recetas ---------- */
  function costoReceta(ctx, id, stack) {
    stack = stack || [];
    if (ctx.memoReceta.has(id)) return ctx.memoReceta.get(id);
    const r = ctx.recetas.get(id);
    const vacio = { id: id, lote: 0, porPorcion: 0, min: 0, max: 0, lineas: [], faltantes: [], ciclo: false };
    if (!r) return vacio;
    if (stack.indexOf(id) >= 0) {
      ctx.errors.push('Ciclo de sub-recetas: ' + stack.concat(id).join(' → '));
      return Object.assign({}, vacio, { ciclo: true });
    }
    const porciones = r.porciones > 0 ? r.porciones : 1;
    const sust = (ctx.opts.sust && ctx.opts.sust[id]) || {};
    const out = { id: id, lote: 0, porPorcion: 0, min: 0, max: 0, lineas: [], faltantes: [], ciclo: false };
    const st = stack.concat(id);

    (r.lineas || []).forEach(function (ln, idx) {
      const ref = sust[idx] || ln.ref;
      const fila = costoLinea(ctx, ln.tipo, ref, ln.cantidad, st);
      // alternativas declaradas en la línea → rango min/max
      let mn = fila.subtotal, mx = fila.subtotal;
      if (ln.alternativas && ln.alternativas.length) {
        ln.alternativas.forEach(function (alt) {
          const f2 = costoLinea(ctx, ln.tipo, alt, ln.cantidad, st);
          if (f2.subtotal < mn) mn = f2.subtotal;
          if (f2.subtotal > mx) mx = f2.subtotal;
        });
      }
      fila.idx = idx; fila.nota = ln.nota || ''; fila.refOriginal = ln.ref; fila.sustituido = !!sust[idx];
      fila.min = mn; fila.max = mx; fila.borrador = !!ln.borrador;
      out.lote += fila.subtotal; out.min += mn; out.max += mx;
      if (fila.ciclo) out.ciclo = true;
      if (fila.missing) out.faltantes.push(fila.nombre);
      out.lineas.push(fila);
    });

    if (!(r.lineas && r.lineas.length) && r.costoManual != null) {
      out.lote = r.costoManual * porciones; out.min = out.lote; out.max = out.lote; out.manual = true;
    }
    out.porPorcion = out.lote / porciones;
    out.minPorPorcion = out.min / porciones;
    out.maxPorPorcion = out.max / porciones;
    out.lineas.forEach(function (f) { f.porPorcion = f.subtotal / porciones; });
    ctx.memoReceta.set(id, out);
    return out;
  }

  function costoLinea(ctx, tipo, ref, cantidad, stack) {
    cantidad = Number(cantidad) || 0;
    if (tipo === 'receta') {
      const sub = costoReceta(ctx, ref, stack);
      const rr = ctx.recetas.get(ref);
      return { tipo: 'receta', ref: ref, nombre: rr ? rr.nombre : ('(receta ' + ref + ')'), cantidad: cantidad,
        unidad: 'porc', unitCost: sub.porPorcion, subtotal: cantidad * sub.porPorcion, oferta: null,
        missing: !rr || sub.faltantes.length > 0, ciclo: !!sub.ciclo };
    }
    const ins = ctx.insumos.get(ref);
    const c = costoInsumo(ctx, ref);
    return { tipo: 'insumo', ref: ref, nombre: ins ? ins.nombre : ('(insumo ' + ref + ')'), cantidad: cantidad,
      unidad: ins ? ins.unidad : '', unitCost: c.unit, subtotal: cantidad * c.unit, oferta: c.oferta, missing: c.missing || !ins };
  }

  /* ---------- plato (receta vendible) ---------- */
  function costoPlato(ctx, id, guarnicionId) {
    const r = ctx.recetas.get(id);
    const p = ctx.p;
    const rc = costoReceta(ctx, id);
    const gid = guarnicionId !== undefined ? guarnicionId : (r ? r.guarnicionDefault : null);
    const g = gid ? costoReceta(ctx, gid) : null;
    const guarn = g ? g.porPorcion : 0;

    let envase = 0, envaseFalta = false;
    if (r && r.envaseId) {
      const e = costoInsumo(ctx, r.envaseId);
      envase = e.unit * (r.envaseCant || 1);
      envaseFalta = e.missing;
    } else if (r && r.envaseManual != null) {
      envase = r.envaseManual;
    } else if (!(r && r.envasado)) { envaseFalta = true; }

    // envasado (bebida, jugo en caja): se vende tal cual, sin imprevistos ni gas/mano de obra
    const envasado = !!(r && r.envasado);
    const base = rc.porPorcion + guarn;
    const imprev = envasado ? 0 : base * p.imprevistosPct / 100;
    const insumosTot = base + imprev;
    const sinGas = r && /^(entrada|ensalada|postre)$/.test(r.tipo) && !p.gasOpcionales;
    const overhead = envasado ? 0 : (sinGas ? 0 : p.gasPorPorcion || 0) + (p.manoObraPorPorcion || 0);
    const pvp = r ? precioPlato(ctx, r) : 0;
    const pvpNeto = p.ivaOn ? pvp / (1 + p.ivaPct / 100) : pvp;
    const comision = pvp * p.comisionPct / 100;
    const costoDirecto = insumosTot + envase;
    const costoTotal = costoDirecto + overhead + comision;
    const margen = pvpNeto - costoTotal;
    const margenPct = pvpNeto > 0 ? margen / pvpNeto * 100 : null;
    const foodCostPct = pvpNeto > 0 ? insumosTot / pvpNeto * 100 : null;

    // PVP sugerido por food cost objetivo (redondeado hacia arriba)
    const netoSug = insumosTot / (p.foodCostObjetivo / 100);
    let sug = p.ivaOn ? netoSug * (1 + p.ivaPct / 100) : netoSug;
    if (r && TIPOS_SUELTOS.indexOf(r.tipo) >= 0) sug *= 1 + (Number(p.recargoSueltoPct) || 0) / 100;   // recargo invisible del suelto
    const rnd = p.redondeo > 0 ? p.redondeo : 1;
    const pvpSugerido = insumosTot > 0 ? Math.ceil(sug / rnd) * rnd : 0;
    // PVP mínimo (margen $0)
    const k = (p.ivaOn ? 1 / (1 + p.ivaPct / 100) : 1) - p.comisionPct / 100;
    const pvpMinimo = k > 0 ? (costoDirecto + overhead) / k : 0;

    return {
      id: id, nombre: r ? r.nombre : '', insumos: rc.porPorcion, guarnicion: guarn, guarnicionId: gid || null,
      envase: envase, imprevistos: imprev, overhead: overhead, comision: comision,
      costoDirecto: costoDirecto, costoTotal: costoTotal, pvp: pvp, pvpNeto: pvpNeto,
      margen: margen, margenPct: margenPct, foodCostPct: foodCostPct,
      pvpSugerido: pvpSugerido, pvpMinimo: pvpMinimo, envasado: envasado,
      pvpDeLinea: !!(r && r.tipo === 'plato' && (r.pvp == null || r.pvp === '')), pvpLinea: r && r.tipo === 'plato' ? precioLinea(ctx, r.linea) : null,
      rango: { min: (rc.minPorPorcion + guarn) * (1 + p.imprevistosPct / 100) + envase + overhead + comision,
               max: (rc.maxPorPorcion + guarn) * (1 + p.imprevistosPct / 100) + envase + overhead + comision },
      faltantes: rc.faltantes.concat(g ? g.faltantes : []), envaseFalta: envaseFalta, ciclo: rc.ciclo
    };
  }

  function esVendible(r) { return TIPOS_VENDIBLES.indexOf(r.tipo) >= 0; }

  function calcularTodo(state, opts) {
    const ctx = makeCtx(state, opts);
    const out = new Map();
    state.recetas.forEach(function (r) { if (esVendible(r)) out.set(r.id, costoPlato(ctx, r.id)); });
    out.ctx = ctx;
    return out;
  }

  /* ---------- guarniciones ---------- */
  function opcionesGuarnicion(ctx, id) {
    const r = ctx.recetas.get(id);
    if (!r) return [];
    const ids = (r.guarnicionesPermitidas || []).slice();
    return ids.map(function (gid) {
      const c = costoPlato(ctx, id, gid);
      const gr = ctx.recetas.get(gid);
      return { id: gid, nombre: gr ? gr.nombre : gid, costoGuarnicion: c.guarnicion, costoTotal: c.costoTotal,
        margen: c.margen, margenPct: c.margenPct, esDefecto: gid === r.guarnicionDefault };
    });
  }

  /* ---------- explosión de insumos (cantidades utilizables) ---------- */
  function explotar(ctx, id, mult, acc, stack) {
    acc = acc || new Map(); stack = stack || [];
    const r = ctx.recetas.get(id);
    if (!r || stack.indexOf(id) >= 0) return acc;
    const porciones = r.porciones > 0 ? r.porciones : 1;
    const sust = (ctx.opts.sust && ctx.opts.sust[id]) || {};
    (r.lineas || []).forEach(function (ln, idx) {
      const ref = sust[idx] || ln.ref;
      const q = (Number(ln.cantidad) || 0) * mult / porciones;
      if (ln.tipo === 'receta') {
        const sr = ctx.recetas.get(ref); const sp = sr && sr.porciones > 0 ? sr.porciones : 1;
        // ln.cantidad = porciones consumidas de la sub-receta; explotar su lote proporcional
        explotar(ctx, ref, q * sp, acc, stack.concat(id));
      } else {
        acc.set(ref, (acc.get(ref) || 0) + q);
      }
    });
    return acc;
  }

  // insumos por 1 porción vendida (incluye guarnición por defecto y envase)
  function explotarPlato(ctx, id, porciones) {
    porciones = porciones == null ? 1 : porciones;
    const r = ctx.recetas.get(id);
    const acc = explotar(ctx, id, porciones, new Map(), []);
    if (r && r.guarnicionDefault) explotar(ctx, r.guarnicionDefault, porciones, acc, []);
    if (r && r.envaseId) acc.set(r.envaseId, (acc.get(r.envaseId) || 0) + (r.envaseCant || 1) * porciones);
    return acc;
  }

  function usosDeInsumo(ctx, insumoId) {
    const res = [];
    ctx.state.recetas.forEach(function (r) {
      if (!esVendible(r)) return;
      const q = explotarPlato(ctx, r.id, 1).get(insumoId);
      if (q) res.push({ recetaId: r.id, nombre: r.nombre, linea: r.linea, tipo: r.tipo, cantidad: q });
    });
    return res.sort(function (a, b) { return b.cantidad - a.cantidad; });
  }

  /* ---------- impacto de un cambio (precio, oferta fijada, sustitución) ---------- */
  function impacto(state, cambio, opts) {
    const base = calcularTodo(state, opts);
    const merged = Object.assign({}, opts || {});
    ['precios', 'ofertaElegida', 'sust', 'params'].forEach(function (k) {
      if (cambio[k]) merged[k] = Object.assign({}, (opts && opts[k]) || {}, cambio[k]);
    });
    if (cambio.sust) {
      merged.sust = Object.assign({}, (opts && opts.sust) || {});
      Object.keys(cambio.sust).forEach(function (rid) {
        merged.sust[rid] = Object.assign({}, (opts && opts.sust && opts.sust[rid]) || {}, cambio.sust[rid]);
      });
    }
    const nuevo = calcularTodo(state, merged);
    const filas = [];
    base.forEach(function (b, id) {
      const n = nuevo.get(id);
      if (!n) return;
      const d = n.costoTotal - b.costoTotal;
      if (Math.abs(d) > 0.005) {
        filas.push({ id: id, nombre: b.nombre, costoAntes: b.costoTotal, costoDespues: n.costoTotal, delta: d,
          margenAntes: b.margen, margenDespues: n.margen, margenPctAntes: b.margenPct, margenPctDespues: n.margenPct });
      }
    });
    filas.sort(function (a, b) { return Math.abs(b.delta) - Math.abs(a.delta); });
    return { filas: filas, afectados: filas.length, deltaMedio: filas.length ? filas.reduce(function (s, f) { return s + f.delta; }, 0) / filas.length : 0 };
  }

  /* ---------- dieta ---------- */
  // migración: los insumos de pescados y mariscos marcados "con carne/pescado" pasan a pescetariano (una sola vez)
  function asegurarDietas(state) {
    state.params = state.params || {};
    if (state.params.dietasV2) return;
    (state.insumos || []).forEach(function (i) { if (i.dieta === 'omni' && normNombre(i.categoria) === normNombre('Pescados y mariscos')) i.dieta = 'pescetariano'; });
    state.params.dietasV2 = true;
  }
  function nivelDieta(ins) { return DIETA_NIVEL[ins && ins.dieta] != null ? DIETA_NIVEL[ins.dieta] : 0; }

  // insumos (directos o vía sub-recetas) que violan la línea dietaria de la receta
  function violacionesDieta(ctx, id) {
    const r = ctx.recetas.get(id);
    if (!r || LINEA_NIVEL_MAX[r.linea] == null) return [];
    const maxNivel = LINEA_NIVEL_MAX[r.linea];
    const acc = explotarPlato(ctx, id, 1);
    const out = [];
    acc.forEach(function (q, insId) {
      const ins = ctx.insumos.get(insId);
      if (ins && ins.categoria !== 'Envases' && nivelDieta(ins) > maxNivel) out.push(ins.nombre);
    });
    return out;
  }

  function dietaCompatible(ctx, receta, insumo) {
    if (!receta || LINEA_NIVEL_MAX[receta.linea] == null) return true;
    return nivelDieta(insumo) <= LINEA_NIVEL_MAX[receta.linea];
  }

  /* ---------- alternativas de producto ---------- */
  // Para cada línea de insumo de una receta: otras ofertas del mismo insumo + sustitutos de la misma familia
  function alternativasReceta(ctx, id) {
    const r = ctx.recetas.get(id);
    if (!r) return [];
    const porciones = r.porciones > 0 ? r.porciones : 1;
    const res = [];
    (r.lineas || []).forEach(function (ln, idx) {
      if (ln.tipo !== 'insumo') return;
      const ins = ctx.insumos.get(ln.ref);
      if (!ins) return;
      const actual = costoInsumo(ctx, ln.ref);
      const q = (Number(ln.cantidad) || 0) / porciones;
      const opciones = [];
      (ctx.ofertasPorInsumo.get(ln.ref) || []).forEach(function (o) {
        if (o.disponible === false || o.pendiente) return;
        if (actual.oferta && o.id === actual.oferta.id) return;
        const c = costoNetoOferta(ctx, o);
        opciones.push({ tipo: 'oferta', insumoId: ln.ref, ofertaId: o.id, nombre: ins.nombre, lugar: o.lugar, marca: o.marca,
          unit: c, enOferta: enOferta(ctx, o), deltaPorPorcion: (c - actual.unit) * q });
      });
      if (ins.familia) {
        ctx.state.insumos.forEach(function (s) {
          if (s.id === ins.id || normNombre(s.familia) !== normNombre(ins.familia) || s.unidad !== ins.unidad) return;
          if (!dietaCompatible(ctx, r, s)) return;
          const c = costoInsumo(ctx, s.id);
          if (c.missing) return;
          opciones.push({ tipo: 'sustituto', insumoId: s.id, ofertaId: c.oferta ? c.oferta.id : null, nombre: s.nombre,
            lugar: c.oferta ? c.oferta.lugar : '', marca: c.oferta ? c.oferta.marca : '', unit: c.unit, enOferta: c.modo === 'oportunidad' || enOferta(ctx, c.oferta),
            deltaPorPorcion: (c.unit - actual.unit) * q });
        });
      }
      opciones.sort(function (a, b) { return a.unit - b.unit; });   // de más barato a más caro
      res.push({ idx: idx, ref: ln.ref, nombre: ins.nombre, cantidad: ln.cantidad, unidad: ins.unidad, actual: actual,
        costoLinea: (Number(ln.cantidad) || 0) * actual.unit / porciones, opciones: opciones });
    });
    return res;
  }

  // porciones semanales por plato: plan semanal si existe, si no reparto parejo de porcionesSemana
  function volumenSemanal(ctx) {
    const vol = new Map();
    let usoPlan = false;
    if (ctx.state.plan) {
      DIAS.forEach(function (dia) {
        itemsDelDia(ctx, dia).forEach(function (it) {
          vol.set(it.recetaId, (vol.get(it.recetaId) || 0) + it.porciones); usoPlan = true;
        });
      });
    }
    if (!usoPlan) {
      const activos = ctx.state.recetas.filter(function (r) { return r.tipo === 'plato' && r.activo !== false; });
      activos.forEach(function (r) { vol.set(r.id, ctx.p.porcionesSemana / (activos.length || 1)); });
    }
    return { vol: vol, usoPlan: usoPlan };
  }

  function usoSemanalInsumos(ctx) {
    if (ctx.memoUso) return ctx.memoUso;
    const v = volumenSemanal(ctx);
    const total = new Map();
    v.vol.forEach(function (porc, rid) {
      explotarPlato(ctx, rid, porc).forEach(function (q, ins) { total.set(ins, (total.get(ins) || 0) + q); });
    });
    ctx.memoUso = { uso: total, usoPlan: v.usoPlan };
    return ctx.memoUso;
  }

  // ahorro posible por comprar cada insumo en su oferta más barata
  function ahorrosPosibles(ctx) {
    const u = usoSemanalInsumos(ctx);
    const res = [];
    ctx.state.insumos.forEach(function (ins) {
      const ofs = ofertasDisponibles(ctx, ins.id);
      if (ofs.length < 2) return;
      const actual = costoInsumo(ctx, ins.id);
      if (actual.missing) return;
      const costos = ofs.map(function (o) { return { o: o, c: costoNetoOferta(ctx, o) }; }).filter(function (x) { return x.c > 0; });
      if (!costos.length) return;
      const mejor = costos.reduce(function (a, b) { return b.c < a.c ? b : a; });
      const dif = actual.unit - mejor.c;
      const semanal = u.uso.get(ins.id) || 0;
      if (dif > 0.0001 && (!actual.oferta || mejor.o.id !== actual.oferta.id)) {
        res.push({ insumoId: ins.id, nombre: ins.nombre, actual: actual, mejor: mejor.o, mejorUnit: mejor.c,
          ahorroUnit: dif, ahorroPct: actual.unit > 0 ? dif / actual.unit * 100 : 0,
          usoSemanal: semanal, ahorroMes: dif * semanal * 4.33 });
      }
    });
    res.sort(function (a, b) { return b.ahorroMes - a.ahorroMes; });
    return { filas: res, usoPlan: u.usoPlan };
  }

  // peso de cada insumo en el costo total de la carta (por volumen semanal)
  function pesoEnCosto(ctx) {
    const u = usoSemanalInsumos(ctx);
    const filas = [];
    let total = 0;
    u.uso.forEach(function (q, id) {
      const ins = ctx.insumos.get(id); if (!ins) return;
      const c = costoInsumo(ctx, id);
      const costo = q * c.unit; total += costo;
      filas.push({ insumoId: id, nombre: ins.nombre, categoria: ins.categoria, costoSemana: costo });
    });
    filas.forEach(function (f) { f.pct = total > 0 ? f.costoSemana / total * 100 : 0; });
    filas.sort(function (a, b) { return b.costoSemana - a.costoSemana; });
    return { filas: filas, total: total };
  }

  /* ---------- lista de compras ---------- */
  // items: [{recetaId, porciones}]. Las campañas con compra mínima valen solo si el pedido a ese proveedor llega al monto;
  // si no llega, la lista se arma sin ellas. Cada fila del proveedor lleva minimosCampana: [{ id, nombre, pct, minimo, monto, falta, vale }].
  function listaCompras(ctx, items) {
    let cx = ctx, filas = filasCompra(cx, items);
    const bajo = [];
    for (let vuelta = 0; vuelta < 3; vuelta++) {
      const nuevas = estadoMinimos(cx, filas).filter(function (m) { return !m.vale; });
      if (!nuevas.length) break;
      nuevas.forEach(function (m) { bajo.push(m); });
      cx = variante(ctx, { campanasExcluidas: bajo.map(function (m) { return m.id; }) });
      filas = filasCompra(cx, items);
    }
    const vigentes = estadoMinimos(cx, filas).concat(bajo);
    filas.forEach(function (f) { f.minimosCampana = vigentes.filter(function (m) { return m.proveedorId === f.proveedorId; }); });
    return filas;
  }
  // campañas con compra mínima en juego en cada proveedor de la lista: las que usan sus filas, y las vigentes que no se alcanzaron
  function estadoMinimos(ctx, filas) {
    const porProv = new Map();
    filas.forEach(function (f) {
      if (!f.proveedorId || !f.ofertaId || !(f.packs > 0)) return;
      if (!porProv.has(f.proveedorId)) porProv.set(f.proveedorId, []);
      porProv.get(f.proveedorId).push(compraConOferta(ctx, ctx.ofertas.get(f.ofertaId), f.usable));
    });
    const out = [];
    porProv.forEach(function (its, pid) {
      const ids = [];
      its.forEach(function (it) { (it.campanas || []).forEach(function (id) { if (ids.indexOf(id) < 0) ids.push(id); }); });
      ids.forEach(function (id) {
        const e = ctx.campanas.get(id), minimo = e ? compraMinima(e.c) : 0;
        if (!minimo) return;
        const monto = montoParaMinimo(its, e.c);
        out.push({ id: id, proveedorId: pid, nombre: e.c.nombre || 'campaña', pct: Number(e.c.descuentoPct) || null, minimo: minimo, monto: monto,
          falta: monto >= minimo ? 0 : minimo - monto, vale: monto >= minimo });
      });
    });
    return out;
  }
  function filasCompra(ctx, items) {
    const acc = new Map();
    items.forEach(function (it) {
      if (!ctx.recetas.get(it.recetaId)) return;
      explotarPlato(ctx, it.recetaId, Number(it.porciones) || 0).forEach(function (q, ins) {
        acc.set(ins, (acc.get(ins) || 0) + q);
      });
    });
    const filas = [], stock = sobrestockVigente(ctx);
    acc.forEach(function (necesario, insId) {
      const ins = ctx.insumos.get(insId); if (!ins) return;
      const st = stock.get(insId);
      const cubierto = st ? Math.min(necesario, st.restante) : 0;
      const usable = necesario - cubierto;
      const c = costoInsumo(ctx, insId);
      const o = c.oferta;
      const rend = o ? (o.rendimiento != null ? o.rendimiento : (ins.rendimiento != null ? ins.rendimiento : 1)) : 1;
      const comprarBase = rend > 0 ? usable / rend : usable;
      const formato = o && o.formatoQty > 0 ? o.formatoQty : 0;
      const packs = formato > 0 && comprarBase > 0 ? Math.ceil(comprarBase / formato - 1e-9) : 0;
      const prov = proveedorDe(ctx, o);
      filas.push({ insumoId: insId, nombre: ins.nombre, categoria: ins.categoria, unidad: ins.unidad, ofertaId: o ? o.id : null, proveedorId: prov ? prov.id : null,
        usable: usable, comprarBase: comprarBase, lugar: prov ? prov.nombre : o ? (o.lugar || '(sin lugar)') : '(sin oferta)', formatoLabel: o ? o.formatoLabel : '',
        formatoQty: formato, packs: packs, precioPack: o ? precioPorPack(ctx, o, packs) : 0,
        costo: formato > 0 ? packs * precioPorPack(ctx, o, packs) : usable * c.unit, costoTeorico: usable * c.unit, missing: c.missing,
        promoCantidad: o ? promoCantidadVigente(ctx, o) : null,
        necesario: necesario, cubiertoStock: cubierto, oportunidad: c.modo === 'oportunidad' ? hastaOferta(ctx, o) : null });
    });
    // descuentos a la vista: lo mismo a precio normal (sin campañas, ofertas temporales ni promos) y qué promociones bajan el precio
    if (!ctx.opts.sinPromos) {
      const normal = variante(ctx, { sinPromos: true });
      filas.forEach(function (f) {
        const o = f.ofertaId ? ctx.ofertas.get(f.ofertaId) : null;
        const n = costoInsumo(normal, f.insumoId), on = n.oferta;
        f.costoNormal = on && on.formatoQty > 0 ? compraConOferta(normal, on, f.usable).bruto : (n.missing ? null : f.usable * n.unit);
        f.ahorroPromo = f.costoNormal != null && f.costoNormal > f.costo + 0.5 ? f.costoNormal - f.costo : 0;
        f.promos = [];
        if (!o) return;
        const e = campanaDe(ctx, o);
        if (e) f.promos.push({ tipo: 'campana', id: e.c.id, nombre: e.c.nombre || 'campaña', hasta: e.c.hasta || null });
        else if (o.temporal) f.promos.push({ tipo: 'temporal', id: null, nombre: 'oferta temporal', hasta: o.temporal.hasta || null });
        infoPrecio(ctx, o, f.packs, false).descuentos.forEach(function (d) { f.promos.push({ tipo: d.tipo, id: d.id, nombre: d.nombre, monto: d.monto * f.packs }); });
      });
    }
    filas.sort(function (a, b) { return a.lugar === b.lugar ? a.nombre.localeCompare(b.nombre) : a.lugar.localeCompare(b.lugar); });
    return filas;
  }

  /* ---------- membresías: ¿conviene activarla? ---------- */
  // ahorro mensual de activar la membresía de cada proveedor que la tiene inactiva (precios de socio + promos de despacho)
  function evaluarMembresias(ctx) {
    const u = usoSemanalInsumos(ctx);
    return (ctx.state.proveedores || []).filter(function (p) { return tieneMembresia(p) && p.activo !== false; }).map(function (p) {
      const activa = membresiaActiva(ctx, p);
      const conM = makeCtx(ctx.state, Object.assign({}, ctx.opts, { membresias: Object.assign({}, ctx.opts.membresias || {}, (function () { const m = {}; m[p.id] = true; return m; })()) }));
      const insumos = [];
      let ahorroMes = 0;
      u.uso.forEach(function (q, id) {
        if (!(q > 0)) return;
        const ofs = (ctx.ofertasPorInsumo.get(id) || []).filter(function (o) { return exigeMembresia(ctx, o) && !o.pendiente && o.disponible !== false && !fueraDeVigencia(ctx, o) && proveedorDe(ctx, o) === p; });
        if (!ofs.length) return;
        const hoy = activa ? costoInsumo(makeCtx(ctx.state, Object.assign({}, ctx.opts, { sinMembresia: p.id })), id) : costoInsumo(ctx, id);
        const mejor = ofs.map(function (o) { return { o: o, c: costoNetoOferta(conM, o) }; }).filter(function (x) { return x.c > 0; })
          .reduce(function (a, x) { return !a || x.c < a.c ? x : a; }, null);
        if (!mejor || hoy.missing) return;
        const dif = (hoy.unit - mejor.c) * q * SEMANAS_MES;
        if (dif > 0) { ahorroMes += dif; insumos.push({ insumoId: id, oferta: mejor.o, ahorroMes: dif }); }
      });
      const promos = (p.promosDespacho || []).filter(function (pr) { return pr.requiereMembresia && ['vigente', 'sin-membresia'].indexOf(estadoPromo(conM, p, pr)) >= 0; });
      const costoMes = Number(p.membresia.costoMensual) || 0;
      insumos.sort(function (a, b) { return b.ahorroMes - a.ahorroMes; });
      return { proveedor: p, activa: activa, nombre: p.membresia.nombre, costoMensual: costoMes, ahorroMes: ahorroMes, neto: ahorroMes - costoMes, insumos: insumos, promos: promos };
    });
  }

  /* ---------- urgencias: la forma más rápida de conseguir un insumo ---------- */
  // Todas las formas de conseguir `usable` de un insumo (ir a comprar, despacho normal o en promoción de cada proveedor),
  // ordenadas por rapidez y luego por costo total (productos + despacho o visita). plazoMax filtra (0 = hoy, 1 = mañana).
  function opcionesUrgencia(ctx, insumoId, usable, plazoMax) {
    const ins = ctx.insumos.get(insumoId);
    if (!ins || !(usable > 0)) return { opciones: [], normal: null };
    const c0 = costoInsumo(ctx, insumoId);
    const normalTotal = c0.oferta ? compraConOferta(ctx, c0.oferta, usable).bruto : null;
    const out = [];
    (ctx.ofertasPorInsumo.get(insumoId) || []).forEach(function (o) {
      if (o.disponible === false || fueraDeVigencia(ctx, o) || !ofertaHabilitada(ctx, o) || !(o.formatoQty > 0) || !(o.precio > 0)) return;
      const p = proveedorDe(ctx, o);
      if (!p || p.activo === false) return;
      const c = compraConOferta(ctx, o, usable), div = c.sinFactura ? 1 : divisorIva(ctx, p);
      const base = { oferta: o, proveedor: p, packs: c.packs, bruto: c.bruto, porRevisar: !!o.pendiente };
      if (p.retiro !== false && (!c.online || p.retiroOnline !== false)) {
        out.push(Object.assign({ modo: c.online ? 'retirar pedido online' : 'ir a comprar', promo: null, plazoDias: 0, horaCorte: '', logBruto: 0, logCosto: Number(p.costoVisita) || 0, faltaMinimo: 0 }, base));
      }
      if (c.soloTienda) return;   // precio de campaña solo en tienda: no se despacha
      // promos de despacho que no se acumulan con la campaña de este precio no valen aquí
      condicionesDespacho(ctx, p).filter(function (cd) {
        return !cd.promo || c.campanas.every(function (id) { const e = ctx.campanas.get(id); return !e || seAcumulan(e.c, cd.promo, 'despacho'); });
      }).forEach(function (cd) {
        const m = cd.alcance === 'seleccionados' ? (o.promoSeleccionado ? c.bruto : 0) : c.bruto;
        const gratis = cd.gratisDesde > 0 && m >= cd.gratisDesde, b = gratis ? 0 : cd.costo;
        out.push(Object.assign({ modo: 'despacho', promo: cd.nombre, plazoDias: plazoEntrega(ctx, cd), horaCorte: cd.horaCorte || '', logBruto: b, logCosto: b / div,
          faltaMinimo: cd.minimoPedido > m ? cd.minimoPedido - m : 0 }, base));
      });
    });
    out.forEach(function (x) {
      x.total = x.bruto + x.logBruto + (/ir a comprar|retirar/.test(x.modo) ? x.logCosto : 0);
      x.sobrecosto = normalTotal != null ? x.total - normalTotal : null;
      x.viable = !x.faltaMinimo;
    });
    const dias = function (x) { return x.plazoDias == null ? 99 : x.plazoDias; };
    let lista = out.filter(function (x) { return plazoMax == null || (x.plazoDias != null && x.plazoDias <= plazoMax); });
    lista.sort(function (a, b) { return (b.viable - a.viable) || (dias(a) - dias(b)) || (a.total - b.total); });
    const viables = lista.filter(function (x) { return x.viable; });
    const masBarata = viables.reduce(function (a, x) { return !a || x.total < a.total ? x : a; }, null);
    const masRapida = viables[0] || null;
    // comparación: lo mejor para hoy, para mañana y sin apuro (sin filtrar)
    const todas = out.filter(function (x) { return x.viable; });
    const mejorHasta = function (d) { return todas.filter(function (x) { return x.plazoDias != null && x.plazoDias <= d; }).reduce(function (a, x) { return !a || x.total < a.total ? x : a; }, null); };
    return { insumo: ins, usable: usable, opciones: lista, masRapida: masRapida, masBarata: masBarata, normalTotal: normalTotal,
      mejorHoy: mejorHasta(0), mejorManana: mejorHasta(1), mejorSinApuro: todas.reduce(function (a, x) { return !a || x.total < a.total ? x : a; }, null) };
  }
  // insumos cuyo sobrestock se acaba en `dias` días o menos (posibles quiebres)
  function quiebresProximos(ctx, dias) {
    const out = [];
    sobrestockVigente(ctx).forEach(function (r) { if (r.diasQueQuedan != null && r.diasQueQuedan <= dias) out.push(r); });
    return out.sort(function (a, b) { return a.diasQueQuedan - b.diasQueQuedan; });
  }

  /* ---------- compras de oportunidad y sobrestock temporal ---------- */
  // Sobrestock = lo comprado de más en una oferta. No es un inventario: se descuenta solo con el consumo semanal
  // estimado (plan semanal o volumen supuesto) y desaparece al agotarse.
  function sobrestockVigente(ctx) {
    const res = new Map(), lista = ctx.state.sobrestock || [];
    if (!lista.length) return res;
    const uso = usoSemanalInsumos(ctx).uso, hoy = hoyISO(ctx.p);
    lista.forEach(function (e) {
      if (!ctx.insumos.get(e.insumoId) || !(e.cantidad > 0)) return;
      const porDia = (uso.get(e.insumoId) || 0) / 7;
      const dias = Math.max(0, diasEntre(e.desde, hoy));
      const restante = e.cantidad - porDia * dias;
      if (restante <= 0.0001) return;
      const r = res.get(e.insumoId) || { insumoId: e.insumoId, restante: 0, entradas: [], porDia: porDia };
      r.restante += restante; r.entradas.push(Object.assign({ restante: restante }, e));
      res.set(e.insumoId, r);
    });
    res.forEach(function (r) {
      r.diasQueQuedan = r.porDia > 0 ? Math.floor(r.restante / r.porDia + 1e-9) : null;
      r.alcanzaHasta = r.diasQueQuedan != null ? fechaMenos(hoy, -r.diasQueQuedan) : null;
    });
    return res;
  }

  // Cuánto conviene comprar de una oferta: semanas de consumo limitadas por lo que dura guardado y por stockMaxSemanas.
  function sugerenciaOportunidad(ctx, ofertaId) {
    const o = ctx.ofertas.get(ofertaId);
    if (!o || !(o.formatoQty > 0) || !(precioOferta(ctx, o) > 0)) return null;
    const ins = ctx.insumos.get(o.insumoId);
    if (!ins) return null;
    const usoSemana = usoSemanalInsumos(ctx).uso.get(o.insumoId) || 0;
    const normal = costoInsumo(makeCtx(ctx.state, Object.assign({}, ctx.opts, { sinOportunidades: true })), o.insumoId);
    const brutoOferta = costoBrutoOferta(ctx, o);
    const brutoNormal = normal.oferta ? costoBrutoOferta(ctx, normal.oferta) : null;
    const maxSem = Math.max(1, Number(ctx.p.stockMaxSemanas) || 8);
    const dura = Number(ins.duracionDias) > 0 ? Number(ins.duracionDias) : null;
    const semanas = dura ? Math.max(1, Math.min(maxSem, Math.floor(dura / 7))) : 1;
    const rend = o.rendimiento != null ? o.rendimiento : (ins.rendimiento != null ? ins.rendimiento : 1);
    const st = sobrestockVigente(ctx).get(o.insumoId);
    const usable = Math.max(0, usoSemana * semanas - (st ? st.restante : 0));
    const base = rend > 0 ? usable / rend : usable;
    const packs = base > 0 ? Math.ceil(base / o.formatoQty - 1e-9) : 0;
    const usableComprado = packs * o.formatoQty * (rend || 1);
    return {
      oferta: o, insumo: ins, usoSemana: usoSemana, semanas: semanas, duracionDias: dura, limitadoPor: !dura ? 'sin-duracion' : (Math.floor(dura / 7) < maxSem ? 'duracion' : 'tope'),
      packs: packs, desembolso: packs * precioPorPack(ctx, o, packs), usableComprado: usableComprado,
      semanasCubiertas: usoSemana > 0 ? usableComprado / usoSemana : null,
      descuentoPct: brutoNormal ? (1 - brutoOferta / brutoNormal) * 100 : null,
      ahorro: brutoNormal ? (brutoNormal - brutoOferta) * usableComprado : null,
      ofertaNormal: normal.oferta, sobrestockActual: st ? st.restante : 0, diasParaVencer: diasParaVencer(ctx, o)
    };
  }

  // ofertas temporales vigentes (por revisar, en uso o como alternativa), ordenadas por vencimiento
  function ofertasTemporales(ctx) {
    return (ctx.state.ofertas || []).filter(function (o) { return esTemporal(o) && !ofertaVencida(ctx, o); })
      .sort(function (a, b) { return (hastaOferta(ctx, a) || '9999').localeCompare(hastaOferta(ctx, b) || '9999'); });
  }

  /* ---------- evolución de precios ---------- */
  function fechaMenos(iso, dias) { return new Date(Date.parse(iso) - dias * 86400000).toISOString().slice(0, 10); }

  // puntos de precio de una oferta (precio de compra por unidad base, antes de merma).
  // Las compras registradas se leen desde `compras`, así que aquí se omiten los precios con fuente 'compra'.
  function puntosOferta(o) {
    const q = o.formatoQty > 0 ? o.formatoQty : 0, pts = [];
    if (!q) return pts;
    const tipo = function (f) { return f === 'comprado' ? 'compra' : 'cotizacion'; };
    (o.historial || []).forEach(function (x) {
      if (x.fecha && x.precio > 0 && x.fuente !== 'compra') pts.push({ fecha: x.fecha, unit: x.precio / q, precio: x.precio, tipo: tipo(x.fuente), ofertaId: o.id });
    });
    if (o.fecha && o.precio > 0 && o.fuente !== 'compra') pts.push({ fecha: o.fecha, unit: o.precio / q, precio: o.precio, tipo: tipo(o.fuente), ofertaId: o.id, actual: true });
    return pts;
  }
  function puntosCompras(ctx, filtro) {
    const pts = [];
    (ctx.state.compras || []).forEach(function (c) {
      (c.lineas || []).forEach(function (l) {
        const q = (Number(l.cantidad) || 0) * (Number(l.formatoQty) || 0);
        if (!(q > 0) || !(l.total > 0) || !filtro(l, c)) return;
        pts.push({ fecha: c.fecha, unit: l.total / q, precio: l.total / l.cantidad, tipo: 'compra', ofertaId: l.ofertaId, compraId: c.id, proveedorId: c.proveedorId, conFactura: !!c.conFactura });
      });
    });
    return pts;
  }
  const porFecha = function (a, b) { return a.fecha < b.fecha ? -1 : a.fecha > b.fecha ? 1 : 0; };

  // series de precio de un insumo, una por proveedor
  function historialPrecios(ctx, insumoId) {
    const series = new Map();
    const add = function (key, nombre, pt) {
      if (!series.has(key)) series.set(key, { key: key, nombre: nombre, puntos: [] });
      series.get(key).puntos.push(pt);
    };
    (ctx.ofertasPorInsumo.get(insumoId) || []).forEach(function (o) {
      const p = proveedorDe(ctx, o);
      puntosOferta(o).forEach(function (pt) { add(p ? p.id : 'L:' + (o.lugar || ''), p ? p.nombre : (o.lugar || 'Sin lugar'), pt); });
    });
    puntosCompras(ctx, function (l) { return l.insumoId === insumoId; }).forEach(function (pt) {
      const p = ctx.proveedores.get(pt.proveedorId);
      add(p ? p.id : 'C:' + pt.proveedorId, p ? p.nombre : 'Proveedor eliminado', pt);
    });
    const out = Array.from(series.values());
    out.forEach(function (s) { s.puntos.sort(porFecha); });
    out.sort(function (a, b) { return a.nombre.localeCompare(b.nombre); });
    return out;
  }

  // variación del precio de compra de la oferta en uso entre hace `dias` y hoy
  function variacionInsumo(ctx, insumoId, dias) {
    const c = costoInsumo(ctx, insumoId), o = c.oferta;
    if (!o) return null;
    const pts = puntosOferta(o).concat(puntosCompras(ctx, function (l) { return l.ofertaId === o.id; })).sort(porFecha);
    if (!pts.length) return null;
    const limite = fechaMenos(hoyISO(ctx.p), dias);
    let antes = null;
    pts.forEach(function (pt) { if (pt.fecha <= limite) antes = pt; });
    const ahora = pts[pts.length - 1];
    if (!antes || !(antes.unit > 0)) return null;
    return { antes: antes, ahora: ahora, pct: (ahora.unit / antes.unit - 1) * 100 };
  }

  // alza de la canasta (ponderada por uso semanal) en los últimos `dias`
  function inflacionCanasta(ctx, dias) {
    const u = usoSemanalInsumos(ctx);
    let wA = 0, wB = 0, total = 0;
    const filas = [];
    u.uso.forEach(function (q, id) {
      if (!(q > 0)) return;
      total++;
      const v = variacionInsumo(ctx, id, dias);
      if (!v) return;
      wA += q * v.antes.unit; wB += q * v.ahora.unit;
      const ins = ctx.insumos.get(id);
      filas.push({ insumoId: id, nombre: ins ? ins.nombre : id, antes: v.antes, ahora: v.ahora, pct: v.pct });
    });
    filas.sort(function (a, b) { return Math.abs(b.pct) - Math.abs(a.pct); });
    return { pct: wA > 0 ? (wB / wA - 1) * 100 : null, cubiertos: filas.length, total: total, filas: filas };
  }

  /* ---------- datos tributarios (Chile) ---------- */
  const TIPOS_DOC = { '33': 'Factura electrónica', '34': 'Factura exenta electrónica', '39': 'Boleta electrónica', 'sd': 'Sin documento' };

  function limpiarRut(r) { return String(r || '').toUpperCase().replace(/[^0-9K]/g, ''); }
  function dvRut(cuerpo) {
    let s = 0, m = 2;
    for (let i = cuerpo.length - 1; i >= 0; i--) { s += Number(cuerpo[i]) * m; m = m === 7 ? 2 : m + 1; }
    const r = 11 - (s % 11);
    return r === 11 ? '0' : r === 10 ? 'K' : String(r);
  }
  // RUT válido según dígito verificador (módulo 11)
  function validarRut(r) {
    const c = limpiarRut(r);
    if (c.length < 2) return false;
    const cuerpo = c.slice(0, -1);
    return /^\d+$/.test(cuerpo) && dvRut(cuerpo) === c.slice(-1);
  }
  function formatearRut(r) {
    const c = limpiarRut(r);
    if (c.length < 2) return String(r || '');
    return c.slice(0, -1).replace(/^0+/, '').replace(/\B(?=(\d{3})+(?!\d))/g, '.') + '-' + c.slice(-1);
  }

  // compras antiguas solo tenían conFactura
  function tipoDocCompra(c) { return c.tipoDoc || (c.conFactura ? '33' : 'sd'); }
  function esFactura(doc) { return doc === '33' || doc === '34'; }

  // montos del documento: los de la factura si se ingresaron; si no, calculados desde el total pagado (con despacho)
  function montosCompra(ctx, c) {
    const f = factorIva(ctx), doc = tipoDocCompra(c);
    const total = (Number(c.total) || 0) + (Number(c.despachoPagado) || 0);
    let neto, iva, exento;
    if (c.neto != null && c.iva != null) { neto = Number(c.neto) || 0; iva = Number(c.iva) || 0; exento = Number(c.exento) || 0; }
    else if (doc === '34') { neto = 0; iva = 0; exento = total; }
    else { exento = Number(c.exento) || 0; neto = Math.round((total - exento) / f); iva = total - exento - neto; }
    return { doc: doc, total: total, neto: neto, iva: iva, exento: exento,
      credito: doc === '33' ? iva : 0, perdido: esFactura(doc) ? 0 : iva };
  }

  // libro de compras: una fila por documento, con avisos de datos que faltan para contabilidad
  function libroCompras(ctx, desde, hasta, soloFacturas) {
    const filas = [];
    (ctx.state.compras || []).forEach(function (c) {
      if ((desde && c.fecha < desde) || (hasta && c.fecha > hasta)) return;
      const m = montosCompra(ctx, c);
      if (soloFacturas && !esFactura(m.doc)) return;
      const p = ctx.proveedores.get(c.proveedorId) || {};
      const avisos = [];
      if (esFactura(m.doc)) {
        if (!p.rut) avisos.push('proveedor sin RUT');
        else if (!validarRut(p.rut)) avisos.push('RUT del proveedor inválido');
        if (!p.razonSocial) avisos.push('proveedor sin razón social');
        if (!String(c.nroDoc || '').trim()) avisos.push('sin folio');
      }
      filas.push({ compraId: c.id, fecha: c.fecha, tipoDoc: m.doc, tipoNombre: TIPOS_DOC[m.doc] || m.doc, folio: String(c.nroDoc || '').trim(),
        rut: p.rut ? formatearRut(p.rut) : '', razonSocial: p.razonSocial || '', proveedor: p.nombre || '(eliminado)',
        neto: m.neto, exento: m.exento, iva: m.iva, total: m.total, credito: m.credito, avisos: avisos });
    });
    filas.sort(function (a, b) { return a.fecha < b.fecha ? -1 : a.fecha > b.fecha ? 1 : String(a.folio).localeCompare(String(b.folio), 'es', { numeric: true }); });
    return filas;
  }

  /* ---------- IVA de compras ---------- */
  // IVA de compras registradas: crédito fiscal (con factura) e IVA que no se recupera (sin factura)
  function ivaCompras(ctx, desde, hasta) {
    const r = { bruto: 0, credito: 0, perdido: 0, conFactura: 0, sinFactura: 0, n: 0, porMes: {} };
    (ctx.state.compras || []).forEach(function (c) {
      if ((desde && c.fecha < desde) || (hasta && c.fecha > hasta)) return;
      const m = montosCompra(ctx, c), b = m.total;
      const mes = String(c.fecha || '').slice(0, 7);
      const pm = r.porMes[mes] = r.porMes[mes] || { bruto: 0, credito: 0, perdido: 0, n: 0 };
      r.n++; r.bruto += b; pm.bruto += b; pm.n++;
      r.credito += m.credito; pm.credito += m.credito; r.perdido += m.perdido; pm.perdido += m.perdido;
      if (esFactura(m.doc)) r.conFactura += b; else r.sinFactura += b;
    });
    return r;
  }

  // crédito fiscal mensual proyectado con el volumen semanal y las ofertas en uso
  function proyeccionIva(ctx) {
    const u = usoSemanalInsumos(ctx), f = factorIva(ctx), filas = [];
    let credito = 0, perdido = 0, gastoCon = 0, gastoSin = 0;
    u.uso.forEach(function (q, id) {
      const ins = ctx.insumos.get(id);
      if (!ins || !(q > 0)) return;
      const c = costoInsumo(ctx, id);
      const o = c.oferta || (ofertasDisponibles(ctx, id)[0] || null);
      if (c.missing || !o) return;
      const prov = proveedorDe(ctx, o), bruto = costoBrutoOferta(ctx, o);
      const gastoMes = q * bruto * SEMANAS_MES, iva = gastoMes - gastoMes / f;
      const fila = { insumoId: id, nombre: ins.nombre, oferta: o, proveedor: prov, gastoMes: gastoMes, iva: iva, conFactura: daFactura(prov) && !infoCostos(ctx, o).sinFactura };
      if (fila.conFactura) { credito += iva; gastoCon += gastoMes; }
      else {
        perdido += iva; gastoSin += gastoMes;
        // mejor alternativa con factura, comparando su costo una vez recuperado el IVA
        let mejor = null;
        ofertasDisponibles(ctx, id).forEach(function (x) {
          const px = proveedorDe(ctx, x);
          if (x.id === o.id || !daFactura(px) || infoCostos(ctx, x).sinFactura) return;
          const cb = costoBrutoOferta(ctx, x);
          if (!(cb > 0)) return;
          if (!mejor || cb < mejor.bruto) mejor = { oferta: x, proveedor: px, bruto: cb, neto: cb / f };
        });
        if (mejor) { fila.alternativa = mejor; fila.difMesAfecto = (mejor.neto - bruto) * q * SEMANAS_MES; fila.difMesHoy = (mejor.bruto - bruto) * q * SEMANAS_MES; }
      }
      filas.push(fila);
    });
    filas.sort(function (a, b) { return b.iva - a.iva; });
    return { creditoMes: credito, perdidoMes: perdido, gastoConFactura: gastoCon, gastoSinFactura: gastoSin, filas: filas, usoPlan: u.usoPlan };
  }

  /* ---------- evaluación de proveedores ---------- */
  function evaluarProveedores(ctx) {
    const u = usoSemanalInsumos(ctx);
    const minimo = new Map(), porProv = new Map();
    u.uso.forEach(function (q, id) {
      if (!(q > 0)) return;
      ofertasDisponibles(ctx, id).forEach(function (o) {
        const p = proveedorDe(ctx, o), c = costoNetoOferta(ctx, o);
        if (!p || !(c > 0)) return;
        if (!minimo.has(id) || c < minimo.get(id)) minimo.set(id, c);
        if (!porProv.has(p.id)) porProv.set(p.id, new Map());
        const m = porProv.get(p.id);
        if (!m.has(id) || c < m.get(id)) m.set(id, c);
      });
    });
    let valorTotal = 0;
    minimo.forEach(function (c, id) { valorTotal += c * u.uso.get(id); });
    const desde = fechaMenos(hoyISO(ctx.p), 30), gasto = new Map(), ultima = new Map();
    (ctx.state.compras || []).forEach(function (c) {
      if (c.fecha >= desde) gasto.set(c.proveedorId, (gasto.get(c.proveedorId) || 0) + (Number(c.total) || 0));
      if (!ultima.has(c.proveedorId) || c.fecha > ultima.get(c.proveedorId)) ultima.set(c.proveedorId, c.fecha);
    });
    const filas = (ctx.state.proveedores || []).map(function (p) {
      const m = porProv.get(p.id) || new Map();
      let vMin = 0, vProv = 0, mas = 0;
      m.forEach(function (c, id) {
        const q = u.uso.get(id);
        vMin += minimo.get(id) * q; vProv += c * q;
        if (c <= minimo.get(id) * 1.0001) mas++;
      });
      return { proveedor: p, cubiertos: m.size, masBaratos: mas, coberturaPct: valorTotal > 0 ? vMin / valorTotal * 100 : 0,
        indicePrecio: vMin > 0 ? vProv / vMin : null, costoSemana: vProv, gasto30: gasto.get(p.id) || 0, ultimaCompra: ultima.get(p.id) || null };
    });
    filas.sort(function (a, b) { return b.coberturaPct - a.coberturaPct || a.proveedor.nombre.localeCompare(b.proveedor.nombre); });
    return { filas: filas, insumosCanasta: minimo.size, valorCanastaSemana: valorTotal, usoPlan: u.usoPlan };
  }

  /* ---------- canasta óptima ---------- */
  // cantidades utilizables por insumo: del plan dado o, si no hay, del volumen semanal supuesto
  function necesidades(ctx, items) {
    const acc = new Map();
    if (items && items.length) {
      items.forEach(function (it) {
        if (!ctx.recetas.get(it.recetaId)) return;
        explotarPlato(ctx, it.recetaId, Number(it.porciones) || 0).forEach(function (q, ins) { acc.set(ins, (acc.get(ins) || 0) + q); });
      });
    } else usoSemanalInsumos(ctx).uso.forEach(function (q, id) { acc.set(id, q); });
    return acc;
  }

  // cubrir `usable` con una oferta, en formatos enteros (con las promociones que le aplican y sus condiciones)
  function compraConOferta(ctx, o, usable) {
    const ins = ctx.insumos.get(o.insumoId);
    const rend = o.rendimiento != null ? o.rendimiento : (ins && ins.rendimiento != null ? ins.rendimiento : 1);
    const base = rend > 0 ? usable / rend : usable;
    const packs = o.formatoQty > 0 ? Math.ceil(base / o.formatoQty - 1e-9) : 0;
    const info = infoPrecio(ctx, o, packs, false), bruto = packs * info.precio;
    const prov = proveedorDe(ctx, o);
    return { ofertaId: o.id, proveedorId: prov ? prov.id : null, packs: packs, bruto: bruto, costo: bruto / (info.sinFactura ? 1 : divisorIva(ctx, prov)),
      campanas: info.campanas, descuentos: info.descuentos.map(function (d) { return Object.assign({}, d, { monto: d.monto * packs }); }),
      sinFactura: info.sinFactura, online: info.online, soloTienda: info.soloTienda };
  }

  // cómo llega la compra de un proveedor y cuánto cuesta (despacho, despacho gratis o ir a buscar); null = imposible
  // online = el pedido incluye precios que solo valen comprando online: no se puede comprar en la tienda,
  // solo con despacho o retirando el pedido online (si el proveedor lo permite)
  // brutoSel = monto de los productos marcados para promociones (cuenta en las condiciones de alcance 'seleccionados')
  // ctx.opts.plazoMax = días máximos de espera: descarta los despachos que llegarían después (ir a buscar = hoy)
  // extra: { admite(condición) → false si una campaña del pedido no se acumula con esa promo de despacho,
  //          sinFactura (una campaña la excluye: sin crédito fiscal), soloTienda (precio de campaña solo en tienda: no se despacha) }
  function logistica(ctx, prov, bruto, online, brutoSel, extra) {
    extra = extra || {};
    if (online && extra.soloTienda) return null;   // parte solo online y parte solo en tienda: no hay un pedido que sirva
    const conds = extra.soloTienda ? [] : condicionesDespacho(ctx, prov).filter(function (c) { return !extra.admite || extra.admite(c); });
    const ops = [], max = ctx.opts.plazoMax, div = extra.sinFactura ? 1 : divisorIva(ctx, prov);
    const base = function (c) { return c.alcance === 'seleccionados' ? (Number(brutoSel) || 0) : bruto; };
    conds.forEach(function (c) {
      const m = base(c), dias = plazoEntrega(ctx, c);
      if (c.minimoPedido > 0 && m < c.minimoPedido) return;
      if (max != null && dias != null && dias > max) return;
      const gratis = c.gratisDesde > 0 && m >= c.gratisDesde;
      const b = gratis ? 0 : c.costo;
      ops.push({ modo: gratis || b === 0 ? 'despacho gratis' : 'despacho', bruto: b, costo: b / div, promo: c.nombre, promoId: c.id || null, plazoDias: dias, horaCorte: c.horaCorte || '' });
    });
    if (prov.retiro !== false && (!online || prov.retiroOnline !== false)) ops.push({ modo: online ? 'retiro pedido online' : 'retiro', bruto: 0, costo: Number(prov.costoVisita) || 0, promo: null, plazoDias: 0 });
    if (!ops.length) return null;
    // a igual costo, gana la que llega antes
    const r = ops.reduce(function (a, b) { return b.costo < a.costo - 0.01 || (Math.abs(b.costo - a.costo) <= 0.01 && (b.plazoDias == null ? 99 : b.plazoDias) < (a.plazoDias == null ? 99 : a.plazoDias)) ? b : a; });
    r.online = !!online;
    // lo que falta para el despacho gratis o para el mínimo más cercano entre las condiciones que valen hoy
    const faltas = function (campo) {
      return conds.map(function (c) { return c[campo] > 0 && base(c) < c[campo] ? c[campo] - base(c) : 0; }).filter(function (x) { return x > 0; });
    };
    const fg = conds.some(function (c) { return c.gratisDesde > 0 && base(c) >= c.gratisDesde; }) ? [] : faltas('gratisDesde');
    r.faltaGratis = fg.length ? Math.min.apply(null, fg) : 0;
    const fm = faltas('minimoPedido');
    r.faltaMinimo = fm.length && !conds.some(function (c) { return !(c.minimoPedido > base(c)); }) ? Math.min.apply(null, fm) : 0;
    return r;
  }
  function faltaMinimoDespacho(ctx, prov, bruto, brutoSel) {
    const fm = condicionesDespacho(ctx, prov).map(function (c) { const m = c.alcance === 'seleccionados' ? (Number(brutoSel) || 0) : bruto; return c.minimoPedido > m ? c.minimoPedido - m : 0; })
      .filter(function (x) { return x > 0; });
    return fm.length ? Math.min.apply(null, fm) : 0;
  }
  // monto de los ítems cuyas ofertas entran en las promociones de "productos seleccionados"
  function brutoSeleccionado(ctx, items) {
    return items.reduce(function (t, it) { const o = ctx.ofertas.get(it.ofertaId); return t + (o && o.promoSeleccionado ? (Number(it.bruto != null ? it.bruto : it.costo) || 0) : 0); }, 0);
  }
  function pedidoOnline(ctx, items) { return items.some(function (it) { return !!(it.online || esSoloOnline(ctx, ctx.ofertas.get(it.ofertaId))); }); }

  // arma un plan de compra a partir de la elección insumo → compra. Por proveedor elige qué promociones usar
  // (opcionesPromoGrupo): una campaña que no se acumula con la promo de despacho se compara contra el pedido sin ella.
  function armarPlan(ctx, nec, eleccion) {
    const grupos = new Map(), f = factorIva(ctx);
    let totalItems = 0, totalLog = 0, credito = 0, bruto = 0, viable = true;
    eleccion.forEach(function (e, insId) {
      const o = ctx.ofertas.get(e.ofertaId), p = proveedorDe(ctx, o), k = p ? p.id : 'L:' + (o.lugar || '');
      if (!grupos.has(k)) grupos.set(k, { proveedor: p, nombre: p ? p.nombre : (o.lugar || 'Sin proveedor'), items: [], bruto: 0, costo: 0 });
      const g = grupos.get(k);
      g.items.push(Object.assign({ insumoId: insId, usable: nec.get(insId) }, e));
      g.bruto += e.bruto; g.costo += e.costo;
    });
    grupos.forEach(function (g) {
      if (g.proveedor) {
        const ev = opcionesPromoGrupo(ctx, g.proveedor, g.items), m = ev.mejor;
        Object.assign(g, { items: m.items, bruto: m.bruto, costo: m.costo, online: m.online, brutoSel: m.brutoSel, sinFactura: m.sinFactura,
          campanas: m.campanas, campanasDescartadas: m.excluidas, opcionesPromo: ev.opciones.length > 1 ? ev.opciones : null, logistica: m.logistica,
          faltaCampana: m.faltaCampana || 0 });
      } else {
        g.online = pedidoOnline(ctx, g.items);
        g.brutoSel = brutoSeleccionado(ctx, g.items);
        g.campanas = []; g.campanasDescartadas = [];
        g.logistica = { modo: '—', bruto: 0, costo: 0, faltaGratis: 0, faltaMinimo: 0 };
      }
      if (!g.logistica) {
        viable = false;
        g.logistica = { modo: 'bajo el mínimo', bruto: 0, costo: 0, faltaGratis: 0, faltaMinimo: faltaMinimoDespacho(ctx, g.proveedor, g.bruto, g.brutoSel), online: g.online };
      }
      totalItems += g.costo;
      totalLog += g.logistica.costo;
      bruto += g.bruto + g.logistica.bruto;
      if (g.proveedor && daFactura(g.proveedor) && !g.sinFactura) credito += (g.bruto + g.logistica.bruto) * (1 - 1 / f);
    });
